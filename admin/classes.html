<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両クラス管理 - 管理画面</title>
  <link rel="preconnect" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="dns-prefetch" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">予約管理<small>管理画面</small></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section"><a href="index.html" class="nav-item">ダッシュボード</a></div>
        <div class="nav-section">
          <div class="nav-section-title">予約管理</div>
          <a href="reservations.html" class="nav-item">予約一覧</a>
          <a href="vehicle-schedule.html" class="nav-item">車両スケジュール</a>
          <a href="members.html" class="nav-item">会員管理</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">車両・サービス</div>
          <a href="classes.html" class="nav-item active">車両クラス</a>
          <a href="pricing.html" class="nav-item">料金設定</a>
          <a href="vehicles.html" class="nav-item">車両・在庫</a>
          <a href="options.html" class="nav-item">オプション</a>
          <a href="insurance.html" class="nav-item">保険プラン</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">設定</div>
          <a href="settings.html" class="nav-item">店舗設定</a>
          <a href="system-settings.html" class="nav-item">システム設定</a>
          <a href="documents.html" class="nav-item">法的文書</a>
        </div>
        <div class="nav-section">
          <a href="../index.html" class="nav-item" target="_blank">予約サイトへ</a>
          <a href="https://dashboard.stripe.com/" target="_blank" class="nav-item">Stripe管理</a>
        </div>
        <div class="nav-section nav-section-bottom">
          <button type="button" onclick="adminLogout()" class="nav-item nav-logout">ログアウト</button>
        </div>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">車両クラス管理</h1>
          <p class="admin-breadcrumb"><a href="index.html">ダッシュボード</a> / 車両クラス</p>
        </div>
        <button type="button" class="btn btn-primary" onclick="openAddModal()">+ クラスを追加</button>
      </div>

      <div class="admin-card">
        <div class="card-body" style="padding: 0;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>クラス名</th>
                <th>説明</th>
                <th>車両数</th>
                <th>ステータス</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="classes-tbody">
              <tr><td colspan="5" style="text-align:center;padding:40px;">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- 追加/編集モーダル -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal" style="max-width:500px;">
      <div class="modal-header">
        <h3 id="modal-title">車両クラスを追加</h3>
        <button type="button" class="modal-close" onclick="closeModal('edit-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label class="form-label">クラス名<span class="required">*</span></label>
          <input type="text" id="edit-name" class="form-input" placeholder="コンパクトクラス">
        </div>
        <div class="form-group">
          <label class="form-label">説明</label>
          <textarea id="edit-description" class="form-textarea" rows="2" placeholder="小回りが利いて運転しやすい"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">備考</label>
          <input type="text" id="edit-notes" class="form-input" placeholder="5人乗り / オートマ / ナビ付き">
        </div>
        <div class="form-group">
          <label class="form-label">画像URL</label>
          <input type="url" id="edit-imageUrl" class="form-input" placeholder="https://example.com/image.jpg" onblur="updateImagePreview()">
          <small style="color:#666;">車両クラスのイメージ画像URL</small>
          <div id="image-preview" style="margin-top:8px;"></div>
        </div>
        <div class="form-group">
          <label class="form-label">表示順</label>
          <input type="number" id="edit-order" class="form-input" min="0" value="0">
        </div>
        <div class="form-group">
          <label class="form-label">
            <input type="checkbox" id="edit-isActive" checked> 有効
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('edit-modal')">キャンセル</button>
        <button type="button" class="btn btn-primary" onclick="saveClass()">保存</button>
      </div>
    </div>
  </div>

  <!-- 削除モーダル -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal" style="max-width:450px;">
      <div class="modal-header">
        <h3>車両クラスを削除</h3>
        <button type="button" class="modal-close" onclick="closeModal('delete-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="delete-id">
        <p><strong id="delete-class-name"></strong> を削除しますか？</p>
        <div id="delete-vehicle-warning" style="display:none; background:#fff3cd; padding:12px; border-radius:4px; margin:12px 0;">
          <strong>⚠️ このクラスには車両が存在します</strong>
          <p style="margin:8px 0 0;">移行先のクラスを選択してください：</p>
          <select id="migrate-to-class" class="form-select" style="margin-top:8px;"></select>
        </div>
        <p style="color:#c00; margin-top:12px;">この操作は取り消せません。</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('delete-modal')">キャンセル</button>
        <button type="button" class="btn btn-danger" onclick="confirmDelete()">削除する</button>
      </div>
    </div>
  </div>

  
  <script src="common.js"></script>
  <script>
    let carClasses = [];

    async function loadClasses() {
      const tbody = document.getElementById('classes-tbody');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">読み込み中...</td></tr>';

      try {
        const result = await API.get('/v1/admin/car-classes');
        carClasses = Array.isArray(result) ? result : (result.data || []);

        if (carClasses.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">車両クラスがありません</td></tr>';
          return;
        }

        tbody.innerHTML = carClasses.map(c => `
          <tr>
            <td><strong>${escapeHtml(c.name)}</strong></td>
            <td>${escapeHtml(c.description) || '-'}</td>
            <td>${c.totalVehicles || 0}台</td>
            <td>
              <span class="badge ${c.isActive !== false ? 'badge-success' : 'badge-secondary'}">${c.isActive !== false ? '有効' : '無効'}</span>
            </td>
            <td class="actions">
              <button type="button" class="btn btn-sm btn-outline" data-edit-id="${c.id}">編集</button>
              <button type="button" class="btn btn-sm ${c.isActive !== false ? 'btn-secondary' : 'btn-success'}" data-toggle-id="${c.id}">
                ${c.isActive !== false ? '無効化' : '有効化'}
              </button>
              <button type="button" class="btn btn-sm btn-danger" data-delete-id="${c.id}">削除</button>
            </td>
          </tr>
        `).join('');
        
        // イベント委譲
        tbody.querySelectorAll('[data-edit-id]').forEach(btn => {
          btn.addEventListener('click', () => openEditModal(btn.dataset.editId));
        });
        tbody.querySelectorAll('[data-toggle-id]').forEach(btn => {
          btn.addEventListener('click', () => toggleStatus(btn.dataset.toggleId));
        });
        tbody.querySelectorAll('[data-delete-id]').forEach(btn => {
          btn.addEventListener('click', () => openDeleteModal(btn.dataset.deleteId));
        });
      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:#c00;">エラー: ${escapeHtml(error.message)}</td></tr>`;
      }
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = '車両クラスを追加';
      document.getElementById('edit-id').value = '';
      document.getElementById('edit-name').value = '';
      document.getElementById('edit-description').value = '';
      document.getElementById('edit-notes').value = '';
      document.getElementById('edit-imageUrl').value = '';
      document.getElementById('edit-order').value = '0';
      document.getElementById('edit-isActive').checked = true;
      document.getElementById('image-preview').innerHTML = '';
      openModal('edit-modal');
    }

    function openEditModal(id) {
      const c = carClasses.find(x => x.id === id);
      if (!c) return;
      document.getElementById('modal-title').textContent = '車両クラスを編集';
      document.getElementById('edit-id').value = c.id;
      document.getElementById('edit-name').value = c.name;
      document.getElementById('edit-description').value = c.description || '';
      document.getElementById('edit-notes').value = c.notes || '';
      document.getElementById('edit-imageUrl').value = c.imageUrl || '';
      document.getElementById('edit-order').value = c.sortOrder || 0;
      document.getElementById('edit-isActive').checked = c.isActive !== false;
      updateImagePreview();
      openModal('edit-modal');
    }

    function updateImagePreview() {
      const url = document.getElementById('edit-imageUrl').value;
      const preview = document.getElementById('image-preview');
      // XSS対策：http/https URLのみ許可
      if (url && /^https?:\/\//i.test(url)) {
        const img = document.createElement('img');
        img.src = url;
        img.style.cssText = 'max-width:200px;max-height:120px;border-radius:4px;';
        img.onerror = function() { this.style.display = 'none'; };
        preview.innerHTML = '';
        preview.appendChild(img);
      } else {
        preview.innerHTML = '';
      }
    }

    async function saveClass() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value;
      const description = document.getElementById('edit-description').value;
      const notes = document.getElementById('edit-notes').value;
      const imageUrl = document.getElementById('edit-imageUrl').value || null;
      const sortOrder = parseInt(document.getElementById('edit-order').value);
      const isActive = document.getElementById('edit-isActive').checked;

      if (!name) {
        alert('クラス名を入力してください');
        return;
      }

      try {
        if (id) {
          await API.put(`/v1/admin/car-classes/${id}`, { name, description, notes, imageUrl, sortOrder, isActive });
        } else {
          await API.post('/v1/admin/car-classes', { name, description, notes, imageUrl, sortOrder, isActive });
        }
        alert('保存しました');
        closeModal('edit-modal');
        loadClasses();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    async function toggleStatus(id) {
      const c = carClasses.find(x => x.id === id);
      if (!c) return;
      
      const newStatus = c.isActive === false;
      const action = newStatus ? '有効化' : '無効化';
      
      if (!confirm(`「${c.name}」を${action}しますか？`)) return;

      try {
        await API.put(`/v1/admin/car-classes/${id}`, { isActive: newStatus });
        loadClasses();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    async function openDeleteModal(id) {
      const c = carClasses.find(x => x.id === id);
      if (!c) return;

      document.getElementById('delete-id').value = c.id;
      document.getElementById('delete-class-name').textContent = c.name;

      const warning = document.getElementById('delete-vehicle-warning');
      const select = document.getElementById('migrate-to-class');

      // 実際の車両数をAPIで取得
      try {
        const vehiclesResult = await API.get(`/v1/admin/vehicles?carClassId=${id}&limit=100`);
        const vehicles = Array.isArray(vehiclesResult) ? vehiclesResult : (vehiclesResult.data || []);
        const vehicleCount = vehicles.length;
        
        // 車両数をクラスオブジェクトに保存（confirmDeleteで使用）
        c._vehicleCount = vehicleCount;

        if (vehicleCount > 0) {
          warning.style.display = 'block';
          warning.querySelector('strong').textContent = `⚠️ このクラスには${vehicleCount}台の車両があります`;
          // 他のクラスをセレクトに追加
          select.innerHTML = carClasses
            .filter(x => x.id !== c.id && x.isActive !== false)
            .map(x => `<option value="${x.id}">${x.name}</option>`)
            .join('');
        } else {
          warning.style.display = 'none';
        }
      } catch (e) {
        warning.style.display = 'none';
        c._vehicleCount = 0;
      }

      openModal('delete-modal');
    }

    async function confirmDelete() {
      const id = document.getElementById('delete-id').value;
      const c = carClasses.find(x => x.id === id);
      if (!c) return;

      let url = `/v1/admin/car-classes/${id}`;
      
      if (c._vehicleCount > 0) {
        const migrateToClassId = document.getElementById('migrate-to-class').value;
        if (!migrateToClassId) {
          alert('移行先のクラスを選択してください');
          return;
        }
        url += `?migrateToClassId=${migrateToClassId}`;
      }

      try {
        const result = await API.delete(url);
        alert(result.message || '削除しました');
        closeModal('delete-modal');
        loadClasses();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.addEventListener('DOMContentLoaded', loadClasses);
  </script>
</body>
</html>
