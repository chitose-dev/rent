<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法的文書管理 - 管理画面</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .document-editor {
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.6;
      min-height: 400px;
    }
    .preview-content {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 20px;
      max-height: 500px;
      overflow-y: auto;
    }
    .preview-content h1 { font-size: 24px; margin: 0 0 16px; }
    .preview-content h2 { font-size: 20px; margin: 24px 0 12px; }
    .preview-content h3 { font-size: 16px; margin: 20px 0 8px; }
    .preview-content p { margin: 8px 0; }
    .preview-content ul, .preview-content ol { margin: 8px 0; padding-left: 24px; }
    .preview-content table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    .preview-content th, .preview-content td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .tab-nav { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { padding: 10px 20px; background: #f0f0f0; border: none; border-radius: 6px 6px 0 0; cursor: pointer; }
    .tab.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .last-updated { font-size: 12px; color: #666; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- サイドバー -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">
          予約管理
          <small>管理画面</small></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <a href="index.html" class="nav-item">ダッシュボード</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">予約管理</div>
          <a href="reservations.html" class="nav-item">予約一覧</a>
          <a href="members.html" class="nav-item">会員管理</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">車両・サービス</div>
          <a href="classes.html" class="nav-item">車両クラス</a>
          <a href="pricing.html" class="nav-item">料金設定</a>
          <a href="vehicles.html" class="nav-item">車両・在庫</a>
          <a href="options.html" class="nav-item">オプション</a>
          <a href="insurance.html" class="nav-item">保険プラン</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">設定</div>
          <a href="settings.html" class="nav-item">店舗設定</a>
          <a href="system-settings.html" class="nav-item">システム設定</a>
          <a href="documents.html" class="nav-item active">法的文書</a>
        </div>
        <div class="nav-section nav-section-bottom">
          <button onclick="adminLogout()" class="nav-item nav-logout">ログアウト</button>
        </div>
      </nav>
    </aside>

    <!-- メインコンテンツ -->
    <main class="admin-main">
      <div class="page-header">
        <h1 class="page-title">法的文書管理</h1>
      </div>

      <div id="message" class="alert" style="display:none;"></div>

      <!-- タブ -->
      <div class="tab-nav">
        <button class="tab active" onclick="showTab('terms')">利用規約</button>
        <button class="tab" onclick="showTab('privacy')">プライバシーポリシー</button>
      </div>

      <!-- 利用規約タブ -->
      <div class="tab-content active" id="terms-tab">
        <div class="admin-card">
          <div class="card-header">
            <h2 class="card-title">利用規約</h2>
            <div class="btn-group">
              <button class="btn btn-sm btn-outline" onclick="togglePreview('terms')">プレビュー</button>
              <button class="btn btn-sm btn-primary" onclick="saveDocument('terms')">保存</button>
            </div>
          </div>
          <div class="card-body">
            <div class="last-updated" id="terms-updated"></div>
            <div id="terms-editor-wrap">
              <textarea class="form-textarea document-editor" id="terms-editor"></textarea>
            </div>
            <div id="terms-preview" class="preview-content" style="display:none;"></div>
          </div>
        </div>
      </div>

      <!-- プライバシーポリシータブ -->
      <div class="tab-content" id="privacy-tab">
        <div class="admin-card">
          <div class="card-header">
            <h2 class="card-title">プライバシーポリシー</h2>
            <div class="btn-group">
              <button class="btn btn-sm btn-outline" onclick="togglePreview('privacy')">プレビュー</button>
              <button class="btn btn-sm btn-primary" onclick="saveDocument('privacy')">保存</button>
            </div>
          </div>
          <div class="card-body">
            <div class="last-updated" id="privacy-updated"></div>
            <div id="privacy-editor-wrap">
              <textarea class="form-textarea document-editor" id="privacy-editor"></textarea>
            </div>
            <div id="privacy-preview" class="preview-content" style="display:none;"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  
  <script src="common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    let documents = {};

    document.addEventListener('DOMContentLoaded', () => {
      if (!AdminAuth.checkAuth()) return;
      loadDocuments();
    });

    async function loadDocuments() {
      try {
        const data = await API.get('/v1/admin/settings');
        documents = data.legalDocuments || {};

        document.getElementById('terms-editor').value = documents.terms || getDefaultTerms();
        document.getElementById('privacy-editor').value = documents.privacy || getDefaultPrivacy();

        if (documents.termsUpdatedAt) {
          document.getElementById('terms-updated').textContent = 
            '最終更新: ' + new Date(documents.termsUpdatedAt).toLocaleString('ja-JP');
        }
        if (documents.privacyUpdatedAt) {
          document.getElementById('privacy-updated').textContent = 
            '最終更新: ' + new Date(documents.privacyUpdatedAt).toLocaleString('ja-JP');
        }
      } catch (error) {
        console.error('文書読み込みエラー:', error);
      }
    }

    function showTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabName + '-tab').classList.add('active');
    }

    function togglePreview(type) {
      const editorWrap = document.getElementById(type + '-editor-wrap');
      const preview = document.getElementById(type + '-preview');
      const editor = document.getElementById(type + '-editor');

      if (preview.style.display === 'none') {
        preview.innerHTML = marked.parse(editor.value);
        preview.style.display = 'block';
        editorWrap.style.display = 'none';
      } else {
        preview.style.display = 'none';
        editorWrap.style.display = 'block';
      }
    }

    async function saveDocument(type) {
      const content = document.getElementById(type + '-editor').value;
      const data = {};
      data[type] = content;

      try {
        await API.put('/v1/admin/settings/legal-documents', data);
        showMessage(type === 'terms' ? '利用規約を保存しました' : 'プライバシーポリシーを保存しました', 'success');
        loadDocuments(); // 更新日時を反映
      } catch (error) {
        showMessage('保存に失敗しました: ' + error.message, 'error');
      }
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = `alert alert-${type === 'error' ? 'danger' : 'success'}`;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    function getDefaultTerms() {
      return `# 利用規約

## 第1条（適用）
本規約は、トクノリレンタカー（以下「当店」）が提供するレンタカーサービスの利用に関する条件を定めるものです。

## 第2条（利用資格）
当サービスは、以下の条件を満たす方がご利用いただけます。
- 有効な運転免許証をお持ちの方
- 20歳以上の方
- 運転免許取得後1年以上経過している方

## 第3条（予約）
- 予約はウェブサイトまたは電話にて承ります
- 予約内容の変更・キャンセルは所定の期限までにお申し出ください

## 第4条（キャンセル）
キャンセルには所定のキャンセル料が発生する場合があります。詳細はキャンセルポリシーをご確認ください。

## 第5条（免責事項）
当店は、天災・事故等の不可抗力による損害について責任を負いません。

---
制定日：${new Date().getFullYear()}年1月1日`;
    }

    function getDefaultPrivacy() {
      return `# プライバシーポリシー

## 1. 収集する情報
当店は以下の情報を収集します。
- 氏名、住所、電話番号、メールアドレス
- 運転免許証情報
- 決済に関する情報
- サービス利用履歴

## 2. 情報の利用目的
収集した情報は以下の目的で利用します。
- サービスの提供・運営
- お客様へのご連絡
- 利用規約違反への対応
- サービスの改善

## 3. 第三者への提供
当店は、以下の場合を除き、個人情報を第三者に提供しません。
- お客様の同意がある場合
- 法令に基づく場合

## 4. お問い合わせ
個人情報に関するお問い合わせは、下記までご連絡ください。

トクノリレンタカー
メール：tokunori@vipauto-iwade.com

---
制定日：${new Date().getFullYear()}年1月1日`;
    }
  </script>
</body>
</html>
