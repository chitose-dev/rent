<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダッシュボード - 管理画面</title>
  <link rel="preconnect" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="dns-prefetch" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">予約管理<small>管理画面</small></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <a href="index.html" class="nav-item active">ダッシュボード</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">予約管理</div>
          <a href="reservations.html" class="nav-item">予約一覧</a>
          <a href="vehicle-schedule.html" class="nav-item">車両スケジュール</a>
          <a href="members.html" class="nav-item">会員管理</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">車両・サービス</div>
          <a href="classes.html" class="nav-item">車両クラス</a>
          <a href="pricing.html" class="nav-item">料金設定</a>
          <a href="vehicles.html" class="nav-item">車両・在庫</a>
          <a href="options.html" class="nav-item">オプション</a>
          <a href="insurance.html" class="nav-item">保険プラン</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">設定</div>
          <a href="settings.html" class="nav-item">店舗設定</a>
          <a href="system-settings.html" class="nav-item">システム設定</a>
          <a href="documents.html" class="nav-item">法的文書</a>
          <a href="admins.html" class="nav-item">管理者管理</a>
        </div>
        <div class="nav-section">
          <a href="../index.html" class="nav-item" target="_blank">予約サイトへ</a>
          <a href="https://dashboard.stripe.com/" target="_blank" class="nav-item">Stripe管理</a>
        </div>
        <div class="nav-section nav-section-bottom">
          <button type="button" onclick="adminLogout()" class="nav-item nav-logout">ログアウト</button>
        </div>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">ダッシュボード</h1>
          <p class="admin-breadcrumb">トクノリレンタカー 管理画面</p>
        </div>
      </div>

      <!-- 統計カード -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
        <div class="admin-card">
          <div class="card-body" style="text-align: center;">
            <div style="font-size: 32px; font-weight: bold; color: #333;" id="stat-today">-</div>
            <div style="color: #666;">本日の予約</div>
          </div>
        </div>
        <div class="admin-card">
          <div class="card-body" style="text-align: center;">
            <div style="font-size: 32px; font-weight: bold; color: #2196F3;" id="stat-active">-</div>
            <div style="color: #666;">レンタル中</div>
          </div>
        </div>
        <div class="admin-card">
          <div class="card-body" style="text-align: center;">
            <div style="font-size: 32px; font-weight: bold; color: #4CAF50;" id="stat-available">-</div>
            <div style="color: #666;">利用可能車両</div>
          </div>
        </div>
        <div class="admin-card">
          <div class="card-body" style="text-align: center;">
            <div style="font-size: 32px; font-weight: bold; color: #FF9800;" id="stat-pending">-</div>
            <div style="color: #666;">対応待ち</div>
          </div>
        </div>
      </div>

      <!-- 返却遅延アラート -->
      <div class="admin-card" id="overdue-section" style="display: none; border-left: 4px solid #c00;">
        <div class="card-header" style="background: #ffebee;">
          <h2 class="card-title" style="color: #c00;">⚠️ 返却遅延アラート</h2>
        </div>
        <div class="card-body" style="padding: 0;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>予約番号</th>
                <th>会員</th>
                <th>車両</th>
                <th>返却予定</th>
                <th>遅延時間</th>
                <th>連絡先</th>
              </tr>
            </thead>
            <tbody id="overdue-reservations"></tbody>
          </table>
        </div>
      </div>

      <!-- 今日の予約 -->
      <div class="admin-card">
        <div class="card-header">
          <h2 class="card-title">本日の予約</h2>
          <a href="reservations.html" class="btn btn-sm btn-outline">すべて見る</a>
        </div>
        <div class="card-body" style="padding: 0;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>予約番号</th>
                <th>会員</th>
                <th>車両クラス</th>
                <th>時間</th>
                <th>ステータス</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="today-reservations">
              <tr><td colspan="6" style="text-align:center;padding:40px;">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  
  <script src="common.js"></script>
  <script>
    const statusLabels = {
      pending_payment: { text: '決済待ち', class: 'badge-warning' },
      confirmed: { text: '受取待ち', class: 'badge-info' },
      picked_up: { text: 'レンタル中', class: 'badge-success' },
      returned: { text: '返却済み', class: 'badge-secondary' },
      cancel_requested: { text: 'キャンセル申請', class: 'badge-danger' },
      cancelled: { text: 'キャンセル済', class: 'badge-secondary' },
    };

    function formatTime(isoString) {
      if (!isoString) return '-';
      const d = new Date(isoString);
      return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    async function loadOverdueReservations() {
      try {
        const result = await API.get('/v1/admin/reservations/overdue/list');
        const overdueList = result.data || [];
        
        const section = document.getElementById('overdue-section');
        const tbody = document.getElementById('overdue-reservations');
        
        if (overdueList.length === 0) {
          section.style.display = 'none';
          return;
        }
        
        section.style.display = 'block';
        
        tbody.innerHTML = overdueList.map(r => {
          const returnAt = new Date(r.returnAt);
          const returnStr = `${returnAt.getMonth()+1}/${returnAt.getDate()} ${returnAt.getHours()}:${String(returnAt.getMinutes()).padStart(2,'0')}`;
          return `
            <tr style="background: #fff5f5;">
              <td><strong>${escapeHtml(r.id)}</strong></td>
              <td>${escapeHtml(r.userName)}</td>
              <td>${escapeHtml(r.vehicleModel)}<br><small>${escapeHtml(r.vehicleLicensePlate)}</small></td>
              <td>${returnStr}</td>
              <td style="color: #c00; font-weight: bold;">${r.overdueHours}時間</td>
              <td>
                <a href="tel:${escapeHtml(r.userPhone)}" class="btn btn-sm btn-danger">📞 ${escapeHtml(r.userPhone)}</a>
              </td>
            </tr>
          `;
        }).join('');
      } catch (error) {
        console.error('遅延予約の読み込みエラー:', error);
      }
    }

    async function loadDashboard() {
      // 遅延アラートを先に読み込む
      await loadOverdueReservations();
      
      try {
        const stats = await API.get('/v1/admin/dashboard');
        document.getElementById('stat-today').textContent = stats.todayReservations || 0;
        document.getElementById('stat-active').textContent = stats.activeRentals || 0;
        document.getElementById('stat-available').textContent = stats.availableVehicles || 0;
        document.getElementById('stat-pending').textContent = stats.pendingActions || 0;
      } catch (error) {
        console.error('ダッシュボード統計エラー:', error);
      }

      // 本日の予約
      const tbody = document.getElementById('today-reservations');
      try {
        const today = new Date().toISOString().split('T')[0];
        const result = await API.get(`/v1/admin/reservations?pickupFrom=${today}T00:00:00&pickupTo=${today}T23:59:59&limit=10`);
        const reservations = Array.isArray(result) ? result : (result.data || []);

        if (reservations.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">本日の予約はありません</td></tr>';
          return;
        }

        tbody.innerHTML = reservations.map(r => {
          const st = statusLabels[r.status] || { text: r.status, class: 'badge-secondary' };
          return `
            <tr>
              <td><strong>${escapeHtml(r.id)}</strong></td>
              <td>${escapeHtml(r.userName) || '-'}</td>
              <td>${escapeHtml(r.carClassName) || '-'}</td>
              <td>${formatTime(r.pickupAt)} 〜 ${formatTime(r.returnAt)}</td>
              <td><span class="badge ${st.class}">${st.text}</span></td>
              <td><a href="reservations.html" class="btn btn-sm btn-outline">詳細</a></td>
            </tr>
          `;
        }).join('');
      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:#c00;">エラー: ${escapeHtml(error.message)}</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
