<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会員管理 - 管理画面</title>
  <link rel="preconnect" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="dns-prefetch" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">予約管理<small>管理画面</small></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section"><a href="index.html" class="nav-item">ダッシュボード</a></div>
        <div class="nav-section">
          <div class="nav-section-title">予約管理</div>
          <a href="reservations.html" class="nav-item">予約一覧</a>
          <a href="vehicle-schedule.html" class="nav-item">車両スケジュール</a>
          <a href="members.html" class="nav-item active">会員管理</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">車両・サービス</div>
          <a href="classes.html" class="nav-item">車両クラス</a>
          <a href="pricing.html" class="nav-item">料金設定</a>
          <a href="vehicles.html" class="nav-item">車両・在庫</a>
          <a href="options.html" class="nav-item">オプション</a>
          <a href="insurance.html" class="nav-item">保険プラン</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">設定</div>
          <a href="settings.html" class="nav-item">店舗設定</a>
          <a href="system-settings.html" class="nav-item">システム設定</a>
          <a href="documents.html" class="nav-item">法的文書</a>
          <a href="admins.html" class="nav-item">管理者管理</a>
        </div>
        <div class="nav-section">
          <a href="../index.html" class="nav-item" target="_blank">予約サイトへ</a>
          <a href="https://dashboard.stripe.com/" target="_blank" class="nav-item">Stripe管理</a>
        </div>
        <div class="nav-section nav-section-bottom">
          <button type="button" onclick="adminLogout()" class="nav-item nav-logout">ログアウト</button>
        </div>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">会員管理</h1>
          <p class="admin-breadcrumb"><a href="index.html">ダッシュボード</a> / 会員管理</p>
        </div>
      </div>

      <!-- 検索 -->
      <div class="admin-card" style="margin-bottom: 16px;">
        <div class="card-body" style="padding: 12px 20px;">
          <div style="display: flex; gap: 16px; align-items: center;">
            <input type="text" id="search-input" class="form-input" placeholder="名前・メール・電話番号で検索" style="width: 300px;">
            <select id="status-filter" class="form-select" style="width: 150px;">
              <option value="">全てのステータス</option>
              <option value="active">有効</option>
              <option value="suspended">停止中</option>
            </select>
            <button type="button" class="btn btn-primary btn-sm" onclick="loadMembers()">検索</button>
          </div>
        </div>
      </div>

      <!-- 会員一覧 -->
      <div class="admin-card">
        <div class="card-body" style="padding: 0;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>会員ID</th>
                <th>氏名</th>
                <th>メール</th>
                <th>電話番号</th>
                <th>予約数</th>
                <th>ステータス</th>
                <th>登録日</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="members-tbody">
              <tr><td colspan="8" style="text-align:center;padding:40px;">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:16px;"></div>
    </main>
  </div>

  <!-- 詳細モーダル -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal" style="max-width:600px;">
      <div class="modal-header">
        <h3>会員詳細</h3>
        <button type="button" class="modal-close" onclick="closeModal('detail-modal')">&times;</button>
      </div>
      <div class="modal-body" id="detail-modal-body">読み込み中...</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('detail-modal')">閉じる</button>
      </div>
    </div>
  </div>

  
  <script src="common.js"></script>
  <script>
    let currentPage = 1;

    function formatDate(isoString) {
      if (!isoString) return '-';
      return new Date(isoString).toLocaleDateString('ja-JP');
    }

    async function loadMembers() {
      const tbody = document.getElementById('members-tbody');
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;">読み込み中...</td></tr>';

      try {
        const search = document.getElementById('search-input').value;
        const status = document.getElementById('status-filter').value;
        let url = `/v1/admin/members?page=${currentPage}&limit=20`;
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (status) url += `&status=${status}`;

        const result = await API.get(url);
        const members = Array.isArray(result) ? result : (result.data || []);

        if (members.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;">会員がいません</td></tr>';
          return;
        }

        tbody.innerHTML = members.map(m => {
          // data-id属性へのXSS対策
          const safeId = escapeHtml(m.id);
          return `
          <tr>
            <td><small>${safeId}</small></td>
            <td><strong>${escapeHtml(m.name) || '-'}</strong></td>
            <td>${escapeHtml(m.email)}</td>
            <td>${escapeHtml(m.phone) || '-'}</td>
            <td>${m.totalReservations || 0}件</td>
            <td><span class="badge ${m.status === 'active' ? 'badge-success' : 'badge-danger'}">${m.status === 'active' ? '有効' : '停止'}</span></td>
            <td>${formatDate(m.createdAt)}</td>
            <td class="actions">
              <button type="button" class="btn btn-sm btn-outline" data-action="detail" data-id="${safeId}">詳細</button>
              ${m.status === 'active' 
                ? `<button type="button" class="btn btn-sm btn-danger" data-action="suspend" data-id="${safeId}">停止</button>`
                : `<button type="button" class="btn btn-sm btn-success" data-action="unsuspend" data-id="${safeId}">解除</button>`
              }
            </td>
          </tr>
        `}).join('');
        
        // イベント委譲でアクションボタンを処理
        tbody.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', function() {
            const action = this.dataset.action;
            const id = this.dataset.id;
            if (action === 'detail') showDetail(id);
            else if (action === 'suspend') suspendMember(id);
            else if (action === 'unsuspend') unsuspendMember(id);
          });
        });

        if (result.pagination) renderPagination(result.pagination);
      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#c00;">エラー: ${escapeHtml(error.message)}</td></tr>`;
      }
    }

    function renderPagination(p) {
      const container = document.getElementById('pagination');
      if (p.totalPages <= 1) { container.innerHTML = ''; return; }
      let html = '';
      for (let i = 1; i <= p.totalPages; i++) {
        html += `<button type="button" class="btn btn-sm ${i === p.page ? 'btn-primary' : 'btn-outline'}" data-page="${i}">${i}</button>`;
      }
      container.innerHTML = html;
      container.querySelectorAll('[data-page]').forEach(btn => {
        btn.addEventListener('click', () => goToPage(parseInt(btn.dataset.page)));
      });
    }

    function goToPage(page) { currentPage = page; loadMembers(); }

    let currentMemberId = null;

    async function showDetail(id) {
      currentMemberId = id;
      openModal('detail-modal');
      const body = document.getElementById('detail-modal-body');
      body.innerHTML = '読み込み中...';
      try {
        const m = await API.get(`/v1/admin/members/${id}`);
        body.innerHTML = `
          <table style="width:100%;border-collapse:collapse;">
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;width:120px;">ID</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(m.id)}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">氏名</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(m.name) || '-'}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">メール</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(m.email)}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">電話番号</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(m.phone) || '-'}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">ステータス</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(m.status)}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">予約数</th><td style="padding:8px;border-bottom:1px solid #eee;">${m.totalReservations || 0}件</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">利用金額</th><td style="padding:8px;border-bottom:1px solid #eee;">¥${(m.totalSpent || 0).toLocaleString()}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">登録日</th><td style="padding:8px;border-bottom:1px solid #eee;">${formatDate(m.createdAt)}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">最終ログイン</th><td style="padding:8px;border-bottom:1px solid #eee;">${formatDate(m.lastLoginAt)}</td></tr>
          </table>
          <div style="margin-top:16px;">
            <label style="font-weight:600;display:block;margin-bottom:8px;">管理者メモ</label>
            <textarea id="member-notes" class="form-textarea" rows="3" placeholder="この会員に関するメモ...">${escapeHtml(m.adminNotes || '')}</textarea>
            <button type="button" class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="saveNotes()">メモを保存</button>
          </div>
        `;
      } catch (error) {
        body.innerHTML = `<p style="color:#c00;">エラー: ${escapeHtml(error.message)}</p>`;
      }
    }

    async function saveNotes() {
      if (!currentMemberId) return;
      const notes = document.getElementById('member-notes').value;
      try {
        await API.put(`/v1/admin/members/${currentMemberId}/notes`, { notes });
        alert('メモを保存しました');
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    async function suspendMember(id) {
      const reason = prompt('停止理由を入力してください:');
      if (!reason) return;
      try {
        await API.put(`/v1/admin/members/${id}/suspend`, { reason });
        alert('会員を停止しました');
        loadMembers();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    async function unsuspendMember(id) {
      if (!confirm('停止を解除しますか？')) return;
      try {
        await API.delete(`/v1/admin/members/${id}/suspend`);
        alert('停止を解除しました');
        loadMembers();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.addEventListener('DOMContentLoaded', loadMembers);
  </script>
</body>
</html>
