<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オプション管理 - 管理画面</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">予約管理<small>管理画面</small></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section"><a href="index.html" class="nav-item">ダッシュボード</a></div>
        <div class="nav-section">
          <div class="nav-section-title">予約管理</div>
          <a href="reservations.html" class="nav-item">予約一覧</a>
          <a href="members.html" class="nav-item">会員管理</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">車両・サービス</div>
          <a href="classes.html" class="nav-item">車両クラス</a>
          <a href="pricing.html" class="nav-item">料金設定</a>
          <a href="vehicles.html" class="nav-item">車両・在庫</a>
          <a href="options.html" class="nav-item">オプション</a>
          <a href="insurance.html" class="nav-item">保険プラン</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">設定</div>
          <a href="settings.html" class="nav-item">店舗設定</a>
          <a href="system-settings.html" class="nav-item">システム設定</a>
          <a href="documents.html" class="nav-item">法的文書</a>
        </div>
        <div class="nav-section">
          <a href="../index.html" class="nav-item" target="_blank">予約サイトへ →</a>
        </div>
        <div class="nav-section nav-section-bottom">
          <button onclick="adminLogout()" class="nav-item nav-logout">ログアウト</button>
        </div>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">オプション管理</h1>
          <p class="admin-breadcrumb"><a href="index.html">ダッシュボード</a> / オプション管理</p>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">+ オプションを追加</button>
      </div>

      <div class="admin-card">
        <div class="card-body" style="padding: 0;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>オプション名</th>
                <th>説明</th>
                <th>日額</th>
                <th>最大数</th>
                <th>ステータス</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="options-tbody">
              <tr><td colspan="6" style="text-align:center;padding:40px;">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- 追加/編集モーダル -->
  <div class="modal" id="edit-modal">
    <div class="modal-content" style="max-width:500px;">
      <div class="modal-header">
        <h3 id="modal-title">オプションを追加</h3>
        <button class="modal-close" onclick="closeModal('edit-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label class="form-label">オプション名<span class="required">*</span></label>
          <input type="text" id="edit-name" class="form-input" placeholder="チャイルドシート">
        </div>
        <div class="form-group">
          <label class="form-label">説明</label>
          <textarea id="edit-description" class="form-textarea" rows="2" placeholder="乳幼児用チャイルドシート"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">日額（税込）<span class="required">*</span></label>
            <input type="number" id="edit-price" class="form-input" min="0" placeholder="550">
          </div>
          <div class="form-group">
            <label class="form-label">最大数量<span class="required">*</span></label>
            <input type="number" id="edit-max" class="form-input" min="1" value="5">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">表示順</label>
          <input type="number" id="edit-order" class="form-input" min="0" value="0">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('edit-modal')">キャンセル</button>
        <button class="btn btn-primary" onclick="saveOption()">保存</button>
      </div>
    </div>
  </div>

  
  <script src="common.js"></script>
  <script>
    let options = [];

    async function loadOptions() {
      const tbody = document.getElementById('options-tbody');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">読み込み中...</td></tr>';

      try {
        const result = await API.get('/v1/admin/options');
        options = result.data || [];

        if (options.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">オプションがありません</td></tr>';
          return;
        }

        tbody.innerHTML = options.map(o => `
          <tr>
            <td><strong>${o.name}</strong></td>
            <td>${o.description || '-'}</td>
            <td>¥${o.pricePerDay.toLocaleString()}/日</td>
            <td>${o.maxQuantity}</td>
            <td><span class="badge ${o.isActive !== false ? 'badge-success' : 'badge-secondary'}">${o.isActive !== false ? '有効' : '無効'}</span></td>
            <td class="actions">
              <button class="btn btn-sm btn-outline" data-edit-id="${o.id}">編集</button>
              <button class="btn btn-sm ${o.isActive !== false ? 'btn-danger' : 'btn-success'}" data-toggle-id="${o.id}" data-active="${o.isActive !== false}">${o.isActive !== false ? '無効化' : '有効化'}</button>
            </td>
          </tr>
        `).join('');
        
        // イベント委譲で編集・トグルボタンを処理
        tbody.querySelectorAll('[data-edit-id]').forEach(btn => {
          btn.addEventListener('click', () => openEditModal(btn.dataset.editId));
        });
        tbody.querySelectorAll('[data-toggle-id]').forEach(btn => {
          btn.addEventListener('click', () => toggleOption(btn.dataset.toggleId, btn.dataset.active === 'true'));
        });
      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:#c00;">エラー: ${error.message}</td></tr>`;
      }
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'オプションを追加';
      document.getElementById('edit-id').value = '';
      document.getElementById('edit-name').value = '';
      document.getElementById('edit-description').value = '';
      document.getElementById('edit-price').value = '';
      document.getElementById('edit-max').value = '5';
      document.getElementById('edit-order').value = '0';
      openModal('edit-modal');
    }

    function openEditModal(id) {
      const o = options.find(x => x.id === id);
      if (!o) return;
      document.getElementById('modal-title').textContent = 'オプションを編集';
      document.getElementById('edit-id').value = o.id;
      document.getElementById('edit-name').value = o.name;
      document.getElementById('edit-description').value = o.description || '';
      document.getElementById('edit-price').value = o.pricePerDay;
      document.getElementById('edit-max').value = o.maxQuantity;
      document.getElementById('edit-order').value = o.sortOrder || 0;
      openModal('edit-modal');
    }

    async function saveOption() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value;
      const description = document.getElementById('edit-description').value;
      const pricePerDay = parseInt(document.getElementById('edit-price').value);
      const maxQuantity = parseInt(document.getElementById('edit-max').value);
      const sortOrder = parseInt(document.getElementById('edit-order').value);

      if (!name || isNaN(pricePerDay) || isNaN(maxQuantity)) {
        alert('必須項目を入力してください');
        return;
      }

      try {
        if (id) {
          await API.put(`/v1/admin/options/${id}`, { name, description, pricePerDay, maxQuantity, sortOrder });
        } else {
          await API.post('/v1/admin/options', { name, description, pricePerDay, maxQuantity, sortOrder });
        }
        alert('保存しました');
        closeModal('edit-modal');
        loadOptions();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    async function toggleOption(id, isCurrentlyActive) {
      const action = isCurrentlyActive ? '無効化' : '有効化';
      if (!confirm(`このオプションを${action}しますか？`)) return;
      try {
        await API.put(`/v1/admin/options/${id}`, { isActive: !isCurrentlyActive });
        loadOptions();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.addEventListener('DOMContentLoaded', loadOptions);
  </script>
</body>
</html>
