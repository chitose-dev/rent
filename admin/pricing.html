<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>料金設定 - 管理画面</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .pricing-matrix {
      overflow-x: auto;
    }
    .pricing-table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px;
    }
    .pricing-table th,
    .pricing-table td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: center;
      min-width: 100px;
    }
    .pricing-table th {
      background: #f5f5f5;
      font-weight: 600;
    }
    .pricing-table th.class-name {
      text-align: left;
      min-width: 150px;
    }
    .pricing-table td.class-name {
      text-align: left;
      background: #fafafa;
      font-weight: 500;
    }
    .pricing-table .add-day-col {
      background: #f0f0f0;
      cursor: pointer;
      color: #666;
    }
    .pricing-table .add-day-col:hover {
      background: #e0e0e0;
    }
    .price-input {
      width: 80px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: right;
      font-size: 14px;
    }
    .price-input:focus {
      border-color: #007bff;
      outline: none;
    }
    .price-display {
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .price-display:hover {
      background: #e3f2fd;
    }
    .day-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .delete-day-btn {
      background: none;
      border: none;
      color: #c00;
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
      opacity: 0.5;
    }
    .delete-day-btn:hover {
      opacity: 1;
    }
    .empty-price {
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">予約管理<small>管理画面</small></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section"><a href="index.html" class="nav-item">ダッシュボード</a></div>
        <div class="nav-section">
          <div class="nav-section-title">予約管理</div>
          <a href="reservations.html" class="nav-item">予約一覧</a>
          <a href="members.html" class="nav-item">会員管理</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">車両・サービス</div>
          <a href="classes.html" class="nav-item">車両クラス</a>
          <a href="pricing.html" class="nav-item active">料金設定</a>
          <a href="vehicles.html" class="nav-item">車両・在庫</a>
          <a href="options.html" class="nav-item">オプション</a>
          <a href="insurance.html" class="nav-item">保険プラン</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">設定</div>
          <a href="settings.html" class="nav-item">店舗設定</a>
          <a href="system-settings.html" class="nav-item">システム設定</a>
          <a href="documents.html" class="nav-item">法的文書</a>
        </div>
        <div class="nav-section">
          <a href="../index.html" class="nav-item" target="_blank">予約サイトへ →</a>
          <a href="https://dashboard.stripe.com/" target="_blank" class="nav-item">Stripe管理</a>
        </div>
        <div class="nav-section nav-section-bottom">
          <button onclick="adminLogout()" class="nav-item nav-logout">ログアウト</button>
        </div>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">料金設定</h1>
          <p class="admin-breadcrumb"><a href="index.html">ダッシュボード</a> / 料金設定</p>
        </div>
        <button class="btn btn-primary" onclick="addDayColumn()">+ 日数を追加</button>
      </div>

      <div class="admin-card">
        <div class="card-body pricing-matrix">
          <table class="pricing-table" id="pricing-table">
            <thead>
              <tr id="header-row">
                <th class="class-name">車両クラス</th>
                <!-- 日数列がここに動的に追加される -->
              </tr>
            </thead>
            <tbody id="pricing-tbody">
              <tr><td colspan="10" style="text-align:center;padding:40px;">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div style="margin-top:16px; color:#666; font-size:14px;">
        <p>💡 料金セルをクリックして編集できます。変更は自動保存されます。</p>
      </div>
    </main>
  </div>

  <!-- 日数追加モーダル -->
  <div class="modal-overlay" id="add-day-modal">
    <div class="modal" style="max-width:350px;">
      <div class="modal-header">
        <h3>日数を追加</h3>
        <button class="modal-close" onclick="closeModal('add-day-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">日数<span class="required">*</span></label>
          <input type="number" id="new-days" class="form-input" min="1" value="1" placeholder="例: 7">
        </div>
        <div class="form-group">
          <label class="form-label">ラベル（任意）</label>
          <input type="text" id="new-label" class="form-input" placeholder="例: 1週間">
          <small style="color:#666;">空欄の場合は「◯日」と表示</small>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('add-day-modal')">キャンセル</button>
        <button class="btn btn-primary" onclick="confirmAddDay()">追加</button>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    let carClasses = [];
    let pricingPlans = [];
    let dayColumns = []; // ユニークな日数リスト

    async function loadData() {
      try {
        // 車両クラス取得
        const classResult = await API.get('/v1/admin/car-classes');
        carClasses = Array.isArray(classResult) ? classResult : (classResult.data || []);
        carClasses = carClasses.filter(c => c.isActive !== false);

        // 料金プラン取得
        const pricingResult = await API.get('/v1/admin/pricing');
        pricingPlans = Array.isArray(pricingResult) ? pricingResult : (pricingResult.data || []);

        // ユニークな日数を抽出してソート
        const daysSet = new Set(pricingPlans.map(p => p.days));
        dayColumns = Array.from(daysSet).sort((a, b) => a - b);

        renderTable();
      } catch (error) {
        document.getElementById('pricing-tbody').innerHTML = 
          `<tr><td colspan="10" style="text-align:center;padding:40px;color:#c00;">エラー: ${error.message}</td></tr>`;
      }
    }

    function renderTable() {
      // ヘッダー行を構築
      const headerRow = document.getElementById('header-row');
      headerRow.innerHTML = '<th class="class-name">車両クラス</th>';
      
      dayColumns.forEach(days => {
        const plan = pricingPlans.find(p => p.days === days);
        const label = plan?.label || `${days}日`;
        headerRow.innerHTML += `
          <th>
            <div class="day-header">
              <span>${label}</span>
              <button class="delete-day-btn" onclick="deleteDay(${days})" title="この日数を削除">×</button>
            </div>
          </th>
        `;
      });

      // ボディを構築
      const tbody = document.getElementById('pricing-tbody');
      
      if (carClasses.length === 0) {
        tbody.innerHTML = '<tr><td colspan="' + (dayColumns.length + 1) + '" style="text-align:center;padding:40px;">車両クラスがありません</td></tr>';
        return;
      }

      tbody.innerHTML = carClasses.map(c => {
        let row = `<td class="class-name">${c.name}</td>`;
        
        dayColumns.forEach(days => {
          const plan = pricingPlans.find(p => p.carClassId === c.id && p.days === days);
          if (plan) {
            row += `
              <td>
                <span class="price-display" onclick="editPrice('${c.id}', ${days}, '${plan.id}')" data-plan-id="${plan.id}">
                  ¥${plan.price.toLocaleString()}
                </span>
              </td>
            `;
          } else {
            row += `
              <td>
                <span class="price-display empty-price" onclick="editPrice('${c.id}', ${days}, null)">
                  未設定
                </span>
              </td>
            `;
          }
        });

        return `<tr>${row}</tr>`;
      }).join('');
    }

    function editPrice(classId, days, planId) {
      const plan = planId ? pricingPlans.find(p => p.id === planId) : null;
      const currentPrice = plan ? plan.price : '';
      
      const newPrice = prompt(
        `${carClasses.find(c => c.id === classId)?.name} - ${days}日の料金（税込）:`,
        currentPrice
      );

      if (newPrice === null) return; // キャンセル

      const price = parseInt(newPrice);
      if (isNaN(price) || price < 0) {
        alert('有効な金額を入力してください');
        return;
      }

      savePrice(classId, days, price, planId);
    }

    async function savePrice(classId, days, price, planId) {
      try {
        if (planId) {
          // 更新
          await API.put(`/v1/admin/pricing/${planId}`, { price });
        } else {
          // 新規作成
          const label = `${days}日`;
          await API.post('/v1/admin/pricing', { carClassId: classId, days, price, label });
        }
        await loadData(); // 再読み込み
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    function addDayColumn() {
      // 既存の日数から次の候補を計算
      const nextDay = dayColumns.length > 0 ? Math.max(...dayColumns) + 1 : 1;
      document.getElementById('new-days').value = nextDay;
      document.getElementById('new-label').value = '';
      openModal('add-day-modal');
    }

    async function confirmAddDay() {
      const days = parseInt(document.getElementById('new-days').value);
      const label = document.getElementById('new-label').value || `${days}日`;

      if (isNaN(days) || days < 1) {
        alert('有効な日数を入力してください');
        return;
      }

      if (dayColumns.includes(days)) {
        alert('この日数は既に存在します');
        return;
      }

      // 全クラスに対してこの日数のプランを作成（料金は0で仮登録）
      try {
        for (const c of carClasses) {
          await API.post('/v1/admin/pricing', {
            carClassId: c.id,
            days,
            price: 0,
            label
          });
        }
        closeModal('add-day-modal');
        await loadData();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    async function deleteDay(days) {
      if (!confirm(`${days}日の料金設定を全クラスから削除しますか？`)) return;

      try {
        // この日数の全プランを削除
        const plansToDelete = pricingPlans.filter(p => p.days === days);
        for (const plan of plansToDelete) {
          await API.delete(`/v1/admin/pricing/${plan.id}`);
        }
        await loadData();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
