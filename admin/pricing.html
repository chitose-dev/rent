<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>料金設定 - 管理画面</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">予約管理<small>管理画面</small></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section"><a href="index.html" class="nav-item">ダッシュボード</a></div>
        <div class="nav-section">
          <div class="nav-section-title">予約管理</div>
          <a href="reservations.html" class="nav-item">予約一覧</a>
          <a href="members.html" class="nav-item">会員管理</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">車両・サービス</div>
          <a href="classes.html" class="nav-item">車両クラス</a>
          <a href="pricing.html" class="nav-item active">料金設定</a>
          <a href="vehicles.html" class="nav-item">車両・在庫</a>
          <a href="options.html" class="nav-item">オプション</a>
          <a href="insurance.html" class="nav-item">保険プラン</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">設定</div>
          <a href="settings.html" class="nav-item">店舗設定</a>
          <a href="system-settings.html" class="nav-item">システム設定</a>
          <a href="documents.html" class="nav-item">法的文書</a>
        </div>
        <div class="nav-section">
          <a href="../index.html" class="nav-item" target="_blank">予約サイトへ →</a>
          <a href="https://dashboard.stripe.com/" target="_blank" class="nav-item">Stripe管理</a>
        </div>
        <div class="nav-section nav-section-bottom">
          <button onclick="adminLogout()" class="nav-item nav-logout">ログアウト</button>
        </div>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">料金設定</h1>
          <p class="admin-breadcrumb"><a href="index.html">ダッシュボード</a> / 料金設定</p>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">+ 料金プランを追加</button>
      </div>

      <!-- クラス選択 -->
      <div class="admin-card" style="margin-bottom: 16px;">
        <div class="card-body" style="padding: 12px 20px;">
          <div style="display: flex; gap: 16px; align-items: center;">
            <label>車両クラス:</label>
            <select id="class-filter" class="form-select" style="width: 200px;" onchange="loadPricing()">
              <option value="">全てのクラス</option>
            </select>
          </div>
        </div>
      </div>

      <div class="admin-card">
        <div class="card-body" style="padding: 0;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>車両クラス</th>
                <th>日数</th>
                <th>料金（税込）</th>
                <th>ステータス</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="pricing-tbody">
              <tr><td colspan="5" style="text-align:center;padding:40px;">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- 追加/編集モーダル -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal" style="max-width:500px;">
      <div class="modal-header">
        <h3 id="modal-title">料金プランを追加</h3>
        <button class="modal-close" onclick="closeModal('edit-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label class="form-label">車両クラス<span class="required">*</span></label>
          <select id="edit-class" class="form-select"></select>
        </div>
        <div class="form-group">
          <label class="form-label">日数<span class="required">*</span></label>
          <input type="number" id="edit-days" class="form-input" min="1" placeholder="1">
        </div>
        <div class="form-group">
          <label class="form-label">料金（税込）<span class="required">*</span></label>
          <input type="number" id="edit-price" class="form-input" min="0" placeholder="5000">
        </div>
        <div class="form-group">
          <label class="form-label">ラベル</label>
          <input type="text" id="edit-label" class="form-input" placeholder="1日">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('edit-modal')">キャンセル</button>
        <button class="btn btn-primary" onclick="savePricing()">保存</button>
      </div>
    </div>
  </div>

  
  <script src="common.js"></script>
  <script>
    let carClasses = [];
    let pricingPlans = [];

    async function loadCarClasses() {
      try {
        const result = await API.get('/v1/admin/car-classes');
        carClasses = Array.isArray(result) ? result : (result.data || []);
        const filter = document.getElementById('class-filter');
        const editSelect = document.getElementById('edit-class');
        carClasses.forEach(c => {
          filter.innerHTML += `<option value="${c.id}">${c.name}</option>`;
          editSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        });
      } catch (e) {
        console.error('車両クラス取得エラー:', e);
      }
    }

    async function loadPricing() {
      const tbody = document.getElementById('pricing-tbody');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">読み込み中...</td></tr>';

      try {
        const result = await API.get('/v1/admin/pricing');
        pricingPlans = Array.isArray(result) ? result : (result.data || []);

        const carClassId = document.getElementById('class-filter').value;
        let filtered = pricingPlans;
        if (carClassId) {
          filtered = pricingPlans.filter(p => p.carClassId === carClassId);
        }

        if (filtered.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">料金プランがありません</td></tr>';
          return;
        }

        // クラス名を取得
        const classMap = {};
        carClasses.forEach(c => classMap[c.id] = c.name);

        tbody.innerHTML = filtered.map(p => `
          <tr>
            <td>${classMap[p.carClassId] || p.carClassId}</td>
            <td>${p.days}日 ${p.label ? `(${p.label})` : ''}</td>
            <td>¥${p.price.toLocaleString()}</td>
            <td><span class="badge ${p.isActive !== false ? 'badge-success' : 'badge-secondary'}">${p.isActive !== false ? '有効' : '無効'}</span></td>
            <td class="actions">
              <button class="btn btn-sm btn-outline" data-edit-id="${p.id}">編集</button>
              <button class="btn btn-sm btn-danger" data-delete-id="${p.id}">削除</button>
            </td>
          </tr>
        `).join('');
        
        // イベント委譲で編集・削除ボタンを処理
        tbody.querySelectorAll('[data-edit-id]').forEach(btn => {
          btn.addEventListener('click', () => openEditModal(btn.dataset.editId));
        });
        tbody.querySelectorAll('[data-delete-id]').forEach(btn => {
          btn.addEventListener('click', () => deletePricing(btn.dataset.deleteId));
        });
      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:#c00;">エラー: ${error.message}</td></tr>`;
      }
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = '料金プランを追加';
      document.getElementById('edit-id').value = '';
      document.getElementById('edit-class').value = carClasses[0]?.id || '';
      document.getElementById('edit-days').value = '';
      document.getElementById('edit-price').value = '';
      document.getElementById('edit-label').value = '';
      openModal('edit-modal');
    }

    function openEditModal(id) {
      const p = pricingPlans.find(x => x.id === id);
      if (!p) return;
      document.getElementById('modal-title').textContent = '料金プランを編集';
      document.getElementById('edit-id').value = p.id;
      document.getElementById('edit-class').value = p.carClassId;
      document.getElementById('edit-days').value = p.days;
      document.getElementById('edit-price').value = p.price;
      document.getElementById('edit-label').value = p.label || '';
      openModal('edit-modal');
    }

    async function savePricing() {
      const id = document.getElementById('edit-id').value;
      const carClassId = document.getElementById('edit-class').value;
      const days = parseInt(document.getElementById('edit-days').value);
      const price = parseInt(document.getElementById('edit-price').value);
      const label = document.getElementById('edit-label').value;

      if (!carClassId || isNaN(days) || isNaN(price)) {
        alert('必須項目を入力してください');
        return;
      }

      try {
        if (id) {
          await API.put(`/v1/admin/pricing/${id}`, { carClassId, days, price, label });
        } else {
          await API.post('/v1/admin/pricing', { carClassId, days, price, label });
        }
        alert('保存しました');
        closeModal('edit-modal');
        loadPricing();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    async function deletePricing(id) {
      if (!confirm('この料金プランを削除しますか？')) return;
      try {
        await API.delete(`/v1/admin/pricing/${id}`);
        loadPricing();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadCarClasses();
      loadPricing();
    });
  </script>
</body>
</html>
