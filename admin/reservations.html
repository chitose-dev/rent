<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約管理 - 管理画面</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="admin-layout">
    <!-- サイドバー -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">
          予約管理
          <small>管理画面</small></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <a href="index.html" class="nav-item">ダッシュボード</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">予約管理</div>
          <a href="reservations.html" class="nav-item active">予約一覧</a>
          <a href="vehicle-schedule.html" class="nav-item">車両スケジュール</a>
          <a href="members.html" class="nav-item">会員管理</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">車両・サービス</div>
          <a href="classes.html" class="nav-item">車両クラス</a>
          <a href="pricing.html" class="nav-item">料金設定</a>
          <a href="vehicles.html" class="nav-item">車両・在庫</a>
          <a href="options.html" class="nav-item">オプション</a>
          <a href="insurance.html" class="nav-item">保険プラン</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">設定</div>
          <a href="settings.html" class="nav-item">店舗設定</a>
          <a href="system-settings.html" class="nav-item">システム設定</a>
          <a href="documents.html" class="nav-item">法的文書</a>
        </div>
        <div class="nav-section">
          <a href="../reserve-class.html" class="nav-item">予約サイトへ</a>
          <a href="https://dashboard.stripe.com/" target="_blank" class="nav-item">Stripe管理</a>
        </div>
        <div class="nav-section nav-section-bottom">
          <button onclick="adminLogout()" class="nav-item nav-logout">ログアウト</button>
        </div>
      </nav>
    </aside>

    <!-- メインコンテンツ -->
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">予約管理</h1>
          <p class="admin-breadcrumb"><a href="index.html">ダッシュボード</a> / 予約一覧</p>
        </div>
      </div>

      <!-- タブ -->
      <div class="tabs">
        <button class="tab active" data-status="">すべて</button>
        <button class="tab" data-status="confirmed">受取待ち</button>
        <button class="tab" data-status="picked_up">レンタル中</button>
        <button class="tab" data-status="cancel_requested">キャンセル申請</button>
      </div>

      <!-- 予約一覧 -->
      <div class="admin-card">
        <div class="card-body" style="padding: 0;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>予約番号</th>
                <th>会員</th>
                <th>車両クラス</th>
                <th>期間</th>
                <th>金額</th>
                <th>決済</th>
                <th>ステータス</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="reservations-tbody">
              <tr>
                <td colspan="8" style="text-align: center; padding: 40px;">
                  読み込み中...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ページネーション -->
      <div id="pagination" style="display: flex; justify-content: center; gap: 8px; margin-top: 16px;"></div>
    </main>
  </div>

  <!-- 詳細モーダル -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal" style="max-width: 600px;">
      <div class="modal-header">
        <h3>予約詳細</h3>
        <button class="modal-close" onclick="closeModal('detail-modal')">&times;</button>
      </div>
      <div class="modal-body" id="detail-modal-body">
        読み込み中...
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('detail-modal')">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 延長モーダル -->
  <div class="modal-overlay" id="extend-modal">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <h3>レンタル期間延長</h3>
        <button class="modal-close" onclick="closeModal('extend-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div style="background: #e3f2fd; padding: 12px; border-radius: 4px; margin-bottom: 16px;">
          延長処理を行うと、追加料金が発生します。
        </div>
        <div class="form-group">
          <label class="form-label">予約番号</label>
          <input type="text" class="form-input" id="extend-reservation-id" disabled>
        </div>
        <div class="form-group">
          <label class="form-label">現在の返却予定</label>
          <input type="text" class="form-input" id="extend-current-return" disabled>
        </div>
        <div class="form-group">
          <label class="form-label">新しい返却日時<span style="color:red;">*</span></label>
          <input type="datetime-local" class="form-input" id="extend-new-return">
        </div>
        <div class="form-group">
          <label class="form-label">追加決済方法</label>
          <select class="form-select" id="extend-payment-method">
            <option value="onsite">現地払い</option>
            <option value="card">カード決済（決済URLを発行）</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">備考</label>
          <textarea class="form-textarea" id="extend-notes" rows="2" placeholder="延長理由など"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('extend-modal')">キャンセル</button>
        <button class="btn btn-warning" onclick="processExtend()">延長を確定</button>
      </div>
    </div>
  </div>

  
  <script src="common.js"></script>
  <script>
    let currentStatus = '';
    let currentPage = 1;

    // ステータスラベル
    const statusLabels = {
      pending_payment: { text: '決済待ち', class: 'badge-warning' },
      confirmed: { text: '受取待ち', class: 'badge-info' },
      picked_up: { text: 'レンタル中', class: 'badge-success' },
      returned: { text: '返却済み', class: 'badge-secondary' },
      cancel_requested: { text: 'キャンセル申請', class: 'badge-danger' },
      cancelled: { text: 'キャンセル済', class: 'badge-secondary' },
      no_show: { text: '無断キャンセル', class: 'badge-danger' },
    };

    // 日時フォーマット
    function formatDateTime(isoString) {
      if (!isoString) return '-';
      const d = new Date(isoString);
      return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // 金額フォーマット
    function formatPrice(price) {
      return `¥${price.toLocaleString()}`;
    }

    // 予約一覧を取得
    async function loadReservations() {
      const tbody = document.getElementById('reservations-tbody');
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;">読み込み中...</td></tr>';

      try {
        let url = `/v1/admin/reservations?page=${currentPage}&limit=20`;
        if (currentStatus) {
          url += `&status=${currentStatus}`;
        }
        
        const result = await API.get(url);
        const reservations = Array.isArray(result) ? result : (result.data || []);
        
        if (reservations.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;">予約がありません</td></tr>';
          return;
        }

        tbody.innerHTML = reservations.map(r => {
          const status = statusLabels[r.status] || { text: r.status, class: 'badge-secondary' };
          const actions = getActionButtons(r);
          
          return `
            <tr>
              <td><strong>${escapeHtml(r.id)}</strong></td>
              <td>${escapeHtml(r.userName) || '-'}<br><small class="text-muted">${escapeHtml(r.userEmail) || ''}</small></td>
              <td>${escapeHtml(r.carClassName) || '-'}</td>
              <td>${formatDateTime(r.pickupAt)}<br>〜${formatDateTime(r.returnAt)}</td>
              <td>${formatPrice(r.totalPrice || 0)}</td>
              <td><span class="badge ${r.paymentMethod === 'card' ? 'badge-info' : 'badge-secondary'}">${r.paymentMethod === 'card' ? 'カード' : '現地払い'}</span></td>
              <td><span class="badge ${status.class}">${status.text}</span></td>
              <td class="actions">${actions}</td>
            </tr>
          `;
        }).join('');

        // ページネーション
        if (result.pagination) {
          renderPagination(result.pagination);
        }
      } catch (error) {
        console.error('予約取得エラー:', error);
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#c00;">エラー: ${escapeHtml(error.message)}</td></tr>`;
      }
    }

    // アクションボタン生成
    function getActionButtons(reservation) {
      const buttons = [`<button class="btn btn-sm btn-outline" data-action="detail" data-id="${reservation.id}">詳細</button>`];
      
      switch (reservation.status) {
        case 'confirmed':
          buttons.push(`<button class="btn btn-sm btn-success" data-action="pickup" data-id="${reservation.id}">受取処理</button>`);
          break;
        case 'picked_up':
          buttons.push(`<button class="btn btn-sm btn-warning" data-action="extend" data-id="${reservation.id}">延長</button>`);
          buttons.push(`<button class="btn btn-sm btn-success" data-action="return" data-id="${reservation.id}">返却処理</button>`);
          break;
        case 'cancel_requested':
          buttons.push(`<button class="btn btn-sm btn-success" data-action="approve-cancel" data-id="${reservation.id}">承認</button>`);
          buttons.push(`<button class="btn btn-sm btn-danger" data-action="reject-cancel" data-id="${reservation.id}">却下</button>`);
          break;
      }
      
      return buttons.join(' ');
    }
    
    // イベント委譲でアクションボタンを処理
    document.getElementById('reservations-tbody').addEventListener('click', function(e) {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      
      switch (action) {
        case 'detail': showDetail(id); break;
        case 'pickup': processPickup(id); break;
        case 'extend': openExtendModal(id); break;
        case 'return': processReturn(id); break;
        case 'approve-cancel': approveCancel(id); break;
        case 'reject-cancel': rejectCancel(id); break;
      }
    });

    // ページネーション描画
    function renderPagination(pagination) {
      const container = document.getElementById('pagination');
      if (pagination.totalPages <= 1) {
        container.innerHTML = '';
        return;
      }
      
      let html = '';
      for (let i = 1; i <= pagination.totalPages; i++) {
        html += `<button class="btn btn-sm ${i === pagination.page ? 'btn-primary' : 'btn-outline'}" onclick="goToPage(${i})">${i}</button>`;
      }
      container.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      loadReservations();
    }

    // 詳細表示
    async function showDetail(id) {
      openModal('detail-modal');
      const body = document.getElementById('detail-modal-body');
      body.innerHTML = '読み込み中...';
      
      try {
        const r = await API.get(`/v1/admin/reservations/${id}`);
        const status = statusLabels[r.status] || { text: r.status, class: 'badge-secondary' };
        
        body.innerHTML = `
          <table style="width:100%;border-collapse:collapse;">
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;width:120px;">予約番号</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(r.id)}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">ステータス</th><td style="padding:8px;border-bottom:1px solid #eee;"><span class="badge ${status.class}">${status.text}</span></td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">会員名</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(r.userName) || '-'}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">メール</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(r.userEmail) || '-'}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">電話番号</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(r.userPhone) || '-'}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">車両クラス</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(r.carClassName) || '-'}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">車両</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(r.vehicleLicensePlate) || '未割当'}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">受取日時</th><td style="padding:8px;border-bottom:1px solid #eee;">${new Date(r.pickupAt).toLocaleString('ja-JP')}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">返却日時</th><td style="padding:8px;border-bottom:1px solid #eee;">${new Date(r.returnAt).toLocaleString('ja-JP')}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">金額</th><td style="padding:8px;border-bottom:1px solid #eee;">${formatPrice(r.totalPrice || 0)}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">決済方法</th><td style="padding:8px;border-bottom:1px solid #eee;">${r.paymentMethod === 'card' ? 'カード' : '現地払い'}</td></tr>
            <tr><th style="text-align:left;padding:8px;border-bottom:1px solid #eee;">保険</th><td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(r.insuranceType) || '-'}</td></tr>
          </table>
        `;
      } catch (error) {
        body.innerHTML = `<p style="color:#c00;">エラー: ${escapeHtml(error.message)}</p>`;
      }
    }

    // 受取処理
    async function processPickup(id) {
      if (!confirm('受取処理を実行しますか？')) return;
      
      try {
        await API.put(`/v1/admin/reservations/${id}/pickup`, { notes: '' });
        alert('受取処理が完了しました');
        loadReservations();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    // 返却処理
    async function processReturn(id) {
      if (!confirm('返却処理を実行しますか？')) return;
      
      try {
        await API.put(`/v1/admin/reservations/${id}/return`, { 
          actualReturnAt: new Date().toISOString(),
          notes: '' 
        });
        alert('返却処理が完了しました');
        loadReservations();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    // キャンセル承認
    async function approveCancel(id) {
      if (!confirm('キャンセルを承認しますか？返金処理も実行されます。')) return;
      
      try {
        await API.put(`/v1/admin/reservations/${id}/cancel/approve`, { 
          notes: '管理者により承認' 
        });
        alert('キャンセルを承認しました');
        loadReservations();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    // キャンセル却下
    async function rejectCancel(id) {
      const reason = prompt('却下理由を入力してください:');
      if (!reason) return;
      
      try {
        await API.put(`/v1/admin/reservations/${id}/cancel/reject`, { reason });
        alert('キャンセルを却下しました');
        loadReservations();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    // 延長モーダルを開く
    let currentExtendReservationId = null;
    async function openExtendModal(id) {
      currentExtendReservationId = id;
      openModal('extend-modal');
      
      try {
        const r = await API.get(`/v1/admin/reservations/${id}`);
        document.getElementById('extend-reservation-id').value = r.id;
        const returnAt = new Date(r.returnAt);
        document.getElementById('extend-current-return').value = returnAt.toLocaleString('ja-JP');
        
        // 新しい返却日時のデフォルト値を現在の返却日時+1日に設定
        const defaultNewReturn = new Date(returnAt);
        defaultNewReturn.setDate(defaultNewReturn.getDate() + 1);
        document.getElementById('extend-new-return').value = defaultNewReturn.toISOString().slice(0, 16);
        document.getElementById('extend-notes').value = '';
      } catch (error) {
        alert('エラー: ' + error.message);
        closeModal('extend-modal');
      }
    }

    // 延長処理実行
    async function processExtend() {
      if (!currentExtendReservationId) return;
      
      const newReturnAt = document.getElementById('extend-new-return').value;
      const paymentMethod = document.getElementById('extend-payment-method').value;
      const notes = document.getElementById('extend-notes').value;
      
      if (!newReturnAt) {
        alert('新しい返却日時を入力してください');
        return;
      }
      
      if (!confirm('延長処理を実行しますか？')) return;
      
      try {
        const result = await API.put(`/v1/admin/reservations/${currentExtendReservationId}/extend`, {
          newReturnAt: new Date(newReturnAt).toISOString(),
          paymentMethod,
          notes
        });
        
        closeModal('extend-modal');
        
        if (result.stripeCheckoutUrl) {
          // カード決済の場合、決済URLを表示
          const copyUrl = confirm(
            `延長処理を受け付けました。\n\n追加料金: ¥${result.additionalPrice.toLocaleString()}\n\n決済URLをコピーしてお客様に送信してください。\n\n「OK」でURLをコピーします。`
          );
          if (copyUrl) {
            await navigator.clipboard.writeText(result.stripeCheckoutUrl);
            alert('決済URLをコピーしました');
          }
        } else {
          alert(`延長処理が完了しました。\n追加料金: ¥${result.additionalPrice.toLocaleString()}`);
        }
        
        loadReservations();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    // モーダル
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // タブ切り替え
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentStatus = tab.dataset.status;
        currentPage = 1;
        loadReservations();
      });
    });

    // 初期化
    document.addEventListener('DOMContentLoaded', loadReservations);
  </script>
</body>
</html>
