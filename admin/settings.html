<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../images/logo-icon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#f97316">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗設定 - 管理画面</title>
  <link rel="preconnect" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="dns-prefetch" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="admin-layout">
    <!-- サイドバー -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">
          予約管理
          <small>管理画面</small></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <a href="index.html" class="nav-item">ダッシュボード</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">予約管理</div>
          <a href="reservations.html" class="nav-item">予約一覧</a>
          <a href="vehicle-schedule.html" class="nav-item">車両スケジュール</a>
          <a href="members.html" class="nav-item">会員管理</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">車両・サービス</div>
          <a href="classes.html" class="nav-item">車両クラス</a>
          <a href="pricing.html" class="nav-item">料金設定</a>
          <a href="vehicles.html" class="nav-item">車両・在庫</a>
          <a href="options.html" class="nav-item">オプション</a>
          <a href="insurance.html" class="nav-item">保険プラン</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">設定</div>
          <a href="settings.html" class="nav-item active">店舗設定</a>
          <a href="system-settings.html" class="nav-item">システム設定</a>
          <a href="documents.html" class="nav-item">法的文書</a>
          <a href="admins.html" class="nav-item">管理者管理</a>
        </div>
        <div class="nav-section">
          <a href="../index.html" class="nav-item" target="_blank">予約サイトへ</a>
          <a href="https://dashboard.stripe.com/" target="_blank" class="nav-item">Stripe管理</a>
        </div>
        <div class="nav-section nav-section-bottom">
          <button type="button" onclick="adminLogout()" class="nav-item nav-logout">ログアウト</button>
        </div>
      </nav>
    </aside>

    <!-- メインコンテンツ -->
    <main class="admin-main">
      <div class="page-header">
        <h1 class="page-title">店舗設定</h1>
        <button type="button" class="btn btn-primary" onclick="saveSettings()" id="save-btn">設定を保存</button>
      </div>

      <div id="message" class="alert" style="display:none;"></div>

      <!-- 基本情報 -->
      <div class="admin-card">
        <div class="card-header">
          <h2 class="card-title">基本情報</h2>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">店舗名<span class="required">*</span></label>
            <input type="text" class="form-input" id="shopName" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">電話番号</label>
              <input type="tel" class="form-input" id="phone">
            </div>
            <div class="form-group">
              <label class="form-label">メールアドレス</label>
              <input type="email" class="form-input" id="email">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">住所</label>
            <input type="text" class="form-input" id="address">
          </div>
        </div>
      </div>

      <!-- 新規予約通知の宛先メールアドレス -->
      <div class="admin-card">
        <div class="card-header">
          <h2 class="card-title">新規予約通知の宛先メールアドレス</h2>
        </div>
        <div class="card-body">
          <p class="form-hint">新規予約があった際に通知メールを受け取るメールアドレス（最大10件）</p>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
            <input type="email" class="form-input" id="newNotifyEmail" style="width:300px;" placeholder="example@example.com">
            <button type="button" class="btn btn-sm btn-outline" onclick="addNotifyEmail()">追加</button>
          </div>
          <div id="notifyEmailsList" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>
      </div>

      <!-- 営業時間設定 -->
      <div class="admin-card">
        <div class="card-header">
          <h2 class="card-title">営業時間設定</h2>
        </div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">営業開始時間</label>
              <input type="time" class="form-input" id="openTime" value="08:00">
            </div>
            <div class="form-group">
              <label class="form-label">営業終了時間</label>
              <input type="time" class="form-input" id="closeTime" value="20:00">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">時間枠の区切り（分）</label>
            <select class="form-select" id="timeSlot" style="width: 200px;">
              <option value="15">15分</option>
              <option value="30">30分</option>
              <option value="60">60分</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">定休曜日</label>
            <div style="display: flex; gap: 16px; flex-wrap: wrap;">
              <label class="form-check"><input type="checkbox" id="closedDay0"> 日曜日</label>
              <label class="form-check"><input type="checkbox" id="closedDay1"> 月曜日</label>
              <label class="form-check"><input type="checkbox" id="closedDay2"> 火曜日</label>
              <label class="form-check"><input type="checkbox" id="closedDay3"> 水曜日</label>
              <label class="form-check"><input type="checkbox" id="closedDay4"> 木曜日</label>
              <label class="form-check"><input type="checkbox" id="closedDay5"> 金曜日</label>
              <label class="form-check"><input type="checkbox" id="closedDay6"> 土曜日</label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">臨時休業日（個別指定）</label>
            <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
              <input type="date" class="form-input" id="newClosedDate" style="width: 180px;">
              <button type="button" class="btn btn-sm btn-outline" onclick="addClosedDate()">追加</button>
            </div>
            <div id="closedDatesList" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
          </div>
        </div>
      </div>

      <!-- 予約設定 -->
      <div class="admin-card">
        <div class="card-header">
          <h2 class="card-title">予約設定</h2>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">同時対応可能組数</label>
            <input type="number" class="form-input" id="maxConcurrent" style="width: 100px;" value="3" min="1" max="10">
          </div>
          <div class="form-group">
            <label class="form-label">予約受付開始（日後から）</label>
            <input type="number" class="form-input" id="minAdvanceDays" style="width: 100px;" value="1" min="0">
          </div>
          <div class="form-group">
            <label class="form-label">予約受付終了（日後まで）</label>
            <input type="number" class="form-input" id="maxAdvanceDays" style="width: 100px;" value="90" min="1">
          </div>
        </div>
      </div>

      <!-- 消費税設定 -->
      <div class="admin-card">
        <div class="card-header">
          <h2 class="card-title">消費税設定</h2>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">消費税率（%）</label>
            <div style="display:flex;align-items:center;gap:8px;">
              <input type="number" class="form-input" id="taxRate" style="width:100px;" min="0" max="100" value="10">
              <span>%</span>
            </div>
            <p class="form-hint">お客様画面で「税抜価格 + 消費税」として表示されます</p>
          </div>
        </div>
      </div>

      <!-- キャンセルポリシー設定 -->
      <div class="admin-card">
        <div class="card-header">
          <h2 class="card-title">キャンセル料設定</h2>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">キャンセル料発生タイミング</label>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              ご利用日の
              <input type="number" class="form-input" id="cancelDaysBefore" style="width:70px;" min="1" max="30" value="3">
              日前より、基本料金の
              <input type="number" class="form-input" id="cancelRate" style="width:70px;" min="0" max="100" value="50">
              %
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">無断キャンセル（ノーショー）</label>
            <div style="display:flex;align-items:center;gap:8px;">
              基本料金の
              <input type="number" class="form-input" id="noShowRate" style="width:70px;" min="0" max="100" value="100">
              %
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  
  <script src="common.js"></script>
  <script>
    // 臨時休業日の管理
    let currentClosedDates = [];

    // 臨時休業日を追加
    function addClosedDate() {
      const input = document.getElementById('newClosedDate');
      const date = input.value;
      if (!date) {
        alert('日付を選択してください');
        return;
      }
      if (currentClosedDates.includes(date)) {
        alert('この日付は既に追加されています');
        return;
      }
      currentClosedDates.push(date);
      currentClosedDates.sort();
      renderClosedDates();
      input.value = '';
    }

    // 臨時休業日を削除
    function removeClosedDate(date) {
      currentClosedDates = currentClosedDates.filter(d => d !== date);
      renderClosedDates();
    }

    // 新規予約通知の宛先メールアドレス
    let currentNotifyEmails = [];

    function addNotifyEmail() {
      const input = document.getElementById('newNotifyEmail');
      const email = input.value.trim();
      if (!email) return;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert('メールアドレスの形式が正しくありません');
        return;
      }
      if (currentNotifyEmails.includes(email)) {
        alert('既に追加されています');
        return;
      }
      if (currentNotifyEmails.length >= 10) {
        alert('最大10件までです');
        return;
      }
      currentNotifyEmails.push(email);
      input.value = '';
      renderNotifyEmails();
    }

    function removeNotifyEmail(email) {
      currentNotifyEmails = currentNotifyEmails.filter(e => e !== email);
      renderNotifyEmails();
    }

    function renderNotifyEmails() {
      const container = document.getElementById('notifyEmailsList');
      if (currentNotifyEmails.length === 0) {
        container.innerHTML = '<span style="color:#666;">未登録</span>';
        return;
      }
      container.innerHTML = currentNotifyEmails.map(email => {
        const safe = escapeHtml(email);
        const safeAttr = safe.replace(/'/g, '&#39;');
        return `<span style="background:#f0f0f0;padding:4px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;">
          ${safe}
          <button type="button" onclick="removeNotifyEmail('${safeAttr}')" style="border:none;background:none;cursor:pointer;color:#c00;font-size:14px;">×</button>
        </span>`;
      }).join('');
    }

    // 臨時休業日の表示
    function renderClosedDates() {
      const container = document.getElementById('closedDatesList');
      if (currentClosedDates.length === 0) {
        container.innerHTML = '<span style="color:#666;">なし</span>';
        return;
      }
      container.innerHTML = currentClosedDates.map(date => {
        const d = new Date(date);
        const label = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
        return `<span style="background:#f0f0f0;padding:4px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;">
          ${escapeHtml(label)}
          <button type="button" onclick="removeClosedDate('${date}')" style="border:none;background:none;cursor:pointer;color:#c00;font-size:14px;">×</button>
        </span>`;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!AdminAuth.checkAuth()) return;
      loadSettings();
    });

    async function loadSettings() {
      try {
        const data = await API.get('/v1/admin/settings');
        const shop = data.shop || {};
        const cancel = data.cancellationPolicy || {};

        // 基本情報（旧フィールド名との互換性対応）
        document.getElementById('shopName').value = shop.name || shop.shopName || '';
        document.getElementById('phone').value = shop.phone || '';
        document.getElementById('email').value = shop.email || '';
        document.getElementById('address').value = shop.address || '';

        // 営業時間
        document.getElementById('openTime').value = shop.openTime || '08:00';
        document.getElementById('closeTime').value = shop.closeTime || '20:00';
        document.getElementById('timeSlot').value = shop.timeSlotMinutes || shop.timeStepMinutes || 30;

        // 定休曜日
        const closedDays = shop.closedDays || [];
        for (let i = 0; i < 7; i++) {
          document.getElementById(`closedDay${i}`).checked = closedDays.includes(i);
        }

        // 臨時休業日
        currentClosedDates = shop.closedDates || [];
        renderClosedDates();

        // 新規予約通知の宛先メールアドレス
        currentNotifyEmails = shop.notificationEmails || [];
        renderNotifyEmails();

        // 予約設定
        document.getElementById('maxConcurrent').value = shop.maxConcurrentPickups || 3;
        document.getElementById('minAdvanceDays').value = shop.minAdvanceDays || 1;
        document.getElementById('maxAdvanceDays').value = shop.maxAdvanceDays || 90;

        // 消費税率
        document.getElementById('taxRate').value = shop.taxRate || 10;

        // キャンセルポリシー
        document.getElementById('cancelDaysBefore').value = cancel.daysBefore || 3;
        document.getElementById('cancelRate').value = cancel.rate || 50;
        document.getElementById('noShowRate').value = cancel.noShowRate || 100;

      } catch (error) {
        console.error('設定読み込みエラー:', error);
        showMessage('設定の読み込みに失敗しました', 'error');
      }
    }

    async function saveSettings() {
      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中...';

      // 定休日を配列に
      const closedDays = [];
      for (let i = 0; i < 7; i++) {
        if (document.getElementById(`closedDay${i}`).checked) {
          closedDays.push(i);
        }
      }

      const shopData = {
        name: document.getElementById('shopName').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        address: document.getElementById('address').value,
        openTime: document.getElementById('openTime').value,
        closeTime: document.getElementById('closeTime').value,
        timeSlotMinutes: parseInt(document.getElementById('timeSlot').value),
        closedDays: closedDays,
        closedDates: currentClosedDates,
        maxConcurrentPickups: parseInt(document.getElementById('maxConcurrent').value),
        minAdvanceDays: parseInt(document.getElementById('minAdvanceDays').value),
        maxAdvanceDays: parseInt(document.getElementById('maxAdvanceDays').value),
        taxRate: parseInt(document.getElementById('taxRate').value) || 10,
        notificationEmails: currentNotifyEmails,
      };

      const cancelData = {
        daysBefore: parseInt(document.getElementById('cancelDaysBefore').value) || 3,
        rate: parseInt(document.getElementById('cancelRate').value) || 50,
        noShowRate: parseInt(document.getElementById('noShowRate').value) || 100,
      };

      try {
        await API.put('/v1/admin/settings/shop', shopData);
        await API.put('/v1/admin/settings/cancellation', cancelData);
        showMessage('設定を保存しました', 'success');
      } catch (error) {
        console.error('設定保存エラー:', error);
        showMessage('設定の保存に失敗しました: ' + error.message, 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '設定を保存';
      }
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = `alert alert-${type === 'error' ? 'danger' : 'success'}`;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }
  </script>
</body>
</html>
