<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>認証テスト</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { padding: 10px 20px; margin: 5px; font-size: 16px; }
    pre { background: #f5f5f5; padding: 15px; overflow: auto; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>管理画面 認証テスト</h1>
  
  <h2>1. 現在のsessionStorage</h2>
  <pre id="storage"></pre>
  
  <h2>2. ログインテスト</h2>
  <button onclick="testLogin()">ログイン実行</button>
  <pre id="loginResult"></pre>
  
  <h2>3. 手動操作</h2>
  <button onclick="clearStorage()">sessionStorageクリア</button>
  <button onclick="goToIndex()">index.htmlへ移動</button>
  <button onclick="goToLogin()">login.htmlへ移動</button>
  
  <script>
    const API_BASE = 'https://rentcar-backend-dgyxfpofua-an.a.run.app';
    
    function showStorage() {
      const data = {
        adminToken: sessionStorage.getItem('adminToken'),
        adminRefreshToken: sessionStorage.getItem('adminRefreshToken'),
        adminLoggedIn: sessionStorage.getItem('adminLoggedIn'),
        adminId: sessionStorage.getItem('adminId'),
        adminEmail: sessionStorage.getItem('adminEmail'),
      };
      document.getElementById('storage').textContent = JSON.stringify(data, null, 2);
    }
    
    async function testLogin() {
      const resultEl = document.getElementById('loginResult');
      resultEl.textContent = 'ログイン中...';
      
      try {
        const response = await fetch(`${API_BASE}/v1/admin/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: 'admin@demo.tokunori.com',
            password: 'demo1234'
          })
        });
        
        const data = await response.json();
        resultEl.innerHTML = '<span class="success">APIレスポンス:</span>\n' + JSON.stringify(data, null, 2);
        
        // トークンを保存
        const token = data.data?.token || data.token;
        const refreshToken = data.data?.refreshToken || data.refreshToken;
        const admin = data.data?.admin || data.admin;
        
        if (token) {
          sessionStorage.setItem('adminToken', token);
          sessionStorage.setItem('adminLoggedIn', 'true');
          if (refreshToken) {
            sessionStorage.setItem('adminRefreshToken', refreshToken);
          }
          if (admin) {
            sessionStorage.setItem('adminId', admin.id);
            sessionStorage.setItem('adminEmail', admin.email);
            sessionStorage.setItem('adminName', admin.name || '');
          }
          resultEl.innerHTML += '\n\n<span class="success">✅ トークン保存完了！</span>';
        } else {
          resultEl.innerHTML += '\n\n<span class="error">❌ トークンが見つかりません</span>';
        }
        
        showStorage();
      } catch (error) {
        resultEl.innerHTML = '<span class="error">エラー:</span>\n' + error.message;
      }
    }
    
    function clearStorage() {
      sessionStorage.clear();
      showStorage();
      alert('sessionStorageをクリアしました');
    }
    
    function goToIndex() {
      window.location.href = 'index.html';
    }
    
    function goToLogin() {
      window.location.href = 'login.html';
    }
    
    // 初期表示
    showStorage();
  </script>
</body>
</html>
