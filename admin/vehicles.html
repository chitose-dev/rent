<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両・在庫管理 - 管理画面</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">予約管理<small>管理画面</small></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section"><a href="index.html" class="nav-item">ダッシュボード</a></div>
        <div class="nav-section">
          <div class="nav-section-title">予約管理</div>
          <a href="reservations.html" class="nav-item">予約一覧</a>
          <a href="members.html" class="nav-item">会員管理</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">車両・サービス</div>
          <a href="classes.html" class="nav-item">車両クラス</a>
          <a href="pricing.html" class="nav-item">料金設定</a>
          <a href="vehicles.html" class="nav-item active">車両・在庫</a>
          <a href="options.html" class="nav-item">オプション</a>
          <a href="insurance.html" class="nav-item">保険プラン</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">設定</div>
          <a href="settings.html" class="nav-item">店舗設定</a>
          <a href="system-settings.html" class="nav-item">システム設定</a>
          <a href="documents.html" class="nav-item">法的文書</a>
        </div>
        <div class="nav-section">
          <a href="../index.html" class="nav-item" target="_blank">予約サイトへ →</a>
        </div>
        <div class="nav-section nav-section-bottom">
          <button onclick="adminLogout()" class="nav-item nav-logout">ログアウト</button>
        </div>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">車両・在庫管理</h1>
          <p class="admin-breadcrumb"><a href="index.html">ダッシュボード</a> / 車両管理</p>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">+ 車両を追加</button>
      </div>

      <!-- フィルター -->
      <div class="admin-card" style="margin-bottom: 16px;">
        <div class="card-body" style="padding: 12px 20px;">
          <div style="display: flex; gap: 16px; align-items: center;">
            <select id="class-filter" class="form-select" style="width: 180px;">
              <option value="">全てのクラス</option>
            </select>
            <select id="status-filter" class="form-select" style="width: 150px;">
              <option value="">全てのステータス</option>
              <option value="available">利用可能</option>
              <option value="rented">レンタル中</option>
              <option value="maintenance">メンテナンス中</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="loadVehicles()">検索</button>
          </div>
        </div>
      </div>

      <!-- 車両一覧 -->
      <div class="admin-card">
        <div class="card-body" style="padding: 0;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ナンバー</th>
                <th>車種</th>
                <th>クラス</th>
                <th>ステータス</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="vehicles-tbody">
              <tr><td colspan="5" style="text-align:center;padding:40px;">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- 追加モーダル -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal" style="max-width:500px;">
      <div class="modal-header">
        <h3>車両を追加</h3>
        <button class="modal-close" onclick="closeModal('add-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">車両クラス<span class="required">*</span></label>
          <select id="add-class" class="form-select"></select>
        </div>
        <div class="form-group">
          <label class="form-label">ナンバープレート<span class="required">*</span></label>
          <input type="text" id="add-plate" class="form-input" placeholder="品川 あ 12-34">
        </div>
        <div class="form-group">
          <label class="form-label">車種<span class="required">*</span></label>
          <input type="text" id="add-model" class="form-input" placeholder="トヨタ ヤリス">
        </div>
        <div class="form-group">
          <label class="form-label">備考</label>
          <textarea id="add-notes" class="form-textarea" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('add-modal')">キャンセル</button>
        <button class="btn btn-primary" onclick="addVehicle()">追加</button>
      </div>
    </div>
  </div>

  <!-- メンテナンスモーダル -->
  <div class="modal-overlay" id="maintenance-modal">
    <div class="modal" style="max-width:500px;">
      <div class="modal-header">
        <h3>メンテナンス設定</h3>
        <button class="modal-close" onclick="closeModal('maintenance-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="maint-vehicle-id">
        <div class="form-group">
          <label class="form-label">開始日時</label>
          <input type="datetime-local" id="maint-start" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">終了日時</label>
          <input type="datetime-local" id="maint-end" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">理由</label>
          <select id="maint-reason" class="form-select">
            <option value="inspection">定期点検</option>
            <option value="repair">修理</option>
            <option value="cleaning">清掃</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">備考</label>
          <textarea id="maint-notes" class="form-textarea" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('maintenance-modal')">キャンセル</button>
        <button class="btn btn-primary" onclick="setMaintenance()">設定</button>
      </div>
    </div>
  </div>

  
  <script src="common.js"></script>
  <script>
    let carClasses = [];

    const statusLabels = {
      available: { text: '利用可能', class: 'badge-success' },
      rented: { text: 'レンタル中', class: 'badge-info' },
      maintenance: { text: 'メンテナンス', class: 'badge-warning' },
    };

    async function loadCarClasses() {
      try {
        const result = await API.get('/v1/admin/car-classes');
        carClasses = Array.isArray(result) ? result : (result.data || []);
        const filter = document.getElementById('class-filter');
        const addSelect = document.getElementById('add-class');
        carClasses.forEach(c => {
          filter.innerHTML += `<option value="${c.id}">${c.name}</option>`;
          addSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        });
      } catch (e) {
        console.error('車両クラス取得エラー:', e);
      }
    }

    async function loadVehicles() {
      const tbody = document.getElementById('vehicles-tbody');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">読み込み中...</td></tr>';

      try {
        const carClassId = document.getElementById('class-filter').value;
        const status = document.getElementById('status-filter').value;
        let url = '/v1/admin/vehicles?limit=100';
        if (carClassId) url += `&carClassId=${carClassId}`;
        if (status) url += `&status=${status}`;

        const result = await API.get(url);
        const vehicles = Array.isArray(result) ? result : (result.data || []);

        if (vehicles.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">車両がありません</td></tr>';
          return;
        }

        tbody.innerHTML = vehicles.map(v => {
          const st = statusLabels[v.status] || { text: v.status, class: 'badge-secondary' };
          return `
            <tr>
              <td><strong>${v.licensePlate}</strong></td>
              <td>${v.model || '-'}</td>
              <td>${v.carClassName || '-'}</td>
              <td><span class="badge ${st.class}">${st.text}</span></td>
              <td class="actions">
                ${v.status === 'maintenance' 
                  ? `<button class="btn btn-sm btn-success" data-action="clear-maint" data-id="${v.id}">メンテ解除</button>`
                  : `<button class="btn btn-sm btn-warning" data-action="set-maint" data-id="${v.id}">メンテ設定</button>`
                }
              </td>
            </tr>
          `;
        }).join('');
        
        // イベント委譲でアクションボタンを処理
        tbody.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', function() {
            const action = this.dataset.action;
            const id = this.dataset.id;
            if (action === 'clear-maint') clearMaintenance(id);
            else if (action === 'set-maint') openMaintenanceModal(id);
          });
        });
      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:#c00;">エラー: ${error.message}</td></tr>`;
      }
    }

    function openAddModal() {
      document.getElementById('add-plate').value = '';
      document.getElementById('add-model').value = '';
      document.getElementById('add-notes').value = '';
      openModal('add-modal');
    }

    async function addVehicle() {
      const carClassId = document.getElementById('add-class').value;
      const licensePlate = document.getElementById('add-plate').value;
      const model = document.getElementById('add-model').value;
      const notes = document.getElementById('add-notes').value;

      if (!carClassId || !licensePlate || !model) {
        alert('必須項目を入力してください');
        return;
      }

      try {
        await API.post('/v1/admin/vehicles', { carClassId, licensePlate, model, notes });
        alert('車両を追加しました');
        closeModal('add-modal');
        loadVehicles();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    function openMaintenanceModal(vehicleId) {
      document.getElementById('maint-vehicle-id').value = vehicleId;
      document.getElementById('maint-start').value = '';
      document.getElementById('maint-end').value = '';
      document.getElementById('maint-notes').value = '';
      openModal('maintenance-modal');
    }

    async function setMaintenance() {
      const vehicleId = document.getElementById('maint-vehicle-id').value;
      const startDate = document.getElementById('maint-start').value;
      const endDate = document.getElementById('maint-end').value;
      const reason = document.getElementById('maint-reason').value;
      const notes = document.getElementById('maint-notes').value;

      if (!startDate || !endDate) {
        alert('開始・終了日時を入力してください');
        return;
      }

      try {
        await API.post(`/v1/admin/vehicles/${vehicleId}/maintenance`, {
          startDate: new Date(startDate).toISOString(),
          endDate: new Date(endDate).toISOString(),
          reason,
          notes
        });
        alert('メンテナンスを設定しました');
        closeModal('maintenance-modal');
        loadVehicles();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    async function clearMaintenance(vehicleId) {
      if (!confirm('メンテナンスを解除しますか？')) return;
      try {
        await API.delete(`/v1/admin/vehicles/${vehicleId}/maintenance`);
        alert('メンテナンスを解除しました');
        loadVehicles();
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadCarClasses();
      loadVehicles();
    });
  </script>
</body>
</html>
