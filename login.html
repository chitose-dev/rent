    .login-container {
      max-width: 400px;
      margin: 0 auto;
      padding: var(--spacing-xl) var(--spacing-md);
    }
    
    .login-header {
      text-align: center;

    }
    
    .login-logo {

      align-items: center;

      gap: var(--spacing-md);

    }
    
    .login-logo-icon {

    .login-card {

      font-weight: bold;
      color: var(--text-light);

      transition: all 0.3s;
      margin-bottom: -2px;
    }
    
    .login-tab:hover {
      color: var(--text-dark);
    }
    
    .login-tab.active {
      color: var(--primary-dark);
      border-bottom-color: var(--primary-color);
    }
    
    .login-form,
    .register-form {
      display: none;
    }
    
    .login-form.active,
    .register-form.active {
      display: block;
    }
    
    .forgot-password {
      text-align: right;
      margin-top: calc(var(--spacing-sm) * -1);
      margin-bottom: var(--spacing-lg);

    .forgot-password a {

    .divider {
      display: flex;
      align-items: center;

    }
    
    .divider-line {
      flex: 1;
      height: 1px;
      background-color: var(--border-color);
    }
    
    .divider-text {

    .social-login {
      display: flex;

    }
    
    .social-btn {

    .social-btn:hover {

      justify-content: center;

    .login-footer {
      text-align: center;
      margin-top: var(--spacing-xl);

      font-size: var(--font-sm);

    .login-footer a {

  <!-- ヘッダー -->

  <!-- メインコンテンツ -->
  <div class="login-container" id="main-content">
    <div class="login-header">
      <div class="login-logo">
        <img src="images/logo-icon.png" alt="TOKU-NORI" class="login-logo-icon">
        <img src="images/logo-text.png" alt="TOKU-NORI レンタカー" class="login-logo-text">
      </div>
      <p class="login-subtitle">レンタカー予約フォーム</p>
    </div>

    <div class="login-card">
      <!-- タブ -->
      <div class="login-tabs">
        <button type="button" class="login-tab active" onclick="switchLoginTab('login')">ログイン</button>
        <button type="button" class="login-tab" onclick="switchLoginTab('register')">新規登録</button>
      </div>

      <!-- ログインフォーム -->
      <form id="loginForm" class="login-form active" onsubmit="handleLogin(event)" novalidate>
        <div class="form-group">
          <label for="loginEmail" class="form-label required">メールアドレス</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="example@example.com" autocomplete="email" required>
          <span class="form-error">メールアドレスを入力してください</span>
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label required">パスワード</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="パスワード" autocomplete="current-password" required>
          <span class="form-error">パスワードを入力してください</span>
        </div>

        <div class="login-options" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--spacing-md);">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="rememberMe" style="width:16px;height:16px;">
            <span style="font-size:14px;">ログインを保持</span>
          </label>
          <a href="#" onclick="showForgotPassword(); return false;" style="font-size:14px;">パスワードをお忘れですか？</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full">ログイン</button>
      </form>

      <!-- 新規登録フォーム -->
      <form id="registerForm" class="register-form" onsubmit="handleRegister(event)" novalidate>
        <div class="form-group">
          <label for="registerName" class="form-label required">氏名</label>
          <input type="text" id="registerName" class="form-input" placeholder="山田 太郎" autocomplete="name" required>
          <span class="form-error">氏名を入力してください</span>
        </div>

        <div class="form-group">
          <label for="registerNameKana" class="form-label">氏名（カナ）</label>
          <input type="text" id="registerNameKana" class="form-input" placeholder="ヤマダ タロウ">
        </div>

        <div class="form-group">
          <label for="registerEmail" class="form-label required">メールアドレス</label>
          <input type="email" id="registerEmail" class="form-input" placeholder="example@example.com" autocomplete="email" required>
          <span class="form-error">正しいメールアドレスを入力してください</span>
        </div>

        <div class="form-group">
          <label for="registerPhone" class="form-label required">電話番号</label>
          <input type="tel" id="registerPhone" class="form-input" placeholder="09012345678" autocomplete="tel" inputmode="tel" required>
          <span class="form-error">電話番号を入力してください</span>
        </div>

        <div class="form-group">
          <label class="form-label">生年月日</label>
          <div class="birthdate-selects" style="display:flex;gap:8px;flex-wrap:wrap;">
            <select id="registerBirthYear" class="form-input" style="flex:1;min-width:90px;">
              <option value="">年</option>
            </select>
            <select id="registerBirthMonth" class="form-input" style="flex:1;min-width:70px;">
              <option value="">月</option>
            </select>
            <select id="registerBirthDay" class="form-input" style="flex:1;min-width:70px;">
              <option value="">日</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="registerPostalCode" class="form-label">郵便番号</label>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <input type="text" id="registerPostalCode" class="form-input" placeholder="1234567" autocomplete="postal-code" inputmode="numeric" maxlength="8" style="flex:1;min-width:120px;max-width:150px;">
            <button type="button" class="btn btn-secondary btn-sm" onclick="searchAddress()" style="white-space:nowrap;">住所検索</button>
          </div>
          <small style="color:#666;font-size:12px;margin-top:4px;display:block;">ハイフンなしで入力してください</small>
        </div>

        <div class="form-group">
          <label for="registerAddress" class="form-label">住所</label>
          <input type="text" id="registerAddress" class="form-input" placeholder="東京都渋谷区..." autocomplete="street-address" style="width:100%;">
        </div>

        <div class="form-group">
          <label for="registerLicenseNumber" class="form-label">免許証番号</label>
          <input type="text" id="registerLicenseNumber" class="form-input" placeholder="123456789012" inputmode="numeric" maxlength="12" style="width:100%;">
          <small style="color:#666;font-size:12px;margin-top:4px;display:block;">12桁の番号を入力してください</small>
        </div>

        <div class="form-group">
          <label for="registerPassword" class="form-label required">パスワード</label>
          <input type="password" id="registerPassword" class="form-input" placeholder="8文字以上" autocomplete="new-password" minlength="8" required>
          <span class="form-error">8文字以上のパスワードを入力してください</span>
          <div class="password-requirements">
            ※ 8文字以上で、英数字を含めてください
          </div>
        </div>

        <div class="form-group">
          <label for="registerPasswordConfirm" class="form-label required">パスワード（確認）</label>
          <input type="password" id="registerPasswordConfirm" class="form-input" placeholder="パスワード再入力" autocomplete="new-password" minlength="8" required>
          <span class="form-error">パスワードが一致しません</span>
        </div>

        <div class="checkbox-group mb-lg">
          <input type="checkbox" id="agreeTerms" required>
          <label for="agreeTerms">
            <a href="#" onclick="showTerms(); return false;">利用規約</a>および<a href="#" onclick="showPrivacy(); return false;">プライバシーポリシー</a>に同意します
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-full">新規登録</button>
      </form>

      <!-- 2段階認証入力フォーム -->
      <form id="twoFactorForm" class="login-form" style="display:none;" onsubmit="handle2FA(event)" novalidate>
        <div class="form-group">
          <p style="text-align:center; margin-bottom: 20px; color: #666;">
            📧 メールに送信された6桁のコードを入力してください
          </p>
          <label for="twoFactorCode" class="form-label required">認証コード</label>
          <input type="text" id="twoFactorCode" class="form-input" 
                 placeholder="000000" maxlength="6" pattern="[0-9]{6}" 
                 inputmode="numeric" required style="text-align:center; font-size:1.5rem; letter-spacing:8px;">
          <span class="form-error">認証コードを入力してください</span>
        </div>

        <button type="submit" class="btn btn-primary btn-full">認証</button>
        
        <div style="text-align:center; margin-top:16px;">
          <a href="#" onclick="cancelTwoFactor(); return false;" style="color:#666;">← ログインに戻る</a>
        </div>
      </form>
    </div>

    <div class="login-footer">
      <p>お困りの方は <a href="#">お問い合わせ</a> までご連絡ください</p>
    </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    // タブ切り替え
    function switchLoginTab(tab) {
      document.querySelectorAll('.login-tab').forEach((el, index) => {
        if ((tab === 'login' && index === 0) || (tab === 'register' && index === 1)) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
      
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
      document.getElementById('registerForm').classList.toggle('active', tab === 'register');
    }

    // ログイン処理
    async function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const submitBtn = event.target.querySelector('button[type="submit"]');
      
      // 入力チェック
      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください');
        return;
      }
      
      // ログイン保持設定
      Auth.setRememberMe(rememberMe);
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'ログイン中...';
      
      try {
        const result = await Auth.login(email, password);
        
        if (result.requires2FA) {
          // 2段階認証が必要な場合
          sessionStorage.setItem('pending2FA', JSON.stringify({ 
            tempToken: result.tempToken,
            userId: result.userId, 
            email 
          }));
          // 2FA入力フォームを表示
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('registerForm').classList.remove('active');
          document.querySelector('.login-tabs').style.display = 'none';
          document.getElementById('twoFactorForm').style.display = 'block';
          document.getElementById('twoFactorCode').focus();
          return;
        }
        
        // ログイン成功 - マイページへ遷移
        window.location.href = 'mypage-rental.html';
      } catch (error) {
        console.error('ログインエラー:', error);
        const msg = error.message || '';
        
        // メール未認証の場合は認証ページへ遷移
        if (msg.includes('EMAIL_NOT_VERIFIED') || msg.includes('確認が完了していません') || msg.includes('認証が完了していません')) {
          if (confirm('メールアドレスの認証が完了していません。\n認証ページに移動しますか？')) {
            AuthState.setPendingVerification(email);
            window.location.href = 'verify-email.html';
            return;
          }
        } else {
          // 統一エラーハンドラを使用
          ErrorHandler.show(error);
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'ログイン';
      }
    }

    // 新規登録処理
    async function handleRegister(event) {
      event.preventDefault();
      
      const name = document.getElementById('registerName').value;
      const nameKana = document.getElementById('registerNameKana').value || undefined;
      const email = document.getElementById('registerEmail').value;
      const phone = document.getElementById('registerPhone').value;
      
      // 生年月日を組み立て
      const birthYear = document.getElementById('registerBirthYear').value;
      const birthMonth = document.getElementById('registerBirthMonth').value;
      const birthDay = document.getElementById('registerBirthDay').value;
      const birthDate = (birthYear && birthMonth && birthDay) 
        ? `${birthYear}-${birthMonth}-${birthDay}` 
        : undefined;
      
      const postalCode = document.getElementById('registerPostalCode').value.replace(/[-ー]/g, '').trim() || undefined;
      const address = document.getElementById('registerAddress').value || undefined;
      const licenseNumber = document.getElementById('registerLicenseNumber').value.trim() || undefined;
      const password = document.getElementById('registerPassword').value;
      const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;
      const submitBtn = event.target.querySelector('button[type="submit"]');
      
      // 同意チェック
      if (!agreeTerms) {
        alert('利用規約とプライバシーポリシーに同意してください');
        return;
      }
      
      // パスワード確認
      if (password !== passwordConfirm) {
        alert('パスワードが一致しません');
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = '登録中...';
      
      try {
        const registerData = { name, email, phone, password };
        if (nameKana) registerData.nameKana = nameKana;
        if (birthDate) registerData.birthDate = birthDate;
        if (postalCode) registerData.postalCode = postalCode;
        if (address) registerData.address = address;
        if (licenseNumber) registerData.licenseNumber = licenseNumber;
        
        const result = await Auth.register(registerData);
        
        // メール確認画面へ遷移
        window.location.href = `verify-email.html?userId=${encodeURIComponent(result.userId)}&email=${encodeURIComponent(email)}`;
      } catch (error) {
        console.error('登録エラー:', error);
        // 統一エラーハンドラを使用
        ErrorHandler.show(error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '新規登録';
      }
    }

    // パスワード忘れ
    async function showForgotPassword() {
      const email = prompt('パスワードリセット用のメールアドレスを入力してください:');
      if (email) {
        try {
          await Auth.forgotPassword(email);
        } catch (error) {
          // セキュリティのため、存在しないメールでも続行
        }
        // リセット画面に遷移（メール送信の成否に関わらず）
        window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
      }
    }

    // 利用規約表示
    function showTerms() {
      window.open('terms.html', '_blank');
    }

    // プライバシーポリシー表示
    function showPrivacy() {
      window.open('privacy.html', '_blank');
    }

    // ソーシャルログイン（将来の拡張用）
    function socialLogin(provider) {
      alert(`${provider}ログインは準備中です`);
    }

    // 2段階認証処理
    async function handle2FA(event) {
      event.preventDefault();
      
      const code = document.getElementById('twoFactorCode').value.trim();
      const submitBtn = event.target.querySelector('button[type="submit"]');
      
      if (code.length !== 6) {
        alert('6桁のコードを入力してください');
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = '認証中...';
      
      try {
        const pending = JSON.parse(sessionStorage.getItem('pending2FA') || '{}');
        const result = await Auth.verify2FA(pending.tempToken, code);
        
        sessionStorage.removeItem('pending2FA');
        window.location.href = 'mypage-rental.html';
      } catch (error) {
        console.error('2FA認証エラー:', error);
        ErrorHandler.show(error);
        submitBtn.disabled = false;
        submitBtn.textContent = '認証';
      }
    }
    
    // 2段階認証キャンセル
    function cancelTwoFactor() {
      sessionStorage.removeItem('pending2FA');
      document.getElementById('twoFactorForm').style.display = 'none';
      document.querySelector('.login-tabs').style.display = 'flex';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('loginForm').classList.add('active');
    }

    // 既にログイン済みの場合はマイページへ
    function checkAuth() {
      if (Auth.isLoggedIn()) {
        window.location.href = 'mypage-rental.html';
      }
    }

    // 生年月日セレクトボックス初期化
    function initBirthDateSelects() {
      const yearSelect = document.getElementById('registerBirthYear');
      const monthSelect = document.getElementById('registerBirthMonth');
      const daySelect = document.getElementById('registerBirthDay');
      
      // 年（1920年〜現在-16歳）
      const currentYear = new Date().getFullYear();
      for (let y = currentYear - 16; y >= 1920; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + '年';
        yearSelect.appendChild(opt);
      }
      
      // 月（1〜12）
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = String(m).padStart(2, '0');
        opt.textContent = m + '月';
        monthSelect.appendChild(opt);
      }
      
      // 日（1〜31）
      for (let d = 1; d <= 31; d++) {
        const opt = document.createElement('option');
        opt.value = String(d).padStart(2, '0');
        opt.textContent = d + '日';
        daySelect.appendChild(opt);
      }
      
      // 月変更時に日数を調整
      yearSelect.addEventListener('change', updateDays);
      monthSelect.addEventListener('change', updateDays);
    }
    
    function updateDays() {
      const year = parseInt(document.getElementById('registerBirthYear').value) || 2000;
      const month = parseInt(document.getElementById('registerBirthMonth').value) || 1;
      const daySelect = document.getElementById('registerBirthDay');
      const currentDay = daySelect.value;
      
      const daysInMonth = new Date(year, month, 0).getDate();
      
      // 日の選択肢を更新
      while (daySelect.options.length > 1) {
        daySelect.remove(1);
      }
      
      for (let d = 1; d <= daysInMonth; d++) {
        const opt = document.createElement('option');
        opt.value = String(d).padStart(2, '0');
        opt.textContent = d + '日';
        daySelect.appendChild(opt);
      }
      
      // 以前の選択を復元（有効な場合）
      if (parseInt(currentDay) <= daysInMonth) {
        daySelect.value = currentDay;
      }
    }
    
    // 郵便番号から住所検索（zipcloud API）
    async function searchAddress() {
      const postalCode = document.getElementById('registerPostalCode').value.replace(/[-ー]/g, '').trim();
      
      if (!/^\d{7}$/.test(postalCode)) {
        alert('郵便番号は7桁の数字で入力してください');
        return;
      }
      
      try {
        const response = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${postalCode}`);
        const data = await response.json();
        
        if (data.results && data.results.length > 0) {
          const result = data.results[0];
          const address = result.address1 + result.address2 + result.address3;
          document.getElementById('registerAddress').value = address;
          document.getElementById('registerAddress').focus();
        } else {
          alert('該当する住所が見つかりませんでした');
        }
      } catch (error) {
        console.error('住所検索エラー:', error);
        alert('住所の検索に失敗しました');
      }
    }
    
    // 郵便番号入力時にEnterで検索
    document.getElementById('registerPostalCode')?.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchAddress();
      }
    });

    // 初期化
    checkAuth();
    initBirthDateSelects();
  </script>
</body>
</html>
