<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登録情報 - トクノリレンタカー</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">
    <div class="header-container">
      <a href="mypage-rental.html" class="header-logo">トクノリレンタカー</a>
      <nav class="header-nav">
        <a href="mypage-rental.html">マイページ</a>
        <a href="#" onclick="logout()">ログアウト</a>
      </nav>
      <button class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="container">
    <h1 class="page-title">マイページ</h1>
    
    <!-- タブナビゲーション -->
    <nav class="mypage-tabs">
      <button class="mypage-tab" data-tab="rental" onclick="switchTab('rental')">
        レンタル状況
      </button>
      <button class="mypage-tab" data-tab="new" onclick="switchTab('new')">
        新規予約
      </button>
      <button class="mypage-tab" data-tab="history" onclick="switchTab('history')">
        予約履歴
      </button>
      <button class="mypage-tab active" data-tab="profile" onclick="switchTab('profile')">
        登録情報
      </button>
      <button class="mypage-tab" data-tab="withdraw" onclick="switchTab('withdraw')">
        退会
      </button>
    </nav>

    <!-- 登録情報フォーム -->
    <div class="section">
      <h2 class="section-title">基本情報</h2>
      
      <form id="profileForm" onsubmit="saveProfile(event)">
        <div class="form-group">
          <label for="name" class="form-label required">氏名</label>
          <input type="text" id="name" class="form-input" placeholder="山田 太郎" required>
          <span class="form-error">氏名を入力してください</span>
        </div>

        <div class="form-group">
          <label for="nameKana" class="form-label required">氏名（カナ）</label>
          <input type="text" id="nameKana" class="form-input" placeholder="ヤマダ タロウ" required>
          <span class="form-error">氏名（カナ）を入力してください</span>
        </div>

        <div class="form-group">
          <label for="email" class="form-label required">メールアドレス</label>
          <input type="email" id="email" class="form-input" placeholder="example@example.com" required>
          <span class="form-error">正しいメールアドレスを入力してください</span>
        </div>

        <div class="form-group">
          <label for="phone" class="form-label required">電話番号</label>
          <input type="tel" id="phone" class="form-input" placeholder="09012345678" required>
          <span class="form-error">正しい電話番号を入力してください</span>
        </div>

        <div class="form-group">
          <label for="birthDate" class="form-label required">生年月日</label>
          <input type="date" id="birthDate" class="form-input" required>
          <span class="form-error">生年月日を入力してください</span>
        </div>

        <div class="form-group">
          <label for="postalCode" class="form-label required">郵便番号</label>
          <input type="text" id="postalCode" class="form-input" placeholder="1234567" maxlength="7" required>
          <span class="form-error">郵便番号を入力してください（ハイフンなし）</span>
        </div>

        <div class="form-group">
          <label for="address" class="form-label required">住所</label>
          <input type="text" id="address" class="form-input" placeholder="東京都渋谷区..." required>
          <span class="form-error">住所を入力してください</span>
        </div>

        <div class="form-group">
          <label for="licenseNumber" class="form-label required">運転免許証番号</label>
          <input type="text" id="licenseNumber" class="form-input" placeholder="1234567890" required>
          <span class="form-error">運転免許証番号を入力してください</span>
        </div>

        <div class="alert alert-info">
          <strong>ご注意:</strong> 変更内容は保存後すぐに反映されます。
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" onclick="resetForm()">キャンセル</button>
          <button type="submit" class="btn btn-primary btn-full">保存する</button>
        </div>
      </form>
    </div>

    <!-- パスワード変更 -->
    <div class="section">
      <h2 class="section-title">パスワード変更</h2>
      
      <form id="passwordForm" onsubmit="changePassword(event)">
        <div class="form-group">
          <label for="currentPassword" class="form-label required">現在のパスワード</label>
          <input type="password" id="currentPassword" class="form-input" required>
          <span class="form-error">現在のパスワードを入力してください</span>
        </div>

        <div class="form-group">
          <label for="newPassword" class="form-label required">新しいパスワード</label>
          <input type="password" id="newPassword" class="form-input" minlength="8" required>
          <span class="form-error">8文字以上のパスワードを入力してください</span>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label required">新しいパスワード（確認）</label>
          <input type="password" id="confirmPassword" class="form-input" minlength="8" required>
          <span class="form-error">パスワードが一致しません</span>
        </div>

        <button type="submit" class="btn btn-primary btn-full">パスワードを変更</button>
      </form>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    // タブ切り替え
    function switchTab(tab) {
      const pages = {
        'rental': 'mypage-rental.html',
        'new': 'reserve-days.html',
        'history': 'mypage-history.html',
        'profile': 'mypage-profile.html',
        'withdraw': 'mypage-withdraw.html'
      };
      
      if (pages[tab] && tab !== 'profile') {
        if (tab === 'new') {
          ReservationStorage.clear();
        }
        window.location.href = pages[tab];
      }
    }

    // プロフィール情報を読み込み（将来はAPIから）
    function loadProfile() {
      // 将来はAPIから取得
      // 今はダミーデータ
      const profile = {
        name: '山田 太郎',
        nameKana: 'ヤマダ タロウ',
        email: 'yamada@example.com',
        phone: '09012345678',
        birthDate: '1990-01-01',
        postalCode: '1500001',
        address: '東京都渋谷区神宮前1-1-1',
        licenseNumber: '1234567890'
      };
      
      // フォームに反映
      document.getElementById('name').value = profile.name || '';
      document.getElementById('nameKana').value = profile.nameKana || '';
      document.getElementById('email').value = profile.email || '';
      document.getElementById('phone').value = profile.phone || '';
      document.getElementById('birthDate').value = profile.birthDate || '';
      document.getElementById('postalCode').value = profile.postalCode || '';
      document.getElementById('address').value = profile.address || '';
      document.getElementById('licenseNumber').value = profile.licenseNumber || '';
    }

    // プロフィール保存
    function saveProfile(event) {
      event.preventDefault();
      
      const formData = {
        name: document.getElementById('name').value,
        nameKana: document.getElementById('nameKana').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        birthDate: document.getElementById('birthDate').value,
        postalCode: document.getElementById('postalCode').value,
        address: document.getElementById('address').value,
        licenseNumber: document.getElementById('licenseNumber').value
      };
      
      // 将来はAPIに送信
      console.log('保存するデータ:', formData);
      
      alert('登録情報を保存しました');
    }

    // フォームリセット
    function resetForm() {
      if (confirm('変更内容を破棄しますか?')) {
        loadProfile();
      }
    }

    // パスワード変更
    function changePassword(event) {
      event.preventDefault();
      
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (newPassword !== confirmPassword) {
        alert('新しいパスワードが一致しません');
        return;
      }
      
      // 将来はAPIに送信
      console.log('パスワード変更');
      
      alert('パスワードを変更しました');
      document.getElementById('passwordForm').reset();
    }

    // ログアウト
    function logout() {
      if (confirm('ログアウトしますか?')) {
        ReservationStorage.clear();
        window.location.href = 'login.html';
      }
    }

    // 初期化
    loadProfile();
  </script>
</body>
</html>
