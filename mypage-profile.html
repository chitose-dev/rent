<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="images/logo-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登録情報 - トクノリレンタカー</title>
  <link rel="preconnect" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="dns-prefetch" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>
  <!-- ヘッダー -->
  <header class="header">
    <div class="header-container">
      <a href="mypage-rental.html" class="header-logo"><img src="images/logo-icon.png" alt="TOKU-NORI" class="header-logo-icon"><img src="images/logo-text.png" alt="レンタカー" class="header-logo-text"></a>
      <nav class="header-nav">
        <a href="mypage-rental.html">マイページ</a>
        <a href="#" onclick="logout(); return false;">ログアウト</a>
      </nav>
      <button type="button" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="container" id="main-content">
    <h1 class="page-title">マイページ</h1>
    
    <!-- タブナビゲーション -->
    <nav class="mypage-tabs">
      <button type="button" class="mypage-tab" data-tab="rental" onclick="switchTab('rental')">
        レンタル状況
      </button>
      <button type="button" class="mypage-tab" data-tab="new" onclick="switchTab('new')">
        新規予約
      </button>
      <button type="button" class="mypage-tab" data-tab="history" onclick="switchTab('history')">
        予約履歴
      </button>
      <button type="button" class="mypage-tab active" data-tab="profile" onclick="switchTab('profile')">
        登録情報
      </button>
      <button type="button" class="mypage-tab" data-tab="withdraw" onclick="switchTab('withdraw')">
        退会
      </button>
    </nav>

    <!-- 登録情報フォーム -->
    <div class="section">
      <h2 class="section-title">基本情報</h2>
      
      <form id="profileForm" onsubmit="saveProfile(event)" novalidate>
        <div class="form-group">
          <label for="name" class="form-label required">氏名</label>
          <input type="text" id="name" class="form-input" placeholder="山田 太郎" autocomplete="name" required>
          <span class="form-error">氏名を入力してください</span>
        </div>

        <div class="form-group">
          <label for="nameKana" class="form-label">氏名（カナ）</label>
          <input type="text" id="nameKana" class="form-input" placeholder="ヤマダ タロウ">
        </div>

        <div class="form-group">
          <label for="email" class="form-label required">メールアドレス</label>
          <input type="email" id="email" class="form-input" placeholder="example@example.com" autocomplete="email" required>
          <span class="form-error">正しいメールアドレスを入力してください</span>
        </div>

        <div class="form-group">
          <label for="phone" class="form-label required">電話番号</label>
          <input type="tel" id="phone" class="form-input" placeholder="09012345678" autocomplete="tel" inputmode="tel" required>
          <span class="form-error">正しい電話番号を入力してください</span>
        </div>

        <div class="form-group">
          <label class="form-label">生年月日</label>
          <div class="birthdate-selects" style="display:flex;gap:8px;flex-wrap:wrap;">
            <select id="birthYear" class="form-input" style="flex:1;min-width:90px;">
              <option value="">年</option>
            </select>
            <select id="birthMonth" class="form-input" style="flex:1;min-width:70px;">
              <option value="">月</option>
            </select>
            <select id="birthDay" class="form-input" style="flex:1;min-width:70px;">
              <option value="">日</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="postalCode" class="form-label">郵便番号</label>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <input type="text" id="postalCode" class="form-input" placeholder="1234567" maxlength="8" autocomplete="postal-code" inputmode="numeric" style="flex:1;min-width:120px;max-width:150px;">
            <button type="button" class="btn btn-secondary btn-sm" onclick="searchAddress()" style="white-space:nowrap;">住所検索</button>
          </div>
          <small style="color:#666;font-size:12px;margin-top:4px;display:block;">ハイフンなしで入力してください</small>
        </div>

        <div class="form-group">
          <label for="address" class="form-label">住所</label>
          <input type="text" id="address" class="form-input" placeholder="東京都渋谷区..." autocomplete="street-address">
        </div>

        <div class="form-group">
          <label for="licenseNumber" class="form-label">運転免許証番号</label>
          <input type="text" id="licenseNumber" class="form-input" placeholder="123456789012" inputmode="numeric" maxlength="12">
          <small style="color:#666;font-size:12px;margin-top:4px;display:block;">12桁の番号を入力してください</small>
        </div>

        <div class="alert alert-info">
          <strong>ご注意:</strong> 変更内容は保存後すぐに反映されます。
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" onclick="resetForm()">キャンセル</button>
          <button type="submit" class="btn btn-primary btn-full">保存する</button>
        </div>
      </form>
    </div>

    <!-- パスワード変更 -->
    <div class="section">
      <h2 class="section-title">パスワード変更</h2>
      
      <form id="passwordForm" onsubmit="changePassword(event)" novalidate>
        <div class="form-group">
          <label for="currentPassword" class="form-label required">現在のパスワード</label>
          <input type="password" id="currentPassword" class="form-input" required>
          <span class="form-error">現在のパスワードを入力してください</span>
        </div>

        <div class="form-group">
          <label for="newPassword" class="form-label required">新しいパスワード</label>
          <input type="password" id="newPassword" class="form-input" minlength="8" required>
          <span class="form-error">8文字以上のパスワードを入力してください</span>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label required">新しいパスワード（確認）</label>
          <input type="password" id="confirmPassword" class="form-input" minlength="8" required>
          <span class="form-error">パスワードが一致しません</span>
        </div>

        <button type="submit" class="btn btn-primary btn-full">パスワードを変更</button>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    // タブ切り替え
    function switchTab(tab) {
      const pages = {
        'rental': 'mypage-rental.html',
        'new': 'reserve.html',
        'history': 'mypage-history.html',
        'profile': 'mypage-profile.html',
        'withdraw': 'mypage-withdraw.html'
      };
      
      if (pages[tab] && tab !== 'profile') {
        if (tab === 'new') {
          ReservationStorage.clear();
        }
        window.location.href = pages[tab];
      }
    }

    // 生年月日セレクトボックスを初期化
    function initBirthDateSelects() {
      const yearSelect = document.getElementById('birthYear');
      const monthSelect = document.getElementById('birthMonth');
      const daySelect = document.getElementById('birthDay');
      
      // 年（100年前〜18年前）
      const currentYear = new Date().getFullYear();
      for (let y = currentYear - 18; y >= currentYear - 100; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + '年';
        yearSelect.appendChild(opt);
      }
      
      // 月
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = String(m).padStart(2, '0');
        opt.textContent = m + '月';
        monthSelect.appendChild(opt);
      }
      
      // 日
      for (let d = 1; d <= 31; d++) {
        const opt = document.createElement('option');
        opt.value = String(d).padStart(2, '0');
        opt.textContent = d + '日';
        daySelect.appendChild(opt);
      }
    }

    // 郵便番号から住所検索
    async function searchAddress() {
      const postalCode = document.getElementById('postalCode').value.replace(/[-ー]/g, '').trim();
      if (!/^\d{7}$/.test(postalCode)) {
        alert('郵便番号は7桁の数字で入力してください');
        return;
      }
      try {
        const res = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${postalCode}`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const r = data.results[0];
          const address = r.address1 + r.address2 + r.address3;
          document.getElementById('address').value = address;
          document.getElementById('address').focus();
        } else {
          alert('住所が見つかりませんでした');
        }
      } catch (e) {
        alert('住所検索に失敗しました');
      }
    }

    // プロフィール情報を読み込み（API呼び出し）
    async function loadProfile() {
      // 認証チェック
      if (!Auth.requireAuth()) return;
      
      try {
        const profile = await Auth.getProfile();
        
        // フォームに反映
        document.getElementById('name').value = profile.name || '';
        document.getElementById('nameKana').value = profile.nameKana || '';
        document.getElementById('email').value = profile.email || '';
        document.getElementById('phone').value = profile.phone || '';
        
        // 生年月日を分解してセット
        if (profile.birthDate) {
          const parts = profile.birthDate.split('-');
          if (parts.length === 3) {
            document.getElementById('birthYear').value = parts[0];
            document.getElementById('birthMonth').value = parts[1];
            document.getElementById('birthDay').value = parts[2];
          }
        }
        
        document.getElementById('postalCode').value = profile.postalCode || '';
        document.getElementById('address').value = profile.address || '';
        document.getElementById('licenseNumber').value = profile.licenseNumber || '';
      } catch (error) {
        console.error('プロフィール取得エラー:', error);
        alert('プロフィールの取得に失敗しました: ' + error.message);
      }
    }

    // プロフィール保存（API呼び出し）
    async function saveProfile(event) {
      event.preventDefault();
      
      const submitBtn = event.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = '保存中...';
      
      // 生年月日を組み立て
      const birthYear = document.getElementById('birthYear').value;
      const birthMonth = document.getElementById('birthMonth').value;
      const birthDay = document.getElementById('birthDay').value;
      const birthDate = (birthYear && birthMonth && birthDay) 
        ? `${birthYear}-${birthMonth}-${birthDay}` 
        : undefined;
      
      const formData = {
        name: document.getElementById('name').value,
        nameKana: document.getElementById('nameKana').value || undefined,
        phone: document.getElementById('phone').value,
        birthDate: birthDate,
        postalCode: document.getElementById('postalCode').value.replace(/[-ー]/g, '').trim() || undefined,
        address: document.getElementById('address').value || undefined,
        licenseNumber: document.getElementById('licenseNumber').value.trim() || undefined
      };
      
      // undefinedのフィールドを削除
      Object.keys(formData).forEach(key => {
        if (formData[key] === undefined) delete formData[key];
      });
      
      try {
        await Auth.updateProfile(formData);
        alert('登録情報を保存しました');
      } catch (error) {
        console.error('プロフィール保存エラー:', error);
        alert('登録情報の保存に失敗しました: ' + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '変更を保存';
      }
    }

    // フォームリセット
    function resetForm() {
      if (confirm('変更内容を破棄しますか?')) {
        loadProfile();
      }
    }

    // パスワード変更（API呼び出し）
    async function changePassword(event) {
      event.preventDefault();
      
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (newPassword !== confirmPassword) {
        alert('新しいパスワードが一致しません');
        return;
      }
      
      const submitBtn = event.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = '変更中...';
      
      try {
        await Auth.changePassword(currentPassword, newPassword);
        alert('パスワードを変更しました。再度ログインしてください。');
        Auth.logout();
        window.location.href = 'login.html';
      } catch (error) {
        console.error('パスワード変更エラー:', error);
        alert('パスワード変更に失敗しました: ' + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'パスワードを変更';
        document.getElementById('passwordForm').reset();
      }
    }

    // ログアウト
    function logout() {
      if (confirm('ログアウトしますか?')) {
        Auth.logout();
        window.location.href = 'login.html';
      }
    }

    // 初期化
    initBirthDateSelects();
    loadProfile();
  </script>
</body>
</html>
