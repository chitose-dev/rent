<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プライバシーポリシー | TOKU-NORI レンタカー</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .document-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .document-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .document-content h1 { font-size: 28px; margin: 0 0 24px; color: #333; }
    .document-content h2 { font-size: 20px; margin: 32px 0 16px; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
    .document-content h3 { font-size: 16px; margin: 24px 0 12px; color: #555; }
    .document-content p { margin: 12px 0; line-height: 1.8; color: #444; }
    .document-content ul, .document-content ol { margin: 12px 0; padding-left: 24px; }
    .document-content li { margin: 8px 0; line-height: 1.6; }
    .back-link { margin-top: 32px; text-align: center; }
    .back-link a { color: #007bff; text-decoration: none; }
    .loading { text-align: center; padding: 60px; color: #666; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="header-logo">
        <img src="images/logo-icon.png" alt="TOKU-NORI" class="header-logo-icon">
        <img src="images/logo-text.png" alt="レンタカー" class="header-logo-text">
      </a>
    </div>
  </header>

  <div class="document-container">
    <div class="document-card">
      <div id="content" class="document-content">
        <div class="loading">読み込み中...</div>
      </div>
      <div class="back-link">
        <a href="javascript:history.back()">← 戻る</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    async function loadPrivacy() {
      try {
        const response = await fetch(`${AppConfig.API_BASE_URL}/v1/shop/legal-documents`);
        const data = await response.json();
        
        if (data.privacy) {
          document.getElementById('content').innerHTML = marked.parse(data.privacy);
        } else {
          document.getElementById('content').innerHTML = `
            <h1>プライバシーポリシー</h1>
            <p>プライバシーポリシーは現在準備中です。</p>
          `;
        }
      } catch (error) {
        document.getElementById('content').innerHTML = `
          <h1>プライバシーポリシー</h1>
          <p>読み込みに失敗しました。</p>
        `;
      }
    }
    loadPrivacy();
  </script>
</body>
</html>
