<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="images/logo-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オプション選択 - トクノリレンタカー</title>
  <link rel="preconnect" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="dns-prefetch" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="stylesheet" href="common.css">
  <style>
    .summary-info {
      background-color: var(--primary-light);
      padding: var(--spacing-lg);
      border-radius: 8px;
      margin-bottom: var(--spacing-lg);
    }
    
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-sm);
      font-size: var(--font-md);
    }
    
    .summary-row:last-child {
      margin-bottom: 0;
    }
    
    .summary-label {
      font-weight: bold;
      color: var(--text-dark);
    }
    
    .summary-value {
      color: var(--primary-dark);
      font-weight: bold;
    }
    
    .option-section {
      margin-bottom: var(--spacing-xl);
    }
    
    .option-section-title {
      font-size: var(--font-lg);
      font-weight: bold;
      margin-bottom: var(--spacing-md);
      padding-bottom: var(--spacing-sm);
      border-bottom: 2px solid var(--primary-color);
    }
    
    .option-card {
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-md);
      cursor: pointer;
      transition: all 0.3s;
      background-color: var(--bg-white);
    }
    
    .option-card:hover {
      border-color: var(--primary-color);
      background-color: var(--primary-light);
    }
    
    .option-card.selected {
      border-color: var(--primary-color);
      background-color: var(--primary-light);
    }
    
    .option-card.recommended {
      position: relative;
    }
    
    .option-card.recommended::before {
      content: 'おすすめ';
      position: absolute;
      top: -12px;
      left: var(--spacing-md);
      background-color: var(--primary-color);
      color: var(--text-dark);
      padding: var(--spacing-xs) var(--spacing-md);
      border-radius: 4px;
      font-size: var(--font-sm);
      font-weight: bold;
    }
    
    .option-header {
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-sm);
    }
    
    .option-checkbox {
      width: 24px;
      height: 24px;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }
    
    .option-content {
      flex: 1;
    }
    
    .option-title {
      font-size: var(--font-lg);
      font-weight: bold;
      margin-bottom: var(--spacing-xs);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
    }
    
    .option-price {
      color: var(--primary-dark);
      font-weight: bold;
      white-space: nowrap;
    }
    
    .option-description {
      color: var(--text-light);
      line-height: 1.6;
      font-size: var(--font-sm);
    }
    
    .option-details {
      margin-top: var(--spacing-md);
      padding: var(--spacing-md);
      background-color: var(--bg-light);
      border-radius: 4px;
      font-size: var(--font-sm);
    }
    
    .option-details-title {
      font-weight: bold;
      margin-bottom: var(--spacing-sm);
    }
    
    .option-details ul {
      padding-left: var(--spacing-lg);
      line-height: 1.8;
    }
    
    .total-section {
      background-color: var(--primary-light);
      padding: var(--spacing-lg);
      border-radius: 8px;
      margin-bottom: var(--spacing-lg);
    }
    
    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-sm);
    }
    
    .total-row:last-child {
      margin-bottom: 0;
      padding-top: var(--spacing-md);
      border-top: 2px solid var(--primary-color);
      font-size: var(--font-lg);
    }
    
    .total-label {
      font-weight: bold;
    }
    
    .total-value {
      font-weight: bold;
      color: var(--primary-dark);
    }
    
    @media (max-width: 768px) {
      .summary-info {
        padding: 10px;
      }
      
      .summary-row {
        font-size: 12px;
        margin-bottom: 4px;
      }
      
      .option-section {
        margin-bottom: 16px;
      }
      
      .option-section-title {
        font-size: 13px;
        margin-bottom: 10px;
        padding-bottom: 6px;
      }
      
      .option-card {
        padding: 10px;
        margin-bottom: 8px;
        border-width: 2px;
      }
      
      .option-card.recommended::before {
        font-size: 10px;
        padding: 2px 8px;
        top: -10px;
      }
      
      .option-header {
        gap: 8px;
      }
      
      .option-checkbox {
        width: 18px;
        height: 18px;
      }
      
      .option-title {
        flex-direction: column;
        align-items: flex-start;
        font-size: 13px;
        gap: 2px;
      }
      
      .option-price {
        font-size: 12px;
      }
      
      .option-description {
        font-size: 11px;
        line-height: 1.4;
      }
      
      .option-details {
        padding: 8px;
        margin-top: 8px;
        font-size: 10px;
      }
      
      .option-details-title {
        font-size: 11px;
        margin-bottom: 4px;
      }
      
      .option-details ul {
        padding-left: 16px;
        line-height: 1.5;
      }
      
      .total-section {
        padding: 10px;
      }
      
      .total-row {
        font-size: 12px;
        margin-bottom: 4px;
      }
      
      .total-row:last-child {
        font-size: 13px;
        padding-top: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">
    <div class="header-container">
      <a href="mypage-rental.html" class="header-logo"><img src="images/logo-icon.png" alt="TOKU-NORI" class="header-logo-icon"><img src="images/logo-text.png" alt="レンタカー" class="header-logo-text"></a>
      <nav class="header-nav">
        <a href="mypage-rental.html">マイページ</a>
        <a href="#" onclick="logout(); return false;">ログアウト</a>
      </nav>
      <button type="button" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="container">
    <h1 class="page-title">オプションを選択</h1>
    
    <!-- 予約情報サマリー -->
    <div class="summary-info">
      <div class="summary-row">
        <span class="summary-label">車両クラス:</span>
        <span class="summary-value" id="summaryClass">-</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">開始日:</span>
        <span class="summary-value" id="summaryPickup">-</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">基本料金:</span>
        <span class="summary-value" id="summaryBasePrice">-</span>
      </div>
    </div>

    <!-- 免責補償 -->
    <div class="section option-section">
      <h2 class="option-section-title">免責補償制度</h2>
      
      <div class="alert alert-info mb-lg">
        万が一の事故に備えて、免責補償制度への加入をおすすめします。
      </div>
      
      <div id="insuranceOptions"></div>
    </div>

    <!-- 追加オプション -->
    <div class="section option-section">
      <h2 class="option-section-title">追加オプション</h2>
      
      <div id="additionalOptions"></div>
    </div>

    <!-- 合計金額 -->
    <div class="total-section">
      <div class="total-row">
        <span class="total-label">基本料金:</span>
        <span class="total-value" id="totalBasePrice">-</span>
      </div>
      <div class="total-row" id="insuranceRow" style="display: none;">
        <span class="total-label">免責補償:</span>
        <span class="total-value" id="totalInsurance">-</span>
      </div>
      <div class="total-row" id="optionsRow" style="display: none;">
        <span class="total-label">追加オプション:</span>
        <span class="total-value" id="totalOptions">-</span>
      </div>
      <div class="total-row">
        <span class="total-label">合計金額:</span>
        <span class="total-value" id="grandTotal">-</span>
      </div>
    </div>

    <!-- ボタン -->
    <div class="btn-group">
      <button type="button" class="btn btn-secondary" onclick="goBack()">戻る</button>
      <button type="button" class="btn btn-primary btn-full" onclick="goNext()">次へ進む</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    // APIから取得したオプションデータを使用
    let InsuranceOptions = [];
    let AdditionalOptions = [];
    
    let selectedInsurance = null;
    let selectedOptions = [];
    let basePrice = 0;
    let rentalDays = 1;

    // 予約データを取得
    function loadReservationData() {
      // 認証チェック
      if (!Auth.requireAuth()) return;
      
      const data = ReservationStorage.get();
      if (!data || !data.carClassId) {
        alert('車両クラスを選択してください');
        window.location.href = 'reserve-class.html';
        return;
      }
      
      basePrice = data.planPrice;
      rentalDays = data.planDays;
      
      // サマリー表示
      const carClass = Utils.getCarClass(data.carClassId);
      document.getElementById('summaryClass').textContent = carClass.name;
      document.getElementById('summaryPickup').textContent = 
        Utils.formatDateJP(new Date(data.startDate));
      document.getElementById('summaryBasePrice').textContent = Utils.formatPrice(basePrice);
      
      // 前回の選択を復元
      if (data.selectedInsurance) {
        selectedInsurance = data.selectedInsurance;
      }
      if (data.selectedOptions) {
        selectedOptions = data.selectedOptions;
      }
    }

    // 免責補償オプション描画
    function renderInsuranceOptions() {
      const container = document.getElementById('insuranceOptions');
      container.innerHTML = '';
      
      // 「加入しない」オプション
      const noInsuranceCard = createOptionCard({
        id: 'insurance-none',
        name: '加入しない',
        pricePerDay: 0,
        description: '事故時は規定の免責額をお支払いいただきます。',
        details: [
          '車両免責額: 最大5万円',
          '対物免責額: 最大5万円',
          '営業補償（自走可能時）: 2万円',
          '営業補償（自走不可時）: 5万円'
        ]
      }, 'insurance');
      container.appendChild(noInsuranceCard);
      
      // 補償オプション
      InsuranceOptions.forEach(option => {
        const card = createOptionCard(option, 'insurance');
        container.appendChild(card);
      });
    }

    // 追加オプション描画
    function renderAdditionalOptions() {
      const container = document.getElementById('additionalOptions');
      container.innerHTML = '';
      
      AdditionalOptions.forEach(option => {
        const card = createOptionCard(option, 'additional');
        container.appendChild(card);
      });
    }

    // オプションカード作成
    function createOptionCard(option, type) {
      const card = document.createElement('div');
      card.className = 'option-card';
      if (option.recommended) {
        card.classList.add('recommended');
      }
      
      // 選択状態の復元
      if (type === 'insurance' && selectedInsurance === option.id) {
        card.classList.add('selected');
      }
      if (type === 'additional' && selectedOptions.includes(option.id)) {
        card.classList.add('selected');
      }
      
      const priceText = option.pricePerDay === 0 
        ? '無料' 
        : `${Utils.formatPrice(option.pricePerDay)}/日`;
      
      const totalPrice = option.pricePerDay * rentalDays;
      const totalText = option.pricePerDay === 0 
        ? '' 
        : `（${rentalDays}日間: ${Utils.formatPrice(totalPrice)}）`;
      
      const inputType = type === 'insurance' ? 'radio' : 'checkbox';
      const inputName = type === 'insurance' ? 'insurance' : option.id;
      const isChecked = type === 'insurance' 
        ? selectedInsurance === option.id 
        : selectedOptions.includes(option.id);
      
      card.innerHTML = `
        <div class="option-header">
          <input type="${inputType}" 
                 name="${inputName}" 
                 id="${option.id}" 
                 class="option-checkbox" 
                 ${isChecked ? 'checked' : ''}>
          <div class="option-content">
            <div class="option-title">
              <label for="${option.id}">${option.name}</label>
              <span class="option-price">${priceText}${totalText}</span>
            </div>
            <div class="option-description">${option.description}</div>
            ${option.details ? `
              <div class="option-details">
                <div class="option-details-title">詳細</div>
                <ul>
                  ${option.details.map(d => `<li>${d}</li>`).join('')}
                </ul>
              </div>
            ` : ''}
          </div>
        </div>
      `;
      
      card.onclick = (e) => {
        if (e.target.tagName === 'INPUT') return;
        toggleOption(option.id, type);
      };
      
      const checkbox = card.querySelector('input');
      checkbox.onchange = () => toggleOption(option.id, type);
      
      return card;
    }

    // オプション選択切り替え
    function toggleOption(optionId, type) {
      if (type === 'insurance') {
        // 免責補償は単一選択
        selectedInsurance = optionId;
        
        // すべてのカードの選択状態をクリア
        document.querySelectorAll('#insuranceOptions .option-card').forEach(card => {
          card.classList.remove('selected');
          card.querySelector('input').checked = false;
        });
        
        // 選択したカードを強調
        const selectedCard = document.getElementById(optionId).closest('.option-card');
        selectedCard.classList.add('selected');
        selectedCard.querySelector('input').checked = true;
      } else {
        // 追加オプションは複数選択
        const index = selectedOptions.indexOf(optionId);
        if (index > -1) {
          selectedOptions.splice(index, 1);
        } else {
          selectedOptions.push(optionId);
        }
        
        // カードの選択状態を更新
        const card = document.getElementById(optionId).closest('.option-card');
        const checkbox = card.querySelector('input');
        
        if (selectedOptions.includes(optionId)) {
          card.classList.add('selected');
          checkbox.checked = true;
        } else {
          card.classList.remove('selected');
          checkbox.checked = false;
        }
      }
      
      updateTotal();
    }

    // 合計金額更新
    function updateTotal() {
      let insuranceTotal = 0;
      let optionsTotal = 0;
      
      // 免責補償
      if (selectedInsurance && selectedInsurance !== 'insurance-none') {
        const insurance = InsuranceOptions.find(o => o.id === selectedInsurance);
        if (insurance) {
          insuranceTotal = insurance.pricePerDay * rentalDays;
        }
      }
      
      // 追加オプション
      selectedOptions.forEach(optionId => {
        const option = AdditionalOptions.find(o => o.id === optionId);
        if (option) {
          optionsTotal += option.pricePerDay * rentalDays;
        }
      });
      
      // 表示更新
      document.getElementById('totalBasePrice').textContent = Utils.formatPrice(basePrice);
      
      if (insuranceTotal > 0) {
        document.getElementById('insuranceRow').style.display = 'flex';
        document.getElementById('totalInsurance').textContent = Utils.formatPrice(insuranceTotal);
      } else {
        document.getElementById('insuranceRow').style.display = 'none';
      }
      
      if (optionsTotal > 0) {
        document.getElementById('optionsRow').style.display = 'flex';
        document.getElementById('totalOptions').textContent = Utils.formatPrice(optionsTotal);
      } else {
        document.getElementById('optionsRow').style.display = 'none';
      }
      
      const grandTotal = basePrice + insuranceTotal + optionsTotal;
      document.getElementById('grandTotal').textContent = Utils.formatPrice(grandTotal);
    }

    // 次へ進む
    function goNext() {
      // 免責補償が未選択の場合、確認
      if (!selectedInsurance) {
        if (!confirm('免責補償に加入せずに進みますか？\n事故時は規定の免責額をお支払いいただきます。')) {
          return;
        }
        selectedInsurance = 'insurance-none';
      }
      
      // オプション料金を計算
      let insuranceTotal = 0;
      let optionsTotal = 0;
      
      if (selectedInsurance && selectedInsurance !== 'insurance-none') {
        const insurance = InsuranceOptions.find(o => o.id === selectedInsurance);
        if (insurance) {
          insuranceTotal = insurance.pricePerDay * rentalDays;
        }
      }
      
      selectedOptions.forEach(optionId => {
        const option = AdditionalOptions.find(o => o.id === optionId);
        if (option) {
          optionsTotal += option.pricePerDay * rentalDays;
        }
      });
      
      // 保険タイプを変換（API形式: none/standard/premium）
      let insuranceType = 'none';
      let insuranceName = '補償なし';
      if (selectedInsurance && selectedInsurance !== 'insurance-none') {
        const insurance = InsuranceOptions.find(o => o.id === selectedInsurance);
        if (insurance) {
          // IDから保険タイプを抽出（例: "standard" -> "standard"）
          insuranceType = selectedInsurance;
          insuranceName = insurance.name;
        }
      }
      
      // オプションをAPI形式に変換
      const optionsForApi = selectedOptions.map(optionId => {
        const option = AdditionalOptions.find(o => o.id === optionId);
        return {
          optionId: optionId,
          optionName: option ? option.name : optionId,
          quantity: 1
        };
      });
      
      // セッションに保存
      ReservationStorage.save({
        insurance: insuranceType,
        insuranceName: insuranceName,
        options: optionsForApi,
        insurancePrice: insuranceTotal / rentalDays, // 1日あたりの価格
        optionsPrice: optionsTotal / rentalDays,     // 1日あたりの価格
        totalPrice: basePrice + insuranceTotal + optionsTotal
      });
      
      // 次のページへ（受取時間選択）
      window.location.href = 'reserve-pickup.html';
    }

    // 戻る
    function goBack() {
      window.location.href = 'reserve-class.html';
    }

    // ログアウト
    function logout() {
      if (confirm('ログアウトしますか?')) {
        Auth.logout();
        window.location.href = 'login.html';
      }
    }

    // 初期化
    async function init() {
      await AppConfig.loadMasterData();
      
      // APIから取得したデータを使用
      InsuranceOptions = AppConfig.insurancePlans.filter(p => p.id !== 'none').map(p => ({
        id: p.id,
        name: p.name,
        pricePerDay: p.pricePerDay,
        description: p.description,
        details: p.coverageDetails ? [
          p.coverageDetails.personalLiability ? `対人補償: ${p.coverageDetails.personalLiability}` : null,
          p.coverageDetails.propertyDamage ? `対物補償: ${p.coverageDetails.propertyDamage}` : null,
          p.coverageDetails.vehicleDamage ? `車両補償: ${p.coverageDetails.vehicleDamage}` : null,
          p.coverageDetails.nocCoverage ? 'NOC補償: あり' : null,
          p.coverageDetails.roadService ? 'ロードサービス: あり' : null,
          p.deductible !== null ? `免責金額: ${Utils.formatPrice(p.deductible)}` : '免責金額: 0円'
        ].filter(Boolean) : [],
        recommended: p.id === 'standard'
      }));
      
      AdditionalOptions = AppConfig.options.map(o => ({
        id: o.id,
        name: o.name,
        pricePerDay: o.pricePerDay,
        description: o.description,
        details: o.maxQuantity > 1 ? [`最大数量: ${o.maxQuantity}個`] : []
      }));
      
      loadReservationData();
      renderInsuranceOptions();
      renderAdditionalOptions();
      updateTotal();
    }
    init();
  </script>
</body>
</html>
