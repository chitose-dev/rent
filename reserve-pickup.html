<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受取時間選択 - レンタカー予約</title>
  <link rel="preconnect" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="dns-prefetch" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="stylesheet" href="common.css">
  <style>
    .date-display {
      background-color: var(--primary-light);
      padding: var(--spacing-lg);
      border-radius: 8px;
      margin-bottom: var(--spacing-lg);
      text-align: center;
    }
    
    .date-display-title {
      font-size: var(--font-sm);
      color: var(--text-light);
      margin-bottom: var(--spacing-xs);
    }
    
    .date-display-value {
      font-size: var(--font-xl);
      font-weight: bold;
      color: var(--primary-dark);
    }
    
    .time-select-container {
      margin-top: var(--spacing-lg);
    }
    
    .time-select {
      width: 100%;
      padding: var(--spacing-md);
      font-size: var(--font-lg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-white);
      cursor: pointer;
      transition: border-color 0.3s;
    }
    
    .time-select:focus {
      border-color: var(--primary-color);
      outline: none;
    }
    
    @media (min-width: 769px) {
      .time-select-container {
        max-width: 300px;
      }
    }
    
    @media (max-width: 768px) {
      .date-display {
        padding: 10px;
        margin-bottom: 10px;
      }
      
      .date-display-title {
        font-size: 11px;
      }
      
      .date-display-value {
        font-size: 14px;
      }
      
      .time-select-container {
        margin-top: 10px;
      }
      
      .time-select {
        padding: 10px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">
    <div class="header-container">
      <a href="mypage-rental.html" class="header-logo"><img src="images/logo-icon.png" alt="TOKU-NORI" class="header-logo-icon"><img src="images/logo-text.png" alt="レンタカー" class="header-logo-text"></a>
      <nav class="header-nav">
        <a href="mypage-rental.html">マイページ</a>
        <a href="#" onclick="logout(); return false;">ログアウト</a>
      </nav>
      <button class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="container">
    <h1 class="page-title">受取時間を選択</h1>
    
    <!-- 日付表示 -->
    <div class="date-display">
      <div class="date-display-title">受取日</div>
      <div class="date-display-value" id="pickupDate">-</div>
    </div>

    <!-- 時間選択 -->
    <div class="section">
      <h2 class="section-title">受取時間</h2>
      <p class="text-muted mb-md">営業時間: 9:00〜18:00</p>
      
      <div class="time-select-container">
        <select id="timeSelect" class="time-select" onchange="selectTime()">
          <option value="">時間を選択してください</option>
        </select>
      </div>
    </div>

    <div class="alert alert-info mt-lg">
      <strong>ご注意:</strong> 受取時間に遅れる場合は、事前にご連絡ください。
    </div>

    <!-- ボタン -->
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="goBack()">戻る</button>
      <button class="btn btn-primary btn-full" id="nextBtn" disabled onclick="goNext()">次へ進む</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    let selectedTime = null;
    let startDate = null;

    // 予約データを取得
    function loadReservationData() {
      const data = ReservationStorage.get();
      if (!data || !data.selectedInsurance) {
        alert('オプションを選択してください');
        window.location.href = 'reserve-options.html';
        return;
      }
      
      startDate = data.startDate;
      
      // 日付表示
      document.getElementById('pickupDate').textContent = 
        Utils.formatDateJP(new Date(startDate));
      
      // 前回の選択を復元
      if (data.pickupDateTime) {
        const datetime = new Date(data.pickupDateTime);
        const hours = String(datetime.getHours()).padStart(2, '0');
        const minutes = String(datetime.getMinutes()).padStart(2, '0');
        selectedTime = `${hours}:${minutes}`;
      }
    }

    // 時間プルダウン描画
    function renderTimeSelect() {
      const select = document.getElementById('timeSelect');
      
      const timeOptions = Utils.generateTimeOptions(
        AppConfig.openTime,
        AppConfig.closeTime,
        AppConfig.timeStepMinutes
      );
      
      timeOptions.forEach(time => {
        const option = document.createElement('option');
        option.value = time;
        option.textContent = time;
        
        if (time === selectedTime) {
          option.selected = true;
        }
        
        select.appendChild(option);
      });
      
      // 前回の選択がある場合、次へボタンを有効化
      if (selectedTime) {
        document.getElementById('nextBtn').disabled = false;
      }
    }

    // 時間選択
    function selectTime() {
      const select = document.getElementById('timeSelect');
      selectedTime = select.value;
      
      // 次へボタン有効/無効
      document.getElementById('nextBtn').disabled = !selectedTime;
    }

    // 次へ進む
    function goNext() {
      if (!selectedTime) {
        alert('受取時間を選択してください');
        return;
      }
      
      // 日時を結合
      const pickupDateTime = `${startDate}T${selectedTime}:00`;
      
      // セッションに保存
      ReservationStorage.save({
        pickupDateTime: pickupDateTime
      });
      
      // 次のページへ（返却日時選択）
      window.location.href = 'reserve-return.html';
    }

    // 戻る
    function goBack() {
      window.location.href = 'reserve-options.html';
    }

    // ログアウト
    function logout() {
      if (confirm('ログアウトしますか?')) {
        ReservationStorage.clear();
        window.location.href = 'login.html';
      }
    }

    // 初期化
    loadReservationData();
    renderTimeSelect();
  </script>
</body>
</html>
