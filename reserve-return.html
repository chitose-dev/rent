<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>返却時間選択 - レンタカー予約</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .time-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: var(--spacing-sm);
      margin-top: var(--spacing-lg);
    }
    
    .time-btn {
      padding: var(--spacing-md);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--bg-white);
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
      text-align: center;
    }
    
    .time-btn:hover {
      background-color: var(--primary-light);
      border-color: var(--primary-color);
    }
    
    .time-btn.selected {
      background-color: var(--primary-color);
      border-color: var(--primary-dark);
      color: var(--text-dark);
      font-weight: bold;
    }
    
    .date-selector {
      background-color: var(--bg-white);
      padding: var(--spacing-lg);
      border-radius: 8px;
      margin-bottom: var(--spacing-lg);
    }
    
    .date-buttons {
      display: flex;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
      margin-top: var(--spacing-md);
    }
    
    .date-btn {
      flex: 1;
      min-width: 120px;
      padding: var(--spacing-md);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--bg-white);
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    
    .date-btn:hover {
      background-color: var(--primary-light);
      border-color: var(--primary-color);
    }
    
    .date-btn.selected {
      background-color: var(--primary-color);
      border-color: var(--primary-dark);
      font-weight: bold;
    }
    
    .date-btn-label {
      font-size: var(--font-sm);
      color: var(--text-light);
      display: block;
      margin-bottom: var(--spacing-xs);
    }
    
    .date-btn-value {
      font-size: var(--font-md);
      font-weight: bold;
    }
    
    @media (max-width: 768px) {
      .time-grid {
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      }
      
      .time-btn {
        padding: var(--spacing-sm);
        font-size: var(--font-sm);
      }
      
      .date-btn {
        min-width: 100px;
        padding: var(--spacing-sm);
      }
    }
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">
    <div class="header-container">
      <a href="mypage-rental.html" class="header-logo">レンタカー予約</a>
      <nav class="header-nav">
        <a href="mypage-rental.html">マイページ</a>
        <a href="#" onclick="logout()">ログアウト</a>
      </nav>
      <button class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="container">
    <h1 class="page-title">返却日時を選択</h1>
    
    <!-- 返却日選択 -->
    <div class="section date-selector">
      <h2 class="section-title">返却日</h2>
      <p class="text-muted">途中返却も可能です（期間内の日付を選択してください）</p>
      <div class="date-buttons" id="dateButtons"></div>
    </div>

    <!-- 返却時間選択 -->
    <div class="section">
      <h2 class="section-title">返却時間</h2>
      <p class="text-muted mb-md">営業時間: 9:00〜18:00</p>
      <div class="time-grid" id="timeGrid"></div>
    </div>

    <div class="alert alert-info mt-lg">
      <strong>ご注意:</strong> 返却時間を過ぎる場合は、追加料金が発生する可能性があります。
    </div>

    <!-- ボタン -->
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="goBack()">戻る</button>
      <button class="btn btn-primary btn-full" id="nextBtn" disabled onclick="goNext()">次へ進む</button>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    let selectedDate = null;
    let selectedTime = null;
    let startDate = null;
    let endDate = null;
    let availableDates = [];

    // 予約データを取得
    function loadReservationData() {
      const data = ReservationStorage.get();
      if (!data || !data.startDate || !data.endDate) {
        alert('レンタル日を選択してください');
        window.location.href = 'reserve-date.html';
        return;
      }
      
      startDate = new Date(data.startDate);
      endDate = new Date(data.endDate);
      
      // 選択可能な日付リストを生成（開始日〜返却日）
      availableDates = [];
      let currentDate = new Date(startDate);
      while (currentDate <= endDate) {
        availableDates.push(new Date(currentDate));
        currentDate.setDate(currentDate.getDate() + 1);
      }
      
      // 前回の選択を復元
      if (data.returnDateTime) {
        const datetime = new Date(data.returnDateTime);
        selectedDate = Utils.formatDate(datetime);
        const hours = String(datetime.getHours()).padStart(2, '0');
        const minutes = String(datetime.getMinutes()).padStart(2, '0');
        selectedTime = `${hours}:${minutes}`;
      } else {
        // デフォルトは最終日
        selectedDate = Utils.formatDate(endDate);
      }
    }

    // 日付ボタン描画
    function renderDateButtons() {
      const container = document.getElementById('dateButtons');
      container.innerHTML = '';
      
      availableDates.forEach(date => {
        const dateStr = Utils.formatDate(date);
        const btn = document.createElement('button');
        btn.className = 'date-btn';
        
        const isStartDate = dateStr === Utils.formatDate(startDate);
        const isEndDate = dateStr === Utils.formatDate(endDate);
        
        let label = '';
        if (isStartDate) label = '受取日';
        else if (isEndDate) label = '返却日';
        else label = '途中返却';
        
        btn.innerHTML = `
          <span class="date-btn-label">${label}</span>
          <span class="date-btn-value">${date.getMonth() + 1}/${date.getDate()}</span>
        `;
        
        btn.onclick = () => selectDate(dateStr);
        
        if (dateStr === selectedDate) {
          btn.classList.add('selected');
        }
        
        container.appendChild(btn);
      });
    }

    // 日付選択
    function selectDate(dateStr) {
      selectedDate = dateStr;
      selectedTime = null; // 時間選択をリセット
      
      // 日付ボタン更新
      document.querySelectorAll('.date-btn').forEach(btn => {
        btn.classList.remove('selected');
      });
      event.target.closest('.date-btn').classList.add('selected');
      
      // 時間グリッド再描画
      renderTimeGrid();
      
      // 次へボタン無効化（時間を再選択させる）
      document.getElementById('nextBtn').disabled = true;
    }

    // 時間グリッド描画
    function renderTimeGrid() {
      const container = document.getElementById('timeGrid');
      container.innerHTML = '';
      
      const timeOptions = Utils.generateTimeOptions(
        AppConfig.openTime,
        AppConfig.closeTime,
        AppConfig.timeStepMinutes
      );
      
      timeOptions.forEach(time => {
        const btn = document.createElement('button');
        btn.className = 'time-btn';
        btn.textContent = time;
        btn.onclick = () => selectTime(time);
        
        if (time === selectedTime) {
          btn.classList.add('selected');
        }
        
        container.appendChild(btn);
      });
    }

    // 時間選択
    function selectTime(time) {
      selectedTime = time;
      
      // 全ボタンの選択状態をクリア
      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.classList.remove('selected');
      });
      
      // 選択したボタンを強調
      event.target.classList.add('selected');
      
      // 次へボタン有効化
      document.getElementById('nextBtn').disabled = false;
    }

    // 次へ進む
    function goNext() {
      if (!selectedDate || !selectedTime) {
        alert('返却日時を選択してください');
        return;
      }
      
      // 日時を結合
      const returnDateTime = `${selectedDate}T${selectedTime}:00`;
      
      // セッションに保存
      ReservationStorage.save({
        returnDateTime: returnDateTime
      });
      
      // 次のページへ
      window.location.href = 'reserve-payment.html';
    }

    // 戻る
    function goBack() {
      window.location.href = 'reserve-pickup.html';
    }

    // ログアウト
    function logout() {
      if (confirm('ログアウトしますか?')) {
        ReservationStorage.clear();
        window.location.href = 'login.html';
      }
    }

    // 初期化
    loadReservationData();
    renderDateButtons();
    renderTimeGrid();
    
    // 前回の選択がある場合、次へボタンを有効化
    if (selectedDate && selectedTime) {
      document.getElementById('nextBtn').disabled = false;
    }
  </script>
</body>
</html>
