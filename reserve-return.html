<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>返却日時選択 - レンタカー予約</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .select-container {
      margin-top: var(--spacing-lg);
    }
    
    .custom-select {
      width: 100%;
      padding: var(--spacing-md);
      font-size: var(--font-lg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-white);
      cursor: pointer;
      transition: border-color 0.3s;
    }
    
    .custom-select:focus {
      border-color: var(--primary-color);
      outline: none;
    }
    
    .info-box {
      background-color: var(--primary-light);
      padding: var(--spacing-lg);
      border-radius: 8px;
      margin-bottom: var(--spacing-lg);
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-sm);
    }
    
    .info-row:last-child {
      margin-bottom: 0;
    }
    
    .info-label {
      color: var(--text-light);
    }
    
    .info-value {
      font-weight: bold;
      color: var(--primary-dark);
    }
    
    @media (min-width: 769px) {
      .select-container {
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">
    <div class="header-container">
      <a href="mypage-rental.html" class="header-logo">トクノリレンタカー</a>
      <nav class="header-nav">
        <a href="mypage-rental.html">マイページ</a>
        <a href="#" onclick="logout()">ログアウト</a>
      </nav>
      <button class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="container">
    <h1 class="page-title">返却日時を選択</h1>
    
    <!-- 予約情報 -->
    <div class="info-box">
      <div class="info-row">
        <span class="info-label">受取日:</span>
        <span class="info-value" id="infoStartDate">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">返却日:</span>
        <span class="info-value" id="infoEndDate">-</span>
      </div>
    </div>

    <!-- 返却日選択 -->
    <div class="section">
      <h2 class="section-title">返却日</h2>
      <p class="text-muted">途中返却も可能です（期間内の日付を選択してください）</p>
      
      <div class="select-container">
        <select id="dateSelect" class="custom-select" onchange="selectDate()">
          <option value="">返却日を選択してください</option>
        </select>
      </div>
    </div>

    <!-- 返却時間選択 -->
    <div class="section">
      <h2 class="section-title">返却時間</h2>
      <p class="text-muted mb-md">営業時間: 9:00〜18:00</p>
      
      <div class="select-container">
        <select id="timeSelect" class="custom-select" onchange="selectTime()">
          <option value="">時間を選択してください</option>
        </select>
      </div>
    </div>

    <div class="alert alert-info mt-lg">
      <strong>ご注意:</strong> 返却時間を過ぎる場合は、追加料金が発生する可能性があります。
    </div>

    <!-- ボタン -->
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="goBack()">戻る</button>
      <button class="btn btn-primary btn-full" id="nextBtn" disabled onclick="goNext()">次へ進む</button>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    let selectedDate = null;
    let selectedTime = null;
    let startDate = null;
    let endDate = null;
    let availableDates = [];

    // 予約データを取得
    function loadReservationData() {
      const data = ReservationStorage.get();
      if (!data || !data.startDate || !data.endDate) {
        alert('レンタル日を選択してください');
        window.location.href = 'reserve-date.html';
        return;
      }
      
      startDate = new Date(data.startDate);
      endDate = new Date(data.endDate);
      
      // 情報表示
      document.getElementById('infoStartDate').textContent = Utils.formatDateJP(startDate);
      document.getElementById('infoEndDate').textContent = Utils.formatDateJP(endDate);
      
      // 選択可能な日付リストを生成（開始日〜返却日）
      availableDates = [];
      let currentDate = new Date(startDate);
      while (currentDate <= endDate) {
        availableDates.push(new Date(currentDate));
        currentDate.setDate(currentDate.getDate() + 1);
      }
      
      // 前回の選択を復元
      if (data.returnDateTime) {
        const datetime = new Date(data.returnDateTime);
        selectedDate = Utils.formatDate(datetime);
        const hours = String(datetime.getHours()).padStart(2, '0');
        const minutes = String(datetime.getMinutes()).padStart(2, '0');
        selectedTime = `${hours}:${minutes}`;
      } else {
        // デフォルトは最終日
        selectedDate = Utils.formatDate(endDate);
      }
    }

    // 日付プルダウン描画
    function renderDateSelect() {
      const select = document.getElementById('dateSelect');
      
      availableDates.forEach(date => {
        const dateStr = Utils.formatDate(date);
        const option = document.createElement('option');
        option.value = dateStr;
        
        const isStartDate = dateStr === Utils.formatDate(startDate);
        const isEndDate = dateStr === Utils.formatDate(endDate);
        
        let label = '';
        if (isStartDate) label = '（受取日）';
        else if (isEndDate) label = '（返却日）';
        else label = '（途中返却）';
        
        option.textContent = `${date.getMonth() + 1}月${date.getDate()}日 ${label}`;
        
        if (dateStr === selectedDate) {
          option.selected = true;
        }
        
        select.appendChild(option);
      });
    }

    // 時間プルダウン描画
    function renderTimeSelect() {
      const select = document.getElementById('timeSelect');
      select.innerHTML = '<option value="">時間を選択してください</option>';
      
      const timeOptions = Utils.generateTimeOptions(
        AppConfig.openTime,
        AppConfig.closeTime,
        AppConfig.timeStepMinutes
      );
      
      timeOptions.forEach(time => {
        const option = document.createElement('option');
        option.value = time;
        option.textContent = time;
        
        if (time === selectedTime) {
          option.selected = true;
        }
        
        select.appendChild(option);
      });
    }

    // 日付選択
    function selectDate() {
      const select = document.getElementById('dateSelect');
      selectedDate = select.value;
      
      updateNextButton();
    }

    // 時間選択
    function selectTime() {
      const select = document.getElementById('timeSelect');
      selectedTime = select.value;
      
      updateNextButton();
    }

    // 次へボタン更新
    function updateNextButton() {
      document.getElementById('nextBtn').disabled = !(selectedDate && selectedTime);
    }

    // 次へ進む
    function goNext() {
      if (!selectedDate || !selectedTime) {
        alert('返却日時を選択してください');
        return;
      }
      
      // 日時を結合
      const returnDateTime = `${selectedDate}T${selectedTime}:00`;
      
      // セッションに保存
      ReservationStorage.save({
        returnDateTime: returnDateTime
      });
      
      // 次のページへ
      window.location.href = 'reserve-payment.html';
    }

    // 戻る
    function goBack() {
      window.location.href = 'reserve-pickup.html';
    }

    // ログアウト
    function logout() {
      if (confirm('ログアウトしますか?')) {
        ReservationStorage.clear();
        window.location.href = 'login.html';
      }
    }

    // 初期化
    loadReservationData();
    renderDateSelect();
    renderTimeSelect();
    updateNextButton();
  </script>
</body>
</html>
