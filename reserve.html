<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約入力 - トクノリレンタカー</title>
  <link rel="preconnect" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="dns-prefetch" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="stylesheet" href="common.css">
  <style>
    .reserve-section {
      background: var(--bg-white);
      border-radius: 8px;
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
      border: 1px solid var(--border-color);
    }
    
    .reserve-section.locked {
      opacity: 0.7;
    }
    
    .reserve-section-title {
      font-size: var(--font-lg);
      font-weight: bold;
      margin-bottom: var(--spacing-md);
      padding-bottom: var(--spacing-sm);
      border-bottom: 2px solid var(--primary-color);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    
    .reserve-section-number {
      background: var(--primary-color);
      color: var(--text-dark);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-md);
      font-weight: bold;
    }
    
    .reserve-section.locked .reserve-section-number {
      background: var(--border-color);
      color: var(--text-light);
    }
    
    .reserve-section.locked .reserve-section-title {
      border-bottom-color: var(--border-color);
    }
    
    .section-content {
      display: block;
    }
    
    .section-content.hidden {
      display: none;
    }
    
    .section-locked-message {
      color: #c00;
      font-size: var(--font-sm);
      margin-top: var(--spacing-sm);
    }
    
    .section-locked-message.hidden {
      display: none;
    }
    
    .section-completed {
      background: var(--primary-light);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: 6px;
      font-size: var(--font-sm);
      color: var(--primary-dark);
      display: none;
      margin-bottom: var(--spacing-md);
    }
    
    .section-completed.show {
      display: block;
    }
    
    /* 日数選択 */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--spacing-sm);
    }
    
    .days-btn {
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: var(--spacing-md);
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-white);
      text-align: center;
    }
    
    .days-btn:hover, .days-btn.selected {
      border-color: var(--primary-color);
      background: var(--primary-light);
    }
    
    .days-btn-number {
      font-size: var(--font-xl);
      font-weight: bold;
      color: var(--primary-dark);
    }
    
    .days-btn-label {
      font-size: var(--font-sm);
    }
    
    /* カレンダー */
    .calendar-container {
      background-color: var(--bg-light);
      border-radius: 8px;
      padding: var(--spacing-lg);
      margin: var(--spacing-md) auto 0;
      max-width: 600px;
    }
    
    .calendar-guide {
      background: var(--primary-light);
      padding: var(--spacing-md);
      border-radius: 6px;
      margin-bottom: var(--spacing-md);
      font-size: var(--font-md);
      text-align: center;
      font-weight: 500;
    }
    
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
    }
    
    .calendar-month {
      font-size: var(--font-lg);
      font-weight: bold;
    }
    
    .calendar-nav-btn {
      background-color: var(--primary-color);
      color: var(--text-dark);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-weight: bold;
      font-size: var(--font-md);
      border: none;
      cursor: pointer;
    }
    
    .calendar-nav-btn:hover {
      background-color: var(--primary-dark);
    }
    
    .calendar-nav-btn:disabled {
      background-color: var(--disabled-color);
      cursor: not-allowed;
    }
    
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: var(--spacing-xs);
    }
    
    .calendar-weekday {
      text-align: center;
      font-weight: bold;
      color: var(--text-light);
      padding: var(--spacing-xs);
      font-size: var(--font-sm);
    }
    
    .calendar-weekday.sunday { color: #D32F2F; }
    .calendar-weekday.saturday { color: #1976D2; }
    
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    
    .calendar-day {
      aspect-ratio: 1;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      background: var(--bg-white);
      font-size: var(--font-lg);
    }
    
    .calendar-day:not(.disabled):hover {
      background-color: var(--primary-light);
      border-color: var(--primary-color);
    }
    
    .calendar-day.disabled {
      background-color: var(--bg-light);
      color: var(--disabled-color);
      cursor: not-allowed;
      border-color: transparent;
    }
    
    .calendar-day.selected {
      background-color: var(--primary-color);
      border-color: var(--primary-dark);
      color: var(--text-dark);
      font-weight: bold;
    }
    
    .calendar-day.in-range {
      background-color: var(--primary-light);
      border-color: var(--primary-color);
    }
    
    .calendar-day.sunday { color: #D32F2F; }
    .calendar-day.saturday { color: #1976D2; }
    .calendar-day.selected.sunday,
    .calendar-day.selected.saturday { color: var(--text-dark); }
    .calendar-day.empty { border: none; cursor: default; background: transparent; }
    
    /* 時間選択 */
    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
      margin-top: var(--spacing-md);
    }
    
    .form-group {
      margin-bottom: var(--spacing-md);
    }
    
    .form-group:last-child {
      margin-bottom: 0;
    }
    
    .form-label {
      display: block;
      font-weight: bold;
      margin-bottom: var(--spacing-xs);
      font-size: var(--font-sm);
    }
    
    .form-input, .form-select {
      width: 100%;
      padding: var(--spacing-md);
      border: 2px solid var(--border-color);
      border-radius: 6px;
      font-size: var(--font-md);
      background: var(--bg-white);
    }
    
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary-color);
    }
    
    .date-info-box {
      background: var(--primary-light);
      padding: var(--spacing-md);
      border-radius: 6px;
      margin-top: var(--spacing-md);
    }
    
    .date-info-row {
      display: flex;
      justify-content: space-between;
      font-size: var(--font-sm);
      margin-bottom: var(--spacing-xs);
    }
    
    .date-info-row:last-child {
      margin-bottom: 0;
    }
    
    /* 車両クラス */
    .class-grid {
      display: grid;
      gap: var(--spacing-md);
    }
    
    .class-card {
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: var(--spacing-md);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      gap: var(--spacing-md);
      align-items: center;
    }
    
    .class-card:hover, .class-card.selected {
      border-color: var(--primary-color);
      background: var(--primary-light);
    }
    
    .class-card-image {
      width: 100px;
      height: 70px;
      background: var(--bg-light);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      font-size: var(--font-sm);
      flex-shrink: 0;
    }
    
    .class-card-info {
      flex: 1;
      min-width: 0;
    }
    
    .class-card-name {
      font-weight: bold;
      font-size: var(--font-md);
    }
    
    .class-card-desc {
      font-size: var(--font-sm);
      color: var(--text-light);
      margin-top: 2px;
    }
    
    .class-card-price {
      font-weight: bold;
      color: var(--primary-dark);
      font-size: var(--font-lg);
      white-space: nowrap;
    }
    
    /* オプション */
    .option-group {
      margin-bottom: var(--spacing-lg);
    }
    
    .option-group:last-child {
      margin-bottom: 0;
    }
    
    .option-group-title {
      font-weight: bold;
      margin-bottom: var(--spacing-sm);
      font-size: var(--font-md);
    }
    
    .option-card {
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-sm);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-md);
    }
    
    .option-card:last-child {
      margin-bottom: 0;
    }
    
    .option-card:hover, .option-card.selected {
      border-color: var(--primary-color);
      background: var(--primary-light);
    }
    
    .option-card input[type="radio"],
    .option-card input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    
    .option-card-info {
      flex: 1;
    }
    
    .option-card-name {
      font-weight: bold;
    }
    
    .option-card-desc {
      font-size: var(--font-sm);
      color: var(--text-light);
      margin-top: 2px;
    }
    
    .option-card-price {
      font-weight: bold;
      color: var(--primary-dark);
      white-space: nowrap;
    }
    
    .option-card.recommended {
      position: relative;
    }
    
    .option-card.recommended::before {
      content: 'おすすめ';
      position: absolute;
      top: -10px;
      left: 12px;
      background: var(--primary-color);
      color: var(--text-dark);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: var(--font-xs);
      font-weight: bold;
    }
    
    /* 決済方法 */
    .payment-card {
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-sm);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-md);
    }
    
    .payment-card:last-child {
      margin-bottom: 0;
    }
    
    .payment-card:hover, .payment-card.selected {
      border-color: var(--primary-color);
      background: var(--primary-light);
    }
    
    .payment-card input[type="radio"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    
    .payment-card-info {
      flex: 1;
    }
    
    .payment-card-name {
      font-weight: bold;
    }
    
    .payment-card-desc {
      font-size: var(--font-sm);
      color: var(--text-light);
      margin-top: 2px;
    }
    
    /* 料金サマリー */
    .price-summary {
      background: var(--primary-light);
      border-radius: 8px;
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
      position: sticky;
      bottom: 0;
    }
    
    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-sm);
      font-size: var(--font-sm);
    }
    
    .price-row.total {
      margin-top: var(--spacing-md);
      padding-top: var(--spacing-md);
      border-top: 2px solid var(--primary-color);
      font-size: var(--font-lg);
      font-weight: bold;
    }
    
    .price-label {
      color: var(--text-dark);
    }
    
    .price-value {
      font-weight: bold;
    }
    
    /* レスポンシブ */
    @media (max-width: 768px) {
      .reserve-section {
        padding: var(--spacing-md);
      }
      
      .days-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      
      .days-btn {
        padding: var(--spacing-sm);
      }
      
      .days-btn-number {
        font-size: var(--font-lg);
      }
      
      .date-time-row {
        grid-template-columns: 1fr;
      }
      
      .class-card {
        flex-direction: column;
        align-items: stretch;
      }
      
      .class-card-image {
        width: 100%;
        height: 120px;
      }
      
      .class-card-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      .price-summary {
        position: relative;
      }
    }
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">
    <div class="header-container">
      <a href="mypage-rental.html" class="header-logo">
        <img src="images/logo-icon.png" alt="TOKU-NORI" class="header-logo-icon">
        <img src="images/logo-text.png" alt="レンタカー" class="header-logo-text">
      </a>
      <nav class="header-nav">
        <a href="mypage-rental.html">マイページ</a>
        <a href="#" onclick="logout(); return false;">ログアウト</a>
      </nav>
      <button type="button" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="container">
    <h1 class="page-title">予約情報入力</h1>
    
    <!-- 1. レンタル期間 -->
    <div class="reserve-section" id="section-period">
      <h2 class="reserve-section-title">
        <span class="reserve-section-number">1</span>
        レンタル期間
      </h2>
      <div class="section-completed" id="completed-period"></div>
      <div class="section-content" id="content-period">
      
      <!-- 日数選択 -->
      <div class="form-group">
        <label class="form-label">レンタル日数</label>
        <div class="days-grid">
          <div class="days-btn" data-days="1" onclick="selectDays(1)">
            <div class="days-btn-number">1</div>
            <div class="days-btn-label">日</div>
          </div>
          <div class="days-btn" data-days="2" onclick="selectDays(2)">
            <div class="days-btn-number">2</div>
            <div class="days-btn-label">日</div>
          </div>
          <div class="days-btn" data-days="3" onclick="selectDays(3)">
            <div class="days-btn-number">3</div>
            <div class="days-btn-label">日</div>
          </div>
          <div class="days-btn" data-days="7" onclick="selectDays(7)">
            <div class="days-btn-number">7</div>
            <div class="days-btn-label">日</div>
          </div>
        </div>
      </div>
      
      <!-- カレンダー（日数選択後に表示） -->
      <div id="calendarSection" style="display: none;">
        <div class="form-group">
          <div class="calendar-container">
            <div class="calendar-guide" id="calendarGuide">受取希望の日付を選択してください</div>
            <div class="calendar-header">
              <button type="button" class="calendar-nav-btn" id="prevMonthBtn" onclick="changeMonth(-1)">◀</button>
              <span class="calendar-month" id="calendarMonth"></span>
              <button type="button" class="calendar-nav-btn" id="nextMonthBtn" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-weekdays">
              <div class="calendar-weekday sunday">日</div>
              <div class="calendar-weekday">月</div>
              <div class="calendar-weekday">火</div>
              <div class="calendar-weekday">水</div>
              <div class="calendar-weekday">木</div>
              <div class="calendar-weekday">金</div>
              <div class="calendar-weekday saturday">土</div>
            </div>
            <div class="calendar-days" id="calendarDays"></div>
          </div>
        </div>
        
        <!-- 選択した日程情報 -->
        <div class="date-info-box" id="dateInfoBox" style="display: none;">
          <div class="date-info-row">
            <span>受取日:</span>
            <strong id="infoStartDate">-</strong>
          </div>
          <div class="date-info-row">
            <span>返却期限:</span>
            <strong id="infoEndDate">-</strong>
          </div>
          <div class="date-info-row">
            <span>レンタル日数:</span>
            <strong id="infoDays">-</strong>
          </div>
        </div>
        
        <!-- 受取時間選択（日付選択後に表示） -->
        <div id="timeSection" style="display: none;">
          <div class="form-group">
            <label class="form-label">受取時間</label>
            <select class="form-select" id="startTime" onchange="checkPeriodComplete()">
              <option value="">選択してください</option>
              <option value="08:00">08:00</option>
              <option value="08:30">08:30</option>
              <option value="09:00">09:00</option>
              <option value="09:30">09:30</option>
              <option value="10:00">10:00</option>
              <option value="10:30">10:30</option>
              <option value="11:00">11:00</option>
              <option value="11:30">11:30</option>
              <option value="12:00">12:00</option>
              <option value="12:30">12:30</option>
              <option value="13:00">13:00</option>
              <option value="13:30">13:30</option>
              <option value="14:00">14:00</option>
              <option value="14:30">14:30</option>
              <option value="15:00">15:00</option>
              <option value="15:30">15:30</option>
              <option value="16:00">16:00</option>
              <option value="16:30">16:30</option>
              <option value="17:00">17:00</option>
              <option value="17:30">17:30</option>
              <option value="18:00">18:00</option>
              <option value="18:30">18:30</option>
              <option value="19:00">19:00</option>
              <option value="19:30">19:30</option>
              <option value="20:00">20:00</option>
            </select>
            <p class="form-hint">返却は営業時間内であればいつでも可能です</p>
          </div>
        </div>
      </div>
      
      </div>
    </div>
    
    <!-- 2. 車両クラス -->
    <div class="reserve-section locked" id="section-class">
      <h2 class="reserve-section-title">
        <span class="reserve-section-number">2</span>
        車両クラス
      </h2>
      <div class="section-locked-message" id="locked-class">レンタル期間を選択してください</div>
      <div class="section-completed" id="completed-class"></div>
      <div class="section-content hidden" id="content-class">
      <div class="class-grid" id="class-grid">
        <!-- APIから動的に生成 -->
        <div class="loading">読み込み中...</div>
      </div>
      </div>
    </div>
    
    <!-- 3. オプション -->
    <div class="reserve-section" id="section-options">
      <h2 class="reserve-section-title">
        <span class="reserve-section-number">3</span>
        オプション
      </h2>
      <div class="section-completed" id="completed-options"></div>
      <div class="section-content" id="content-options">
      <!-- 免責補償（APIから動的生成） -->
      <div class="option-group" id="insurance-options">
        <div class="option-group-title">免責補償</div>
        <!-- renderInsuranceOptions()で動的生成 -->
      </div>
      
      <!-- 追加オプション（APIから動的生成） -->
      <div class="option-group" id="additional-options">
        <div class="option-group-title">追加オプション</div>
        <!-- renderAdditionalOptions()で動的生成 -->
      </div>
      </div>
    </div>
    
    <!-- 4. 決済方法 -->
    <div class="reserve-section" id="section-payment">
      <h2 class="reserve-section-title">
        <span class="reserve-section-number">4</span>
        決済方法
      </h2>
      <div class="section-completed" id="completed-payment"></div>
      <div class="section-content" id="content-payment">
      <div class="payment-card" data-payment="card" onclick="selectPayment(this)">
        <input type="radio" name="payment" value="card">
        <div class="payment-card-info">
          <div class="payment-card-name">クレジットカード</div>
          <div class="payment-card-desc">VISA / MasterCard / JCB / AMEX</div>
        </div>
      </div>
      
      <div class="payment-card" data-payment="local" onclick="selectPayment(this)">
        <input type="radio" name="payment" value="local">
        <div class="payment-card-info">
          <div class="payment-card-name">現地払い</div>
          <div class="payment-card-desc">現金またはクレジットカード</div>
        </div>
      </div>
      </div>
    </div>
    
    <!-- 料金サマリー -->
    <div class="price-summary" id="price-summary" style="display: none;">
      <div class="price-row">
        <span class="price-label">基本料金</span>
        <span class="price-value" id="summary-base">¥0</span>
      </div>
      <div class="price-row">
        <span class="price-label">免責補償</span>
        <span class="price-value" id="summary-insurance">¥0</span>
      </div>
      <div class="price-row">
        <span class="price-label">オプション</span>
        <span class="price-value" id="summary-options">¥0</span>
      </div>
      <div class="price-row total">
        <span class="price-label">合計（税込）</span>
        <span class="price-value" id="summary-total">¥0</span>
      </div>
    </div>
    
    <!-- ボタン -->
    <div class="btn-group">
      <button type="button" class="btn btn-secondary" onclick="goBack()">戻る</button>
      <button type="button" class="btn btn-primary btn-full" onclick="goConfirm()">確認画面へ</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    // 状態管理
    let state = {
      days: null,
      startDate: null,
      startTime: null,
      endDate: null, // 自動計算
      vehicleClass: null,
      carClassId: null,
      pricingPlanId: null,
      classPrice: 0,
      insurance: null,
      insuranceName: null,
      insurancePrice: 0,
      options: [],
      optionsPrice: 0,
      payment: null
    };
    
    // カレンダー用
    let currentCalendarDate = new Date();
    let selectedStartDate = null;
    
    // 初期化
    async function init() {
      // 認証チェック
      if (!Auth.requireAuth()) return;
      
      // マスターデータ読み込み
      await AppConfig.loadMasterData();
      
      // 車両クラスを動的に生成
      renderCarClasses();
      
      // オプションを動的に生成
      renderInsuranceOptions();
      renderAdditionalOptions();
      
      // セッションから復元
      const saved = ReservationStorage.get();
      if (saved) {
        // 復元処理（必要に応じて）
      }
      
      updateSections();
    }
    
    // 車両クラスを動的生成
    function renderCarClasses() {
      const container = document.getElementById('class-grid');
      
      if (!AppConfig.carClasses || AppConfig.carClasses.length === 0) {
        container.innerHTML = '<p>車両クラスがありません</p>';
        return;
      }
      
      container.innerHTML = AppConfig.carClasses.map(carClass => {
        // 料金プランから1日あたりの基本料金を計算（最小のプランから）
        const plans = AppConfig.pricingPlans.filter(p => p.carClassId === carClass.id);
        let dailyPrice = 0;
        if (plans.length > 0) {
          // 最初のプランの1日あたり料金を計算
          const firstPlan = plans.reduce((a, b) => a.days < b.days ? a : b);
          dailyPrice = Math.round(firstPlan.price / firstPlan.days);
        }
        
        return `
          <div class="class-card" data-class-id="${escapeHtml(carClass.id)}" data-class-name="${escapeHtml(carClass.name)}" data-daily-price="${dailyPrice}" onclick="selectClass(this)">
            <div class="class-card-image">${carClass.imageUrl ? `<img src="${escapeHtml(carClass.imageUrl)}" alt="${escapeHtml(carClass.name)}">` : '車両画像'}</div>
            <div class="class-card-info">
              <div class="class-card-name">${escapeHtml(carClass.name)}</div>
              <div class="class-card-desc">${escapeHtml(carClass.description || '')}</div>
              ${carClass.notes ? `<div class="class-card-desc">${escapeHtml(carClass.notes)}</div>` : ''}
            </div>
            <div class="class-card-price">¥${dailyPrice.toLocaleString()}/日〜</div>
          </div>
        `;
      }).join('');
    }
    
    // 免責補償オプションを動的生成
    function renderInsuranceOptions() {
      const container = document.getElementById('insurance-options');
      const title = container.querySelector('.option-group-title');
      
      // 既存のオプションカードを削除
      container.querySelectorAll('.option-card').forEach(el => el.remove());
      
      // APIから取得した保険プランを表示
      AppConfig.insurancePlans.forEach((plan, index) => {
        const card = document.createElement('div');
        card.className = 'option-card' + (plan.id === 'standard' ? ' recommended' : '');
        card.dataset.insurance = plan.id;
        card.dataset.price = plan.pricePerDay;
        card.onclick = function() { selectInsurance(this); };
        
        const priceText = plan.pricePerDay === 0 ? '¥0' : `¥${plan.pricePerDay.toLocaleString()}/日`;
        
        card.innerHTML = `
          <input type="radio" name="insurance" value="${escapeHtml(plan.id)}">
          <div class="option-card-info">
            <div class="option-card-name">${escapeHtml(plan.name)}</div>
            <div class="option-card-desc">${escapeHtml(plan.description || '')}</div>
          </div>
          <div class="option-card-price">${priceText}</div>
        `;
        
        container.appendChild(card);
      });
    }
    
    // 追加オプションを動的生成
    function renderAdditionalOptions() {
      const container = document.getElementById('additional-options');
      const title = container.querySelector('.option-group-title');
      
      // 既存のオプションカードを削除
      container.querySelectorAll('.option-card').forEach(el => el.remove());
      
      // APIから取得したオプションを表示
      AppConfig.options.forEach(option => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.dataset.option = option.id;
        card.dataset.optionName = option.name;
        card.dataset.price = option.pricePerDay;
        card.onclick = function() { toggleOption(this); };
        
        card.innerHTML = `
          <input type="checkbox" value="${escapeHtml(option.id)}">
          <div class="option-card-info">
            <div class="option-card-name">${escapeHtml(option.name)}</div>
            <div class="option-card-desc">${escapeHtml(option.description || '')}</div>
          </div>
          <div class="option-card-price">¥${option.pricePerDay.toLocaleString()}/日</div>
        `;
        
        container.appendChild(card);
      });
    }
    
    // セクションのロック/アンロック制御
    function updateSections() {
      // セクション2: 車両クラス（レンタル期間が完了したら表示）
      const periodComplete = state.days && state.startDate && state.startTime;
      toggleSection('class', periodComplete);
      if (periodComplete) {
        const startDateObj = new Date(state.startDate);
        const endDateObj = new Date(state.endDate);
        document.getElementById('completed-period').textContent = 
          `${state.days}日間 / ${startDateObj.getMonth()+1}月${startDateObj.getDate()}日 ${state.startTime}受取 〜 ${endDateObj.getMonth()+1}月${endDateObj.getDate()}日まで`;
        document.getElementById('completed-period').classList.add('show');
        // 車両クラスの料金を更新
        updateClassPrices();
      } else {
        document.getElementById('completed-period').classList.remove('show');
      }
      
      // 車両クラス選択済みの表示
      if (state.vehicleClass) {
        const className = state.vehicleClassName || state.vehicleClass;
        document.getElementById('completed-class').textContent = className;
        document.getElementById('completed-class').classList.add('show');
      } else {
        document.getElementById('completed-class').classList.remove('show');
      }
      
      // オプション選択済みの表示
      if (state.insurance !== null) {
        let optText = state.insuranceName || state.insurance;
        if (state.options.length > 0) {
          optText += ` + オプション${state.options.length}件`;
        }
        document.getElementById('completed-options').textContent = optText;
        document.getElementById('completed-options').classList.add('show');
      } else {
        document.getElementById('completed-options').classList.remove('show');
      }
      
      // 決済方法選択済みの表示 + 料金サマリー
      if (state.payment) {
        const paymentNames = { card: 'クレジットカード', local: '現地払い' };
        document.getElementById('completed-payment').textContent = paymentNames[state.payment];
        document.getElementById('completed-payment').classList.add('show');
      } else {
        document.getElementById('completed-payment').classList.remove('show');
      }
      
      // 料金サマリーは車両クラスと日程が決まったら表示
      if (state.vehicleClass && state.startDate && state.endDate) {
        document.getElementById('price-summary').style.display = 'block';
        updateSummary();
      } else {
        document.getElementById('price-summary').style.display = 'none';
      }
    }
    
    // セクション表示切り替え
    function toggleSection(name, unlock) {
      const section = document.getElementById('section-' + name);
      const content = document.getElementById('content-' + name);
      const locked = document.getElementById('locked-' + name);
      
      if (unlock) {
        section.classList.remove('locked');
        content.classList.remove('hidden');
        locked.classList.add('hidden');
      } else {
        section.classList.add('locked');
        content.classList.add('hidden');
        locked.classList.remove('hidden');
      }
    }
    
    // 日数選択（プラン選択）
    function selectDays(days) {
      state.days = days;
      document.querySelectorAll('.days-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.days == days);
      });
      
      // カレンダーを表示
      document.getElementById('calendarSection').style.display = 'block';
      
      // 既に開始日が選択されていたら返却日を再計算
      if (selectedStartDate) {
        calculateEndDate();
        updateDateInfo();
      }
      
      renderCalendar();
      updateSections();
    }
    
    // 返却日を自動計算
    function calculateEndDate() {
      if (selectedStartDate && state.days) {
        const endDate = new Date(selectedStartDate);
        endDate.setDate(endDate.getDate() + state.days - 1);
        state.endDate = formatDate(endDate);
      }
    }
    
    // カレンダー描画
    function renderCalendar() {
      const year = currentCalendarDate.getFullYear();
      const month = currentCalendarDate.getMonth();
      
      // ヘッダー更新
      document.getElementById('calendarMonth').textContent = `${year}年${month + 1}月`;
      
      // ガイドメッセージ更新
      if (!selectedStartDate) {
        document.getElementById('calendarGuide').textContent = '受取希望の日付を選択してください';
      } else {
        document.getElementById('calendarGuide').textContent = '日程が選択されました。返却期限は自動計算されます。';
      }
      
      // 月の最初の日と最後の日
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startDayOfWeek = firstDay.getDay();
      
      const container = document.getElementById('calendarDays');
      container.innerHTML = '';
      
      // 空白セル
      for (let i = 0; i < startDayOfWeek; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.className = 'calendar-day empty';
        container.appendChild(emptyDay);
      }
      
      // 今日の日付
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      // 返却期限日（開始日 + 日数 - 1）
      let endDate = null;
      if (selectedStartDate && state.days) {
        endDate = new Date(selectedStartDate);
        endDate.setDate(endDate.getDate() + state.days - 1);
      }
      
      // 日付セル
      for (let day = 1; day <= lastDay.getDate(); day++) {
        const date = new Date(year, month, day);
        const dayCell = document.createElement('div');
        dayCell.className = 'calendar-day';
        dayCell.textContent = day;
        
        // 曜日クラス
        const dayOfWeek = date.getDay();
        if (dayOfWeek === 0) dayCell.classList.add('sunday');
        if (dayOfWeek === 6) dayCell.classList.add('saturday');
        
        // 過去の日付は選択不可
        if (date <= today) {
          dayCell.classList.add('disabled');
        } else {
          dayCell.onclick = () => selectDate(date);
        }
        
        // 開始日
        if (selectedStartDate && date.toDateString() === selectedStartDate.toDateString()) {
          dayCell.classList.add('selected');
        }
        
        // 返却期限日
        if (endDate && date.toDateString() === endDate.toDateString()) {
          dayCell.classList.add('selected');
        }
        
        // レンタル期間内の日付
        if (selectedStartDate && endDate) {
          if (date > selectedStartDate && date < endDate) {
            dayCell.classList.add('in-range');
          }
        }
        
        container.appendChild(dayCell);
      }
      
      updateNavButtons();
    }
    
    // 月変更
    function changeMonth(delta) {
      currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
      renderCalendar();
    }
    
    // ナビゲーションボタン更新
    function updateNavButtons() {
      const today = new Date();
      const minDate = new Date(today.getFullYear(), today.getMonth(), 1);
      const maxDate = new Date();
      maxDate.setMonth(maxDate.getMonth() + 3);
      
      const prevMonth = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth() - 1, 1);
      document.getElementById('prevMonthBtn').disabled = prevMonth < minDate;
      
      const nextMonth = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth() + 1, 1);
      document.getElementById('nextMonthBtn').disabled = nextMonth > maxDate;
    }
    
    // 日付選択（1回タップで開始日選択、返却日は自動計算）
    function selectDate(date) {
      selectedStartDate = date;
      state.startDate = formatDate(date);
      
      // 返却期限を自動計算
      calculateEndDate();
      
      // 時間選択を表示
      document.getElementById('timeSection').style.display = 'block';
      
      updateDateInfo();
      renderCalendar();
      updateSections();
    }
    
    // 日付フォーマット
    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    
    // 日付情報更新
    function updateDateInfo() {
      const formatJP = (d) => `${d.getMonth()+1}月${d.getDate()}日`;
      
      if (selectedStartDate && state.days) {
        const endDate = new Date(selectedStartDate);
        endDate.setDate(endDate.getDate() + state.days - 1);
        
        document.getElementById('infoStartDate').textContent = formatJP(selectedStartDate);
        document.getElementById('infoEndDate').textContent = formatJP(endDate);
        document.getElementById('infoDays').textContent = `${state.days}日間`;
        document.getElementById('dateInfoBox').style.display = 'block';
      } else {
        document.getElementById('infoStartDate').textContent = '-';
        document.getElementById('infoEndDate').textContent = '-';
        document.getElementById('infoDays').textContent = '-';
      }
    }
    
    // 期間セクション完了チェック
    function checkPeriodComplete() {
      state.startTime = document.getElementById('startTime').value;
      updateSections();
    }
    
    // 車両クラスの料金表示を更新（プラン合計金額）
    function updateClassPrices() {
      const days = state.days || 1;
      
      // 各車両クラスカードの料金を更新
      document.querySelectorAll('.class-card').forEach(card => {
        const classId = card.dataset.classId;
        const priceEl = card.querySelector('.class-card-price');
        
        // このクラスの料金プランを取得
        const plans = AppConfig.pricingPlans.filter(p => p.carClassId === classId);
        
        // 選択した日数にマッチするプランを検索
        let matchingPlan = plans.find(p => p.days === days);
        
        if (matchingPlan) {
          // マッチするプランがあればその料金を表示
          priceEl.textContent = `${days}日間: ¥${matchingPlan.price.toLocaleString()}（税込）`;
          card.dataset.planPrice = matchingPlan.price;
          card.dataset.pricingPlanId = matchingPlan.id;
        } else {
          // マッチするプランがなければ1日料金 × 日数で計算
          const dailyPrice = parseInt(card.dataset.dailyPrice) || 0;
          const totalPrice = dailyPrice * days;
          priceEl.textContent = `${days}日間: ¥${totalPrice.toLocaleString()}（税込）`;
          card.dataset.planPrice = totalPrice;
          card.dataset.pricingPlanId = '';
        }
      });
    }
    
    // 車両クラス選択
    function selectClass(el) {
      document.querySelectorAll('.class-card').forEach(card => {
        card.classList.remove('selected');
      });
      el.classList.add('selected');
      
      state.carClassId = el.dataset.classId;
      state.vehicleClass = el.dataset.classId; // 後方互換性
      state.vehicleClassName = el.dataset.className;
      state.pricingPlanId = el.dataset.pricingPlanId || null;
      state.classPrice = parseInt(el.dataset.planPrice) || parseInt(el.dataset.dailyPrice) || 0;
      
      updateSections();
    }
    
    // 免責補償選択
    function selectInsurance(el) {
      document.querySelectorAll('[data-insurance]').forEach(card => {
        card.classList.remove('selected');
        card.querySelector('input').checked = false;
      });
      el.classList.add('selected');
      el.querySelector('input').checked = true;
      state.insurance = el.dataset.insurance;
      state.insurancePrice = parseInt(el.dataset.price);
      // 保険名を取得
      const nameEl = el.querySelector('.option-card-name');
      state.insuranceName = nameEl ? nameEl.textContent : state.insurance;
      updateSections();
    }
    
    // オプション切り替え
    function toggleOption(el) {
      el.classList.toggle('selected');
      const checkbox = el.querySelector('input');
      checkbox.checked = !checkbox.checked;
      
      const optionId = el.dataset.option;
      const optionName = el.dataset.optionName || optionId;
      const price = parseInt(el.dataset.price);
      
      if (checkbox.checked) {
        state.options.push({ id: optionId, name: optionName, price: price });
      } else {
        state.options = state.options.filter(o => o.id !== optionId);
      }
      
      state.optionsPrice = state.options.reduce((sum, o) => sum + o.price, 0);
      updateSections();
    }
    
    // 決済方法選択
    function selectPayment(el) {
      document.querySelectorAll('.payment-card').forEach(card => {
        card.classList.remove('selected');
        card.querySelector('input').checked = false;
      });
      el.classList.add('selected');
      el.querySelector('input').checked = true;
      state.payment = el.dataset.payment;
      updateSections();
    }
    
    // 料金更新
    function updateSummary() {
      const days = state.days || 1;
      
      const basePrice = state.classPrice * days;
      const insuranceTotal = state.insurancePrice * days;
      const optionsTotal = state.optionsPrice * days;
      const total = basePrice + insuranceTotal + optionsTotal;
      
      document.getElementById('summary-base').textContent = `¥${basePrice.toLocaleString()}`;
      document.getElementById('summary-insurance').textContent = `¥${insuranceTotal.toLocaleString()}`;
      document.getElementById('summary-options').textContent = `¥${optionsTotal.toLocaleString()}`;
      document.getElementById('summary-total').textContent = `¥${total.toLocaleString()}`;
    }
    
    // 確認画面へ
    function goConfirm() {
      // バリデーション
      if (!state.days) {
        alert('レンタル日数を選択してください');
        document.getElementById('section-period').scrollIntoView({ behavior: 'smooth' });
        return;
      }
      if (!state.startDate) {
        alert('受取日を選択してください');
        document.getElementById('section-period').scrollIntoView({ behavior: 'smooth' });
        return;
      }
      if (!state.startTime) {
        alert('受取時間を選択してください');
        document.getElementById('section-period').scrollIntoView({ behavior: 'smooth' });
        return;
      }
      if (!state.vehicleClass) {
        alert('車両クラスを選択してください');
        document.getElementById('section-class').scrollIntoView({ behavior: 'smooth' });
        return;
      }
      if (state.insurance === null) {
        alert('免責補償を選択してください');
        document.getElementById('section-options').scrollIntoView({ behavior: 'smooth' });
        return;
      }
      if (!state.payment) {
        alert('決済方法を選択してください');
        document.getElementById('section-payment').scrollIntoView({ behavior: 'smooth' });
        return;
      }
      
      // セッションに保存
      const days = state.days;
      const paymentNames = { card: 'クレジットカード', onsite: '現地払い', local: '現地払い' };
      
      // 支払い方法をAPI形式に変換
      const paymentMethod = state.payment === 'local' ? 'onsite' : state.payment;
      
      ReservationStorage.save({
        planDays: days,
        planLabel: days + '日',
        startDate: state.startDate,
        startTime: state.startTime,
        endDate: state.endDate,
        carClassId: state.carClassId,
        vehicleClass: state.vehicleClass,
        vehicleClassName: state.vehicleClassName,
        carClassName: state.vehicleClassName,
        pricingPlanId: state.pricingPlanId,
        classPrice: state.classPrice,
        planPrice: state.classPrice,
        insurance: state.insurance,
        insurancePlanId: state.insurance,
        insuranceName: state.insuranceName || state.insurance,
        insurancePrice: state.insurancePrice,
        options: state.options.map(opt => ({
          optionId: opt.id,
          optionName: opt.name,
          quantity: 1
        })),
        optionsPrice: state.optionsPrice,
        paymentMethod: paymentMethod,
        payment: state.payment,
        paymentName: paymentNames[state.payment],
        totalPrice: state.classPrice + (state.insurancePrice * days) + (state.optionsPrice * days)
      });
      
      window.location.href = 'reserve-confirm.html';
    }
    
    // 戻る
    function goBack() {
      window.location.href = 'mypage-new.html';
    }
    
    // ログアウト
    function logout() {
      if (confirm('ログアウトしますか?')) {
        Auth.logout();
        window.location.href = 'login.html';
      }
    }
    
    init();
  </script>
</body>
</html>
