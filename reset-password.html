<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワードリセット | TOKU-NORI レンタカー</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .reset-container {
      max-width: 400px;
      margin: 80px auto 40px;
      padding: 0 20px;
    }
    .reset-card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .reset-title {
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
      color: #333;
    }
    .reset-subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
    }
    .code-input {
      text-align: center;
      font-size: 1.5rem !important;
      letter-spacing: 8px;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background: #0056b3;
    }
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .error-message {
      background: #fee;
      color: #c00;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .success-message {
      background: #efe;
      color: #060;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: #007bff;
      text-decoration: none;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
    .password-requirements {
      font-size: 0.8rem;
      color: #666;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="images/logo-toku.svg" alt="TOKU-NORI" height="28">
        <img src="images/logo-rentacar.svg" alt="レンタカー" height="20">
      </a>
    </div>
  </header>

  <div class="reset-container">
    <div class="reset-card">
      <h1 class="reset-title">パスワードリセット</h1>
      <p class="reset-subtitle">メールで届いた認証コードと<br>新しいパスワードを入力してください</p>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="reset-form">
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required placeholder="example@email.com">
        </div>

        <div class="form-group">
          <label for="code">認証コード（6桁）</label>
          <input type="text" id="code" name="code" class="code-input" 
                 required maxlength="6" pattern="[0-9]{6}" 
                 inputmode="numeric" placeholder="000000"
                 autocomplete="one-time-code">
        </div>

        <div class="form-group">
          <label for="newPassword">新しいパスワード</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="8">
          <p class="password-requirements">8文字以上、英大文字・小文字・数字を含む</p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">パスワード（確認）</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          パスワードをリセット
        </button>
      </form>

      <div class="back-link">
        <a href="login.html">← ログイン画面に戻る</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // URLパラメータからemailを取得
    const urlParams = new URLSearchParams(window.location.search);
    const emailParam = urlParams.get('email');
    if (emailParam) {
      document.getElementById('email').value = emailParam;
    }

    // 認証コード入力を数字のみに制限
    document.getElementById('code').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
    });

    document.getElementById('reset-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const errorEl = document.getElementById('error-message');
      const successEl = document.getElementById('success-message');
      const submitBtn = document.getElementById('submit-btn');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const code = document.getElementById('code').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // バリデーション
      if (code.length !== 6) {
        errorEl.textContent = '認証コードは6桁の数字を入力してください';
        errorEl.style.display = 'block';
        return;
      }

      if (newPassword !== confirmPassword) {
        errorEl.textContent = 'パスワードが一致しません';
        errorEl.style.display = 'block';
        return;
      }

      if (newPassword.length < 8) {
        errorEl.textContent = 'パスワードは8文字以上で入力してください';
        errorEl.style.display = 'block';
        return;
      }

      // パスワード強度チェック
      const hasUpper = /[A-Z]/.test(newPassword);
      const hasLower = /[a-z]/.test(newPassword);
      const hasNumber = /[0-9]/.test(newPassword);
      if (!hasUpper || !hasLower || !hasNumber) {
        errorEl.textContent = 'パスワードには英大文字・小文字・数字を含めてください';
        errorEl.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '処理中...';

      try {
        const response = await fetch(`${AppConfig.API_BASE_URL}/v1/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code, newPassword })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'パスワードリセットに失敗しました');
        }

        successEl.textContent = 'パスワードがリセットされました。ログイン画面に移動します...';
        successEl.style.display = 'block';

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'パスワードをリセット';
      }
    });
  </script>
</body>
</html>
