<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="images/logo-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="トクノリレンタカーの利用規約。レンタカーご利用前に必ずお読みください。">
  <title>利用規約 - トクノリレンタカー</title>
  <!-- OGP / Twitter Cards -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="利用規約 - トクノリレンタカー">
  <meta property="og:description" content="トクノリレンタカーの利用規約。レンタカーご利用前に必ずお読みください。">
  <meta property="og:url" content="https://chitose-dev.github.io/rent/terms.html">
  <meta property="og:site_name" content="トクノリレンタカー">
  <meta property="og:image" content="https://chitose-dev.github.io/rent/images/logo-icon.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="利用規約 - トクノリレンタカー">
  <meta name="twitter:description" content="トクノリレンタカーの利用規約。レンタカーご利用前に必ずお読みください。">
  <meta name="twitter:image" content="https://chitose-dev.github.io/rent/images/logo-icon.png">
  <link rel="preconnect" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="dns-prefetch" href="https://rentcar-backend-dgyxfpofua-an.a.run.app">
  <link rel="stylesheet" href="common.css">
  <style>
    .document-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .document-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .document-content h1 { font-size: 28px; margin: 0 0 24px; color: #333; }
    .document-content h2 { font-size: 20px; margin: 32px 0 16px; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
    .document-content h3 { font-size: 16px; margin: 24px 0 12px; color: #555; }
    .document-content p { margin: 12px 0; line-height: 1.8; color: #444; }
    .document-content ul, .document-content ol { margin: 12px 0; padding-left: 24px; }
    .document-content li { margin: 8px 0; line-height: 1.6; }
    .document-content table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    .document-content th, .document-content td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    .document-content th { background: #f5f5f5; }
    .back-link { margin-top: 32px; text-align: center; }
    .back-link a { color: #007bff; text-decoration: none; }
    .loading { text-align: center; padding: 60px; color: #666; }
  </style>
  <link rel="canonical" href="https://chitose-dev.github.io/rent/terms.html">
</head>
<body>
  <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="header-logo">
        <img src="images/logo-icon.png" alt="TOKU-NORI" class="header-logo-icon">
        <img src="images/logo-text.png" alt="レンタカー" class="header-logo-text">
      </a>
    </div>
  </header>

  <div class="document-container" id="main-content">
    <div class="document-card">
      <div id="content" class="document-content">
        <div class="loading">読み込み中...</div>
      </div>
      <div class="back-link">
        <a href="#" onclick="goBack(); return false;">← 戻る</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
  <script>
    async function loadTerms() {
      try {
        const response = await fetch(`${AppConfig.API_BASE_URL}/v1/shop/legal-documents`);
        const data = await response.json();
        
        if (data.terms) {
          document.getElementById('content').innerHTML = marked.parse(data.terms);
        } else {
          document.getElementById('content').innerHTML = `
            <h1>利用規約</h1>
            <p>利用規約は現在準備中です。</p>
          `;
        }
      } catch (error) {
        document.getElementById('content').innerHTML = `
          <h1>利用規約</h1>
          <p>読み込みに失敗しました。</p>
        `;
      }
    }
    loadTerms();
    
    function goBack() {
      if (history.length > 1) {
        history.back();
      } else {
        window.location.href = 'login.html';
      }
    }
  </script>
</body>
</html>
